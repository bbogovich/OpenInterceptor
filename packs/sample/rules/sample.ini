; Everything the sample pack defines. Section ids are kind:id; see the docs site,
; Modding > Rulesets, for every key.

[faction:league]
Name = Frontier League
Color = 0.3, 0.8, 1.0
Hostile = raiders

[faction:raiders]
Name = Raiders
Color = 1.0, 0.35, 0.25

[beam:pulse_laser]
Name = Pulse Laser
Damage = 20
EnergyCost = 8
RateOfFire = 4
Speed = 2500
; Range is in kilometres, like the original files; RangeMetres overrides it.
Range = 2.5
Color = 0.3, 1.0, 0.6

[missile:seeker]
Name = Seeker
Speed = 900
Duration = 8
ImpactDamage = 150
ProximityDamage = 60
TurnRate = 120
LockTime = 1.5
Color = 1.0, 1.0, 0.6

; A 3D cockpit instead of 2D art: no Image, a Model drawn around the pilot's eye. The
; instruments are placed in a widescreen 1280x720 design space along the bottom edge.
[cockpit:dart3d]
Image = none
Model = models/dart_cockpit.obj
ModelOffset = 0, 0, 0
Design = 1280, 720
Instrument.message = 400, 12, 480, 30
Instrument.radar_front = 60, 560, 140, 140
Instrument.radar_rear = 1080, 560, 140, 140
Instrument.mfd = 220, 590, 260, 110
Instrument.gauge1 = 800, 610, 60, 60
Instrument.gauge2 = 870, 610, 60, 60
Instrument.gauge3 = 940, 610, 60, 60
Instrument.gauge4 = 1010, 610, 60, 60

; The League's light fighter, flown from the 3D cockpit above.
[ship:dart]
Name = Dart
Description = League light fighter (sample pack).
Model = models/dart.obj
Faction = league
Playable = yes
Cockpit = dart3d
HitPoints = 120
Shields = 80
Armor = 60
MaxSpeed = 550
Acceleration = 160
RollRate = 200
PitchRate = 100
YawRate = 100
AngularDamp = 2
LockSpeed = 1100
Energy = 400
EnergyRecharge = 50
VCT = yes
Beams = pulse_laser, pulse_laser
Missiles = seeker*6
EngineColor = 1.0, 0.6, 0.2

[ship:raider]
Name = Raider
Model = models/raider.obj
Faction = raiders
HitPoints = 100
Shields = 50
Armor = 30
MaxSpeed = 500
Acceleration = 140
RollRate = 180
PitchRate = 90
YawRate = 90
Beams = pulse_laser
Missiles = seeker*2
EngineColor = 1.0, 0.3, 0.3

[object:ring_station]
Name = Ring Station
Model = models/ring.obj
Faction = league
HitPoints = 5000
Shields = 500

[flight]
Model = newtonian
ArenaRadius = 30000
Boost = 150
Cost = 40
LockAngleDegrees = 12
RadarRange = 5000
