; The Interceptor pack binds the player's own X-COM: Interceptor data to the engine.
; It contains NO original content: every model, texture, image and sound below is a
; reference into the player's CD ("original:..."), and every balance value is inherited
; from the player's GameSettings.ini. Run with --data <path to the CD or install>.
[pack]
id = interceptor
name = X-COM: Interceptor (original data)
version = 0.1
description = The original game's ships, stations and weapons, read from your own CD.
kind = campaign
format = 1
requires_original = yes
