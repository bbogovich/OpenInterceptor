# yaml-language-server: $schema=../../../schemas/rules.schema.json
# Ships of X-COM: Interceptor.
#
# Hull values (HitPoints, turn rates, LockSpeed, MaxSpeed, Side) are inherited from the
# player's GameSettings.ini. The class -> mesh mapping comes from the string table in
# Interceptor.exe; which alien mesh is which named class is DERIVED (see the docs site,
# Original game > Formats > Object table).
#
# Shields and armour come from fitted equipment, as in the original: `fitted:` names the
# ShieldType*/ArmorType* sections a class carries by default (DERIVED for each class) and
# the engine reads their protection from the player's GameSettings.ini; a campaign
# craft's own fit replaces them; damage.difficulty in systems.yaml scales them by level.
# Classes without a fit and Acceleration are engine values (DERIVED). Every ship shares
# the original's 1000-point energy pool (power: in systems.yaml). Model = original:<MESH>
# reads the XMSH resource of that name.
#
# Motion (flight.drive in flight.yaml; Interceptor.exe, verified): mass is each hull's
# base in kg, from the exe's own table; the player's thrust is the fitted engine's
# Special in kN (which engine each hull carries by default is DERIVED). AI ships ignore
# mass and thrust: ai_speed is the exe's per-class drive factor S (top speed S/2, held to
# 100-500; aliens 1-3 gain per difficulty level). ai_turn is the exe's per-class AI turn
# table in rad/s (which axis is which is DERIVED); classes without it turn at 2, 2, 3.
#
# --- X-COM interceptors (playable) ----------------------------------------------------
#

ships:
  lightning:
    inherit: original:GameSettings.ini/Ship_IntType1
    pilot_grade: 0   # X-COM pilots (notes/re/unknowns-2026-11.md §5, VERIFIED)
    voice: mpilot1   # DERIVED (the pilot's record picks it in the original)
    mass: 6700
    ai_speed: 500
    ai_turn: {pitch: 2.1, yaw: 2.0, roll: 2.55}
    name: X-1A Lightning II
    description: Fast, fragile patrol interceptor.
    model_set: lightning
    playable: true
    cockpit: a
    fitted: {shield: original:GameSettings.ini/ShieldType1, armor: original:GameSettings.ini/ArmorType1, engine: original:GameSettings.ini/EngineType1}   # its default equipment (DERIVED)
    acceleration: 140
    beams: [laser_cannon, laser_cannon]
    missiles: {xwinder: 5, sidestep: 4}
    # Special systems: a Stage 2 testbed fit until loadouts arrive (Stage 4). The hull has
    # two special mounts (SpecialSystemMounts = 2).
    systems+: [ecm, damage_control]
    engine_color: [0.5, 0.7, 1.0]
    behaviour: xcom_pilot
  firestar:
    inherit: original:GameSettings.ini/Ship_IntType2
    pilot_grade: 0   # X-COM pilots (notes/re/unknowns-2026-11.md §5, VERIFIED)
    voice: mpilot1   # DERIVED (the pilot's record picks it in the original)
    mass: 12700
    ai_speed: 500
    ai_turn: {pitch: 1.7, yaw: 1.4, roll: 1.5}
    name: S-2 Firestar
    description: Tri-titanium multirole fighter.
    model_set: firestar
    playable: true
    cockpit: b
    fitted: {shield: original:GameSettings.ini/ShieldType1, armor: original:GameSettings.ini/ArmorType2, engine: original:GameSettings.ini/EngineType2}   # its default equipment (DERIVED)
    acceleration: 110
    beams: [gatling_laser, gatling_laser, laser_cannon, laser_cannon]
    missiles: {xwinder: 5, permeator: 3, sidestep: 4}
    # Testbed fit for the four special mounts.
    systems+: [ecm, damage_control, tractor]
    engine_color: [0.5, 0.7, 1.0]
    behaviour: xcom_pilot
  avenger:
    inherit: original:GameSettings.ini/Ship_IntType3
    pilot_grade: 0   # X-COM pilots (notes/re/unknowns-2026-11.md §5, VERIFIED)
    voice: mpilot1   # DERIVED (the pilot's record picks it in the original)
    mass: 22700
    ai_speed: 500
    ai_turn: {pitch: 1.5, yaw: 1.3, roll: 1.5}
    name: M-3 Super Avenger
    description: Alien-alloy heavy fighter-bomber.
    model_set: avenger
    playable: true
    cockpit: c
    fitted: {shield: original:GameSettings.ini/ShieldType3, armor: original:GameSettings.ini/ArmorType2, engine: original:GameSettings.ini/EngineType3}   # its default equipment (DERIVED)
    acceleration: 90
    beams: [heavy_laser, heavy_laser, laser_cannon, laser_cannon]
    missiles: {xwinder: 5, permeator: 3, sidestep: 4, fusion: 2, parallax_torpedo: 2, cloaking_torpedo: 2, doppelganger: 1, enveloping_torpedo: 2}
    # Testbed fit for the six special mounts: every special system, to try them all.
    systems+: [advanced_ecm, damage_control, tractor, cloak]
    vct: true
    engine_color: [0.5, 0.7, 1.0]
  # --- Aliens ---------------------------------------------------------------------------
  # Alien hulls have no flight values in the original file (they were coded per class);
  # the values here are engine estimates tuned to the documented roles.
    behaviour: xcom_pilot
  wraith:
    inherit: original:GameSettings.ini/Ship_AlienType1
    pilot_grade: 1   # AlienType1/2 early on; grade 2 from month 2 is not modelled (VERIFIED)
    mass: 5500
    ai_speed: {min: 350, max: 400, level_step: 40}
    ai_turn: {pitch: 2.3, yaw: 2.1, roll: 3.75}
    name: Wraith
    description: Light, agile alien saucer.
    model_set: wraith
    shields: 240   # DERIVED
    armor: 120   # DERIVED
    max_speed: 650
    acceleration: 160
    roll_rate: 220
    pitch_rate: 110
    yaw_rate: 110
    vct: true
    beams: [plasma_cannon, plasma_cannon]
    missiles: {elerium_torpedo: 2}
    engine_color: [0.4, 1.0, 0.4]
    behaviour: wraith
  spectre:
    inherit: original:GameSettings.ini/Ship_AlienType2
    pilot_grade: 1   # AlienType1/2 early on; grade 2 from month 2 is not modelled (VERIFIED)
    mass: 11000
    ai_speed: {min: 350, max: 400, level_step: 40}
    ai_turn: {pitch: 1.7, yaw: 1.7, roll: 0.75}
    name: Spectre
    description: Multirole alien saucer.
    model_set: spectre
    fitted: {shield: original:GameSettings.ini/ShieldType2}   # its default equipment (DERIVED)
    armor: 180   # DERIVED
    max_speed: 600
    acceleration: 130
    roll_rate: 180
    pitch_rate: 90
    yaw_rate: 90
    vct: true
    beams: [plasma_cannon, plasma_cannon]
    missiles: {elerium_torpedo: 3}
    engine_color: [0.4, 1.0, 0.4]
    behaviour: spectre
  phantasm:
    inherit: original:GameSettings.ini/Ship_AlienType3
    pilot_grade: 3   # AlienType3 (VERIFIED)
    mass: 19000
    ai_speed: {min: 450, max: 500, level_step: 30}
    ai_turn: {pitch: 1.3, yaw: 1.3, roll: 1.5}
    name: Phantasm
    description: Heavy alien beam gunship.
    model_set: phantasm
    fitted: {shield: original:GameSettings.ini/ShieldType2, armor: original:GameSettings.ini/ArmorType3}   # its default equipment (DERIVED)
    max_speed: 520
    acceleration: 100
    roll_rate: 120
    pitch_rate: 60
    yaw_rate: 60
    vct: true
    beams: [plasma_cannon, plasma_cannon, tachyon_pulser, plasma_cannon]
    missiles: {elerium_torpedo: 3}
    engine_color: [0.4, 1.0, 0.4]
    behaviour: phantasm
    # Its turrets (README §8.8, VERIFIED; model positions with z negated) besides its guns.
    modules:
      - {at: [0, -2, 0], facing: [0, -1, 0], class: phantasm_phase}
      - {at: [0, -4.25, 0], facing: [0, -1, 0], class: phantasm_plasma_low}
      - {at: [0, 4.25, 0], facing: [0, 1, 0], class: phantasm_plasma_top}
  shade:
    inherit: original:GameSettings.ini/Ship_AlienType4
    pilot_grade: 4   # AlienType4 (VERIFIED)
    mass: 11000
    ai_speed: 500
    name: Shade
    description: Elite alien fighter flown by Aereon pilots.
    model_set: shade
    fitted: {shield: original:GameSettings.ini/ShieldType4, armor: original:GameSettings.ini/ArmorType3}   # its default equipment (DERIVED)
    accumulator_shields: true   # ShieldType4 (README §4, VERIFIED)
    max_speed: 700
    acceleration: 180
    roll_rate: 220
    pitch_rate: 120
    yaw_rate: 120
    vct: true
    # Accumulator shields, VCT, cloak and ECM (guide: the Shade).
    systems+: [cloak, advanced_ecm]
    beams: [plasma_cannon, plasma_cannon, plasma_cannon]
    missiles: {elerium_torpedo: 4}
    engine_color: [0.8, 0.4, 1.0]
    behaviour: shade
    # A phase turret at (0, -0.41, -9.82) (VERIFIED; z negated), facing aft (DERIVED: the
    # exe copies its facing from elsewhere).
    modules:
      - {at: [0, -0.41, 9.82], facing: [0, 0, 1], class: shade_phase}
  harbinger:
    inherit: original:GameSettings.ini/Ship_AlienType5
    mass: 110000
    ai_speed: {min: 200, max: 250}
    name: Harbinger
    description: Alien tug; tows cargo and tries to capture disabled ships.
    model_set: harbinger
    kind: capital
    # Tows cargo and tries to capture disabled ships (guide).
    systems+: [tractor]
    fitted: {shield: original:GameSettings.ini/ShieldType4, armor: original:GameSettings.ini/ArmorType3}   # its default equipment (DERIVED)
    accumulator_shields: true   # ShieldType4 (README §4, VERIFIED)
    max_speed: 300
    acceleration: 50
    roll_rate: 40
    pitch_rate: 25
    yaw_rate: 25
    engine_color: [0.4, 1.0, 0.4]
    behaviour: harbinger
    # No guns of its own (AlienType5 runs no attack routine): three tachyon turrets (VERIFIED;
    # z negated; the pair's facing is copied in the exe, DERIVED: ahead).
    modules:
      - {at: [13.27, 7.2, -10.31], facing: [0, 0, -1], class: harbinger_tachyon}
      - {at: [-13.27, 7.2, -10.31], facing: [0, 0, -1], class: harbinger_tachyon}
      - {at: [0, -5, 15], facing: [0, 0, 1], class: harbinger_tachyon_tail}
  alien_container:
    inherit: original:GameSettings.ini/Ship_AlienType6
    mass: 157000
    ai_speed: {min: 175, max: 349}
    name: Alien Container
    description: Cargo towed by a Harbinger (class mapping derived).
    model_set: alien_container
    kind: freighter
    max_speed: 150
    acceleration: 20
    roll_rate: 10
    pitch_rate: 10
    yaw_rate: 10
  spirit:
    inherit: original:GameSettings.ini/Ship_AlienFreighter
    mass: 110000
    ai_speed: {min: 100, max: 174}
    ai_turn: {pitch: 0.7, yaw: 0.7, roll: 0.3}
    name: Spirit
    description: Alien freighter; launches drones.
    model_set: spirit
    kind: freighter
    shields: 450   # DERIVED
    armor: 450   # DERIVED
    max_speed: 250
    acceleration: 40
    roll_rate: 30
    pitch_rate: 20
    yaw_rate: 20
    engine_color: [0.4, 1.0, 0.4]
    # No guns of its own: two plasma turrets (README §8.8, VERIFIED).
    modules:
      - {at: [0, -23, 0], facing: [0, -1, 0], class: spirit_plasma_low}
      - {at: [0, 27, 0], facing: [0, 1, 0], class: spirit_plasma_top}
  drone:
    inherit: original:GameSettings.ini/Ship_AlienDrone
    ai_speed: 250
    name: Alien Drone
    description: Fast, unarmoured, psionically controlled.
    model_set: drone
    kind: drone
    max_speed: 750
    acceleration: 220
    roll_rate: 250
    pitch_rate: 130
    yaw_rate: 130
    beams: [plasma_cannon]
    engine_color: [0.4, 1.0, 0.4]
  # --- Pirates and corporations (same three hulls, different paint) ---------------------
    behaviour: drone
  pirate_lightning:
    inherit: lightning
    pilot_grade: 1   # pirates (VERIFIED)
    ai_turn: {pitch: 2, yaw: 2, roll: 3}
    faction: pirate
    playable: false
    name: Pirate Lightning II
    model_set: pirate_lightning
    behaviour: human_pilot
  pirate_firestar:
    inherit: firestar
    pilot_grade: 1   # pirates (VERIFIED)
    faction: pirate
    playable: false
    name: Pirate Firestar
    model_set: pirate_firestar
    behaviour: human_pilot
  pirate_avenger:
    inherit: avenger
    pilot_grade: 1   # pirates (VERIFIED)
    faction: pirate
    playable: false
    name: Pirate Super Avenger
    model_set: pirate_avenger
    behaviour: human_pilot
  rogue_freighter:
    inherit: original:GameSettings.ini/Ship_PirateFreighter
    pilot_grade: 1   # pirates (VERIFIED)
    mass: 157000
    ai_speed: {min: 100, max: 174}
    name: Rogue Freighter
    model_set: rogue_freighter
    kind: freighter
    shields: 450   # DERIVED
    armor: 600   # DERIVED
    max_speed: 250
    acceleration: 40
    roll_rate: 30
    pitch_rate: 20
    yaw_rate: 20
    # No beams of its own: two fixed laser turrets (0x593e13, VERIFIED), as modules; the
    # model-space positions are the exe's with z negated.
    modules:
      - {at: [0, 4.27, -161.68], facing: [0, 0, -1], class: freighter_turret_fore}
      - {at: [0, 40.937, 77], facing: [0, 0, 1], class: freighter_turret_aft}
    missiles: {xwinder: 4}
  corporate_lightning:
    inherit: lightning
    pilot_grade: 0   # corporate pilots' grade is not traced (DERIVED: as X-COM's)
    faction: corporate
    playable: false
    name: Corporate Lightning II
    model_set: corporate_lightning
    behaviour: human_pilot
  corporate_firestar:
    inherit: firestar
    pilot_grade: 0   # corporate pilots' grade is not traced (DERIVED: as X-COM's)
    faction: corporate
    playable: false
    name: Corporate Firestar
    model_set: corporate_firestar
    behaviour: human_pilot
  corporate_avenger:
    inherit: avenger
    pilot_grade: 0   # corporate pilots' grade is not traced (DERIVED: as X-COM's)
    faction: corporate
    playable: false
    name: Corporate Super Avenger
    model_set: corporate_avenger
    behaviour: human_pilot
  xcom_freighter:
    point_defence: {range: 900m, rate: 3, chance: 35%, energy: 4}
    inherit: original:GameSettings.ini/Ship_XCOMFreighter
    mass: 157000
    ai_speed: {min: 100, max: 174}
    ai_turn: {pitch: 1.0, yaw: 1.0, roll: 0.3}
    name: Star Ranger Freighter
    model_set: xcom_freighter
    kind: freighter
    shields: 450   # DERIVED
    armor: 600   # DERIVED
    max_speed: 250
    acceleration: 40
    roll_rate: 30
    pitch_rate: 20
    yaw_rate: 20
    # No beams of its own: two fixed laser turrets (0x593e13, VERIFIED), as modules; the
    # model-space positions are the exe's with z negated.
    modules:
      - {at: [0, 4.27, -161.68], facing: [0, 0, -1], class: freighter_turret_fore}
      - {at: [0, 40.937, 77], facing: [0, 0, 1], class: freighter_turret_aft}
  patton:
    point_defence: {range: 900m, rate: 3, chance: 35%, energy: 4}
    inherit: original:GameSettings.ini/Ship_PattonClass
    mass: 250000
    ai_speed: 100
    ai_turn: {pitch: 0.3, yaw: 0.3, roll: 0.15}
    name: Patton-class Research Cruiser
    model_set: patton
    kind: capital
    shields: 1200   # DERIVED
    armor: 1500   # DERIVED
    max_speed: 150
    acceleration: 15
    roll_rate: 8
    pitch_rate: 5
    yaw_rate: 5
    beams: [laser_cannon]
