# yaml-language-server: $schema=../../../schemas/rules.schema.json
# Ships of X-COM: Interceptor.
#
# Hull values (HitPoints, turn rates, LockSpeed, MaxSpeed, Side) are inherited from the
# player's GameSettings.ini. The class -> mesh mapping comes from the string table in
# Interceptor.exe; which alien mesh is which named class is DERIVED (see the docs site,
# Original game > Formats > Object table).
#
# Shields and armour come from fitted equipment, as in the original: `fitted:` names the
# ShieldType*/ArmorType* sections a class carries by default (DERIVED for each class) and
# the engine reads their protection from the player's GameSettings.ini; a campaign
# craft's own fit replaces them. Classes without a fit, Energy, EnergyRecharge and
# Acceleration are engine values (DERIVED). Model = original:<MESH> reads the XMSH
# resource of that name.
#
# --- X-COM interceptors (playable) ----------------------------------------------------
#

ships:
  lightning:
    inherit: original:GameSettings.ini/Ship_IntType1
    name: X-1A Lightning II
    description: Fast, fragile patrol interceptor.
    model_set: lightning
    playable: true
    cockpit: a
    fitted: {shield: original:GameSettings.ini/ShieldType1, armor: original:GameSettings.ini/ArmorType1}   # its default equipment (DERIVED)
    energy: 400
    energy_recharge: 45
    acceleration: 140
    beams: [laser_cannon, laser_cannon]
    missiles: {xwinder: 5, sidestep: 4}
    # Special systems: a Stage 2 testbed fit until loadouts arrive (Stage 4). The hull has
    # two special mounts (SpecialSystemMounts = 2).
    systems+: [ecm, damage_control]
    engine_color: [0.5, 0.7, 1.0]
    behaviour: xcom_pilot
  firestar:
    inherit: original:GameSettings.ini/Ship_IntType2
    name: S-2 Firestar
    description: Tri-titanium multirole fighter.
    model_set: firestar
    playable: true
    cockpit: b
    fitted: {shield: original:GameSettings.ini/ShieldType1, armor: original:GameSettings.ini/ArmorType2}   # its default equipment (DERIVED)
    energy: 500
    energy_recharge: 55
    acceleration: 110
    beams: [gatling_laser, gatling_laser, laser_cannon, laser_cannon]
    missiles: {xwinder: 5, permeator: 3, sidestep: 4}
    # Testbed fit for the four special mounts.
    systems+: [ecm, damage_control, tractor]
    engine_color: [0.5, 0.7, 1.0]
    behaviour: xcom_pilot
  avenger:
    inherit: original:GameSettings.ini/Ship_IntType3
    name: M-3 Super Avenger
    description: Alien-alloy heavy fighter-bomber.
    model_set: avenger
    playable: true
    cockpit: c
    fitted: {shield: original:GameSettings.ini/ShieldType3, armor: original:GameSettings.ini/ArmorType2}   # its default equipment (DERIVED)
    energy: 600
    energy_recharge: 65
    acceleration: 90
    beams: [heavy_laser, heavy_laser, laser_cannon, laser_cannon]
    missiles: {xwinder: 5, permeator: 3, sidestep: 4, fusion: 2, parallax_torpedo: 2, cloaking_torpedo: 2, doppelganger: 1, enveloping_torpedo: 2}
    # Testbed fit for the six special mounts: every special system, to try them all.
    systems+: [advanced_ecm, damage_control, tractor, cloak]
    vct: true
    engine_color: [0.5, 0.7, 1.0]
  # --- Aliens ---------------------------------------------------------------------------
  # Alien hulls have no flight values in the original file (they were coded per class);
  # the values here are engine estimates tuned to the documented roles.
    behaviour: xcom_pilot
  wraith:
    inherit: original:GameSettings.ini/Ship_AlienType1
    name: Wraith
    description: Light, agile alien saucer.
    model_set: wraith
    shields: 240   # DERIVED
    armor: 120   # DERIVED
    max_speed: 650
    acceleration: 160
    roll_rate: 220
    pitch_rate: 110
    yaw_rate: 110
    vct: true
    beams: [plasma_cannon, plasma_cannon]
    missiles: {elerium_torpedo: 2}
    engine_color: [0.4, 1.0, 0.4]
    behaviour: wraith
  spectre:
    inherit: original:GameSettings.ini/Ship_AlienType2
    name: Spectre
    description: Multirole alien saucer.
    model_set: spectre
    fitted: {shield: original:GameSettings.ini/ShieldType2}   # its default equipment (DERIVED)
    armor: 180   # DERIVED
    max_speed: 600
    acceleration: 130
    roll_rate: 180
    pitch_rate: 90
    yaw_rate: 90
    vct: true
    beams: [plasma_cannon, plasma_cannon]
    missiles: {elerium_torpedo: 3}
    engine_color: [0.4, 1.0, 0.4]
    behaviour: spectre
  phantasm:
    inherit: original:GameSettings.ini/Ship_AlienType3
    name: Phantasm
    description: Heavy alien beam gunship.
    model_set: phantasm
    fitted: {shield: original:GameSettings.ini/ShieldType2, armor: original:GameSettings.ini/ArmorType3}   # its default equipment (DERIVED)
    max_speed: 520
    acceleration: 100
    roll_rate: 120
    pitch_rate: 60
    yaw_rate: 60
    vct: true
    beams: [plasma_cannon, plasma_cannon, tachyon_pulser, plasma_cannon]
    missiles: {elerium_torpedo: 3}
    engine_color: [0.4, 1.0, 0.4]
    behaviour: phantasm
  shade:
    inherit: original:GameSettings.ini/Ship_AlienType4
    name: Shade
    description: Elite alien fighter flown by Aereon pilots.
    model_set: shade
    fitted: {shield: original:GameSettings.ini/ShieldType4, armor: original:GameSettings.ini/ArmorType3}   # its default equipment (DERIVED)
    max_speed: 700
    acceleration: 180
    roll_rate: 220
    pitch_rate: 120
    yaw_rate: 120
    vct: true
    # Accumulator shields, VCT, cloak and ECM (guide: the Shade).
    systems+: [cloak, advanced_ecm]
    beams: [plasma_cannon, plasma_cannon, plasma_cannon]
    missiles: {elerium_torpedo: 4}
    engine_color: [0.8, 0.4, 1.0]
    behaviour: shade
  harbinger:
    inherit: original:GameSettings.ini/Ship_AlienType5
    name: Harbinger
    description: Alien tug; tows cargo and tries to capture disabled ships.
    model_set: harbinger
    kind: capital
    # Tows cargo and tries to capture disabled ships (guide).
    systems+: [tractor]
    fitted: {shield: original:GameSettings.ini/ShieldType4, armor: original:GameSettings.ini/ArmorType3}   # its default equipment (DERIVED)
    max_speed: 300
    acceleration: 50
    roll_rate: 40
    pitch_rate: 25
    yaw_rate: 25
    beams: [tachyon_pulser, tachyon_pulser]
    engine_color: [0.4, 1.0, 0.4]
    behaviour: harbinger
  alien_container:
    inherit: original:GameSettings.ini/Ship_AlienType6
    name: Alien Container
    description: Cargo towed by a Harbinger (class mapping derived).
    model_set: alien_container
    kind: freighter
    max_speed: 150
    acceleration: 20
    roll_rate: 10
    pitch_rate: 10
    yaw_rate: 10
  spirit:
    inherit: original:GameSettings.ini/Ship_AlienFreighter
    name: Spirit
    description: Alien freighter; launches drones.
    model_set: spirit
    kind: freighter
    shields: 450   # DERIVED
    armor: 450   # DERIVED
    max_speed: 250
    acceleration: 40
    roll_rate: 30
    pitch_rate: 20
    yaw_rate: 20
    beams: [plasma_cannon]
    engine_color: [0.4, 1.0, 0.4]
  drone:
    inherit: original:GameSettings.ini/Ship_AlienDrone
    name: Alien Drone
    description: Fast, unarmoured, psionically controlled.
    model_set: drone
    kind: drone
    max_speed: 750
    acceleration: 220
    roll_rate: 250
    pitch_rate: 130
    yaw_rate: 130
    beams: [plasma_cannon]
    engine_color: [0.4, 1.0, 0.4]
  # --- Pirates and corporations (same three hulls, different paint) ---------------------
    behaviour: drone
  pirate_lightning:
    inherit: lightning
    faction: pirate
    playable: false
    name: Pirate Lightning II
    model_set: pirate_lightning
    behaviour: human_pilot
  pirate_firestar:
    inherit: firestar
    faction: pirate
    playable: false
    name: Pirate Firestar
    model_set: pirate_firestar
    behaviour: human_pilot
  pirate_avenger:
    inherit: avenger
    faction: pirate
    playable: false
    name: Pirate Super Avenger
    model_set: pirate_avenger
    behaviour: human_pilot
  rogue_freighter:
    inherit: original:GameSettings.ini/Ship_PirateFreighter
    name: Rogue Freighter
    model_set: rogue_freighter
    kind: freighter
    shields: 450   # DERIVED
    armor: 600   # DERIVED
    max_speed: 250
    acceleration: 40
    roll_rate: 30
    pitch_rate: 20
    yaw_rate: 20
    beams: [laser_cannon, laser_cannon]
    missiles: {xwinder: 4}
  corporate_lightning:
    inherit: lightning
    faction: corporate
    playable: false
    name: Corporate Lightning II
    model_set: corporate_lightning
    behaviour: human_pilot
  corporate_firestar:
    inherit: firestar
    faction: corporate
    playable: false
    name: Corporate Firestar
    model_set: corporate_firestar
    behaviour: human_pilot
  corporate_avenger:
    inherit: avenger
    faction: corporate
    playable: false
    name: Corporate Super Avenger
    model_set: corporate_avenger
    behaviour: human_pilot
  xcom_freighter:
    point_defence: {range: 900m, rate: 3, chance: 35%, energy: 4}
    inherit: original:GameSettings.ini/Ship_XCOMFreighter
    name: Star Ranger Freighter
    model_set: xcom_freighter
    kind: freighter
    shields: 450   # DERIVED
    armor: 600   # DERIVED
    max_speed: 250
    acceleration: 40
    roll_rate: 30
    pitch_rate: 20
    yaw_rate: 20
    beams: [laser_cannon]
  patton:
    point_defence: {range: 900m, rate: 3, chance: 35%, energy: 4}
    inherit: original:GameSettings.ini/Ship_PattonClass
    name: Patton-class Research Cruiser
    model_set: patton
    kind: capital
    shields: 1200   # DERIVED
    armor: 1500   # DERIVED
    max_speed: 150
    acceleration: 15
    roll_rate: 8
    pitch_rate: 5
    yaw_rate: 5
    beams: [laser_cannon]
