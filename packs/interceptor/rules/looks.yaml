# yaml-language-server: $schema=../../../schemas/rules.schema.json
# Looks of X-COM: Interceptor: the original's wreck table and each class's model set.
#
# The program holds a table of 28 named wreck sets of five chunk meshes each (sets with
# fewer chunks repeat the first), plus generic rubble (chunk1-6), alien body parts that
# float in alien wrecks, and the shock-wave meshes. The set names (in comments) and mesh
# names below are read from Interceptor.exe (VERIFIED); which class uses which set
# follows the names (DERIVED). "Random" sets throw 3 to 5 of their chunks.
# Explosions: the original uses XSPT sprite animations, not yet decoded; the fireballs
# here are the engine's (DEVIATION).

effects:
  explosion_fighter: {size: 2.5, duration: 1.3s, color: [1, 0.62, 0.25]}
  explosion_alien: {size: 2.5, duration: 1.4s, color: [0.6, 0.9, 1], shockwave: true}
  explosion_capital: {size: 2, duration: 2.6s, color: [1, 0.55, 0.2], shockwave: true}
  explosion_station: {size: 1.5, duration: 4s, color: [1, 0.75, 0.4], shockwave: true}

