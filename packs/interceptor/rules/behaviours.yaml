# yaml-language-server: $schema=../../../schemas/rules.schema.json
# AI behaviours for X-COM: Interceptor. Values per level run beginner, experienced,
# veteran, genius, superhuman.
#
# How the fighters attack is the original's own routine (Interceptor.exe, verified; see
# notes/re/flight README section 5.1), in original_attack below: fire when the aim point
# is within 1.5-2.5 deg and the target within 2.0-2.5 km (by level), missiles within half
# that range at least 5 s apart, lead only inside 1,750 m, and an aim that errs in the
# lead time by the pilot's Accuracy (50 % without a record: campaign pilots are not yet
# handed to battle, and a scenario may give one with pilot:).
# Only the Wraith, Spectre and drone wait between shots. When classes break off, jink or
# flee is DERIVED from the strategy guide's descriptions (Wraiths are agile and evasive,
# Harbingers tow disabled ships, drones are fast and reckless) and tuned in the testbed.

behaviours:
  original_attack:
    start: engage
    states:
      engage:
        do: attack
        range: {per_level: [2km, 2.125km, 2.25km, 2.375km, 2.5km]}
        fire_cone: {per_level: [1.5, 1.75, 2, 2.25, 2.5]}
        burst: 1s
        pause: 0s
        missiles: 5s
        missile_range: {per_level: [1km, 1.0625km, 1.125km, 1.1875km, 1.25km]}
        # Break off under 250 m; missiles on the pilot's own lock: a timer starts while
        # the aim is within 5 deg on both axes, and a missile may go during the sensor's
        # lock time after that with a 5 + 2 x level % chance per frame (as the code reads).
        break_off: 250m
        lock_cone: 5
        missile_chance: {per_level: [5%, 7%, 9%, 11%, 13%]}
    # The pilot's own Accuracy (50 with no record), held below level 2 (Veteran) to
    # 50-100 for X-COM and 25+10d to 50+10d for others; the original's steering law; all
    # mounts with chance (Intelligence + Accuracy) / 2 near the aim point.
    skill:
      accuracy: pilot
      pilot_clamp: {below_level: 2, own: [50, 100], others: [25, 50], per_level: 10}
      steer: original
      fire_mode: pilot
      lead_range: 1750m
      reaction: 0.1s

  wraith:
    inherit: original_attack
    states:
      # One trigger pull every 500 + 60 x (4 - level) ms (verified).
      engage: {burst: 0.02s, pause: {per_level: [0.74s, 0.68s, 0.62s, 0.56s, 0.5s]}}
      jink: {do: evade, duration: 2s}
      flee: {do: retreat, jump: true}
    transitions:
      - {from: engage, to: jink, when: "hit_recently(0.3s) and random(0.4)"}
      - {from: jink, to: engage, when: "time_in_state > 2s"}
      - {from: "*", to: flee, when: "hull < 15% and difficulty >= veteran"}

  spectre:
    inherit: wraith

  phantasm:
    inherit: original_attack

  # Elite Aereon pilots.
  shade:
    systems: {cloak: target_distance > 2km, ecm: missiles_incoming(3km) > 0, shields_first: hull < 50%}
    inherit: phantasm
    states:
      jink: {do: evade, duration: 1.5s}
    transitions:
      - {from: engage, to: jink, when: "hit_recently(0.3s) and random(0.5)"}
      - {from: jink, to: engage, when: "time_in_state > 1.5s"}

  # Tows cargo and tries to capture disabled ships (guide).
  harbinger:
    start: work
    states:
      work: {do: tow, range: 6km}
      fight: {do: attack, range: 1.2km, burst: 0.8s, pause: 2s, missiles: 0}
    transitions:
      - {from: work, to: fight, when: "not prize_near(6km) and threats(1.5km) > 0"}
      - {from: fight, to: work, when: "prize_near(6km)"}
    skill: {aim: 0.3, reaction: 1s}

  drone:
    inherit: original_attack
    states:
      # One trigger pull every 1,500 + 50 x (4 - level) ms; no missiles (verified).
      engage: {burst: 0.02s, pause: {per_level: [1.7s, 1.65s, 1.6s, 1.55s, 1.5s]}, missiles: 0}

  # Pirates and corporate pilots fly the same human hulls.
  human_pilot:
    inherit: original_attack
    systems: {ecm: missiles_incoming(3km) > 0, shields_first: hull < 50%}
    states:
      flee: {do: retreat, jump: true}
    transitions:
      - {from: "*", to: flee, when: "hull < 25%"}

  # X-COM wingmen.
  xcom_pilot:
    inherit: original_attack
    systems: {ecm: missiles_incoming(3km) > 0, shields_first: hull < 50%}
