; The three original cockpits. Which hull uses which cockpit is DERIVED (one per hull).
; Instrument.<name> = x, y, width, height in the 640x480 design space of the image.
; Instruments the engine draws: message, radar_front, radar_rear, mfd, gauge1..gauge4
; (speed, energy, shields, hull). Move them to match your own cockpit art.
; The radar rectangles enclose the round glass of each scope, measured from the art
; (crosshair centre +-1 px); the engine draws contacts only, the art supplies the rings.

