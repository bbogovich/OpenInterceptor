# yaml-language-server: $schema=../../../schemas/rules.schema.json
# Stations and other large static objects. Kind = station is the default for [object:*].
# Hull points come from the player's GameSettings.ini: each station inherits its *HP
# section, and its hull is that chart's HP1-HP4 summed (DERIVED).
#

objects:
  xcom_base:
    point_defence: {range: 1.2km, rate: 4, chance: 40%, energy: 3}
    name: X-COM Base
    faction: xcom
    model_set: xcom_base
    inherit: original:GameSettings.ini/XCOMBaseHP   # hull = HP1+HP2+HP3+HP4 (DERIVED)
    shields: 1000
    modules:
      - {slot: '0', class: xcom_beam_defense}
      - {slot: '1', class: xcom_beam_defense}
      - {slot: '2', class: xcom_beam_defense}
      - {slot: '3', class: xcom_shield_generator}
      - {slot: '4', class: xcom_hangar}
      - {slot: '5', class: xcom_shield_generator}
  xcom_outpost:
    name: Corporate Outpost
    faction: corporate
    model_set: xcom_outpost
    inherit: original:GameSettings.ini/XCOMOutpostHP   # hull = HP1+HP2+HP3+HP4 (DERIVED)
  xcom_opp:
    name: Ore Processing Plant
    faction: corporate
    model_set: xcom_opp
    inherit: original:GameSettings.ini/XCOMOPPHP   # hull = HP1+HP2+HP3+HP4 (DERIVED)
  alien_base:
    point_defence: {range: 1.2km, rate: 4, chance: 40%, energy: 3}
    name: Alien Base
    faction: alien
    model_set: alien_base
    inherit: original:GameSettings.ini/AlienBaseHP   # hull = HP1+HP2+HP3+HP4 (DERIVED)
    shields: 1500
    modules:
      - {slot: '0', class: alien_beam_pod}
      - {slot: '1', class: alien_shield_pod}
      - {slot: '2', class: alien_beam_pod}
      - {slot: '3', class: alien_shield_pod}
      - {slot: '4', class: alien_beam_pod}
      - {slot: '5', class: alien_beam_pod}
  alien_outpost:
    name: Alien Outpost
    faction: alien
    model_set: alien_outpost
    inherit: original:GameSettings.ini/AlienOutpostHP   # hull = HP1+HP2+HP3+HP4 (DERIVED)
  alien_opp:
    name: Alien Mining Platform
    faction: alien
    model_set: alien_opp
    inherit: original:GameSettings.ini/AlienOPPHP   # hull = HP1+HP2+HP3+HP4 (DERIVED)
  pirate_base:
    point_defence: {range: 1.2km, rate: 4, chance: 40%, energy: 3}
    name: Pirate Base
    faction: pirate
    model_set: pirate_base
    inherit: original:GameSettings.ini/PirateBaseHP   # hull = HP1+HP2+HP3+HP4 (DERIVED)
  arms_dealer:
    name: Arms Dealer Base
    faction: neutral
    model_set: arms_dealer
    inherit: original:GameSettings.ini/PirateArmsHP   # hull = HP1+HP2+HP3+HP4 (DERIVED)
  science_station:
    name: GSC Science Station
    faction: corporate
    model_set: science_station
    inherit: original:GameSettings.ini/ScienceHP   # hull = HP1+HP2+HP3+HP4 (DERIVED)
  nova_science:
    name: Nova Science Station
    faction: corporate
    model_set: nova_science
    inherit: original:GameSettings.ini/NovaScienceHP   # hull = HP1+HP2+HP3+HP4 (DERIVED)
  asteroid:
    name: Asteroid
    faction: neutral
    model_set: asteroid
    hit_points: 20000
