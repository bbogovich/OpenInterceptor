# yaml-language-server: $schema=../../../schemas/rules.schema.json
# Stations and other large static objects. Kind = station is the default for [object:*].
# HitPoints use the first value of the original *HP sections (HP1); per-module damage
# arrives in Stage 2.
#

objects:
  xcom_base:
    point_defence: {range: 1.2km, rate: 4, chance: 40%, energy: 3}
    name: X-COM Base
    faction: xcom
    model_set: xcom_base
    hit_points: 6000
    shields: 1000
    modules:
      - {slot: '0', class: xcom_beam_defense}
      - {slot: '1', class: xcom_beam_defense}
      - {slot: '2', class: xcom_beam_defense}
      - {slot: '3', class: xcom_shield_generator}
      - {slot: '4', class: xcom_hangar}
      - {slot: '5', class: xcom_shield_generator}
  xcom_outpost:
    name: Corporate Outpost
    faction: corporate
    model_set: xcom_outpost
    hit_points: 4000
  xcom_opp:
    name: Ore Processing Plant
    faction: corporate
    model_set: xcom_opp
    hit_points: 4000
  alien_base:
    point_defence: {range: 1.2km, rate: 4, chance: 40%, energy: 3}
    name: Alien Base
    faction: alien
    model_set: alien_base
    hit_points: 8000
    shields: 1500
    modules:
      - {slot: '0', class: alien_beam_pod}
      - {slot: '1', class: alien_shield_pod}
      - {slot: '2', class: alien_beam_pod}
      - {slot: '3', class: alien_shield_pod}
      - {slot: '4', class: alien_beam_pod}
      - {slot: '5', class: alien_beam_pod}
  alien_outpost:
    name: Alien Outpost
    faction: alien
    model_set: alien_outpost
    hit_points: 5000
  alien_opp:
    name: Alien Mining Platform
    faction: alien
    model_set: alien_opp
    hit_points: 5000
  pirate_base:
    point_defence: {range: 1.2km, rate: 4, chance: 40%, energy: 3}
    name: Pirate Base
    faction: pirate
    model_set: pirate_base
    hit_points: 5000
  arms_dealer:
    name: Arms Dealer Base
    faction: neutral
    model_set: arms_dealer
    hit_points: 4000
  science_station:
    name: GSC Science Station
    faction: corporate
    model_set: science_station
    hit_points: 3000
  nova_science:
    name: Nova Science Station
    faction: corporate
    model_set: nova_science
    hit_points: 3000
  asteroid:
    name: Asteroid
    faction: neutral
    model_set: asteroid
    hit_points: 20000
