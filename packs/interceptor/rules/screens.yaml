  ui_click: cue:Click             # 0: buttons' default
  ui_box_open: cue:MsgBoxOpen     # 1: a message box opens
  ui_box_button: cue:MsgBoxBtn    # 3: a capsule
  ui_dial: cue:RotarySwitch       # 4: the time dial
  ui_beep8: cue:Beep8             # 11: list scroll arrows
  ui_beep22: cue:sndBeep22        # 17: CSD screen buttons, Bases' side buttons, E&P categories
  ui_beep29b: cue:sndBeep29b      # 18: text buttons
  ui_beep3025: cue:sndBeep3025    # 19: Equip Ships' tabs
