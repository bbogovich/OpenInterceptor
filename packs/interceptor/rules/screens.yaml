# yaml-language-server: $schema=../../../schemas/rules.schema.json
# The original's strategy screens (Stage 6.9, R-UI-020/023-037), laid out over its own
# art: every background is a reference into the player's WrappersDLL.dll (nothing is
# copied). Positions are in the original's 640x480 space, read from Interceptor.exe
# (each screen's setup code) - VERIFIED unless marked DERIVED (measured from the art or
# inferred). The buttons are drawn by the art itself here; their own state images live
# in the original's sprite table (SpritesDLL), not yet read - until then they are hot
# spots that highlight under the mouse.
#
# Screen numbers in comments are the original's own (its current-screen global).

screens:
  # 17: the Command and Strategic Display - the round star map.
  csd:
    design: [640, 480]
    # The campaign clock runs on the CSD only; every other screen holds it (RQ-UI-16,
    # VERIFIED: switching away pauses, the CSD resumes). Back remembers 29 screens.
    clock: run
    history: 29
    background: original:WrappersDLL.dll#5030
    widgets:
      map: {kind: map, shape: round, rect: [66, 61, 333, 333]}
      minimap: {kind: map, source: minimap, shape: round, rect: [502, 43, 94, 94]}
      # The four green readouts (VERIFIED, Interceptor.exe 0x43fb0f): font 23010, centred
      # on x 561 at y 370/390/410/430 (glyph tops 363/383/403/423); the time monospaced.
      # Order: time, weekday, date, funds. `rect` is the bar (DERIVED, the art).
      time: {kind: value, value: time, rect: [495, 365, 133, 15], font: readout, at: [561, 370], align: centre, monospace: true}
      weekday: {kind: value, value: weekday, rect: [495, 385, 133, 16], font: readout, at: [561, 390], align: centre}
      date: {kind: value, value: date_long, rect: [495, 406, 133, 15], font: readout, at: [561, 410], align: centre}
      funds: {kind: value, value: money, rect: [495, 426, 133, 15], font: readout, at: [561, 430], align: centre}
      # The six screen buttons (VERIFIED, sprite-states.md): SpriteButtonC on these
      # centres, one state each (S = 1: the art shows them up; the sprite - 45x32, rows
      # 372-382 of the exe's sprite table - is the pressed image). They fire on release.
      bases: {kind: button, centre: [516, 194], images: {sprite: "original:sprite#372", states: 1}, action: open(bases)}
      equip_ships: {kind: button, centre: [563, 194], images: {sprite: "original:sprite#380", states: 1}, action: open(equip_ships)}
      reports: {kind: button, centre: [609, 194], images: {sprite: "original:sprite#382", states: 1}, action: open(reports)}
      research: {kind: button, centre: [516, 226], images: {sprite: "original:sprite#378", states: 1}, action: open(research)}
      purchase: {kind: button, centre: [563, 226], images: {sprite: "original:sprite#376", states: 1}, action: open(purchase)}
      ufopedia: {kind: button, centre: [609, 226], images: {sprite: "original:sprite#374", states: 1}, action: open(ufopedia)}
      # The time dial's six holes (centres verified): the original's six speeds, slowest
      # first (no pause; see clock: in strategy/campaign.yaml).
      speed0: {kind: button, rect: [516, 315, 14, 14], action: speed(0)}
      speed1: {kind: button, rect: [529, 329, 14, 14], action: speed(1)}
      speed2: {kind: button, rect: [547, 337, 14, 14], action: speed(2)}
      speed3: {kind: button, rect: [567, 337, 14, 14], action: speed(3)}
      speed4: {kind: button, rect: [585, 328, 14, 14], action: speed(4)}
      speed5: {kind: button, rect: [598, 315, 14, 14], action: speed(5)}
      # The status bar [344,457,620,472] (VERIFIED, 0x447921: font 23010, centred,
      # DrawTextRect). The original shows the map object under the cursor; here: what is
      # selected.
      status: {kind: value, value: selection, rect: [344, 457, 276, 15], font: readout, align: centre}

  # 6: Bases - the base, its modules and the module list.
  bases:
    design: [640, 480]
    clock: pause
    background: original:WrappersDLL.dll#6105
    widgets:
      base: {kind: value, value: base, rect: [475, 13, 150, 16], font: body, align: centre}   # the base drop-down [475,13] w 150 (VERIFIED); font and centring DERIVED (D-40)
      # The info pane [347,39,639,266] (VERIFIED): the rows below its header, the selected
      # row and its actions at the pane's foot (placement in the pane DERIVED).
      modules: {kind: list, source: build, rect: [356, 104, 274, 108], font: body, style: compact, detail: [356, 216, 274, 26], buttons: [356, 244, 274, 18]}
      # The side buttons 204/206/208 (VERIFIED): SpriteButtonTL with their top-left at
      # these points, two states (rows 1345/1347/1349: up, then pressed).
      purchase: {kind: button, pos: [504, 361], images: {sprite: "original:sprite#1345", states: 2}, action: open(purchase)}
      equip_ships: {kind: button, pos: [504, 398], images: {sprite: "original:sprite#1347", states: 2}, action: open(equip_ships)}
      stats: {kind: button, pos: [504, 435], images: {sprite: "original:sprite#1349", states: 2}, action: open(base_stats)}
      # The red close button in the art's top-left corner (measured: centre (16, 16), radius 10;
      # DERIVED from the art); it goes back (the history, RQ-UI-15).
      back: {kind: button, rect: [5, 5, 22, 22], action: back}

  # 7/8: Equip Ships - the ship ring, its pilot and fit; the docked ships below.
  equip_ships:
    design: [640, 480]
    clock: pause
    background: original:WrappersDLL.dll#6100
    widgets:
      base: {kind: value, value: base, rect: [475, 13, 150, 16], font: body, align: centre}   # the base drop-down [475,13] w 150 (VERIFIED); font and centring DERIVED (D-40)
      # The docked-ships ListBox [17,397,517,457] (VERIFIED); the selected ship's text and
      # actions in the stat panel [432,89,639,347] under its header (DERIVED).
      # A compact list box (3 rows); columns from the CSD's ship-list template
      # S_CSD_CHOOSESHIPTAB (SHIP, PILOT, STATUS: DERIVED here - this screen's own template
      # is not recovered). Cells: ship, pilot, base and state. Arrows 204/205 top-left
      # (518,413)/(518,434), sprites 60/63: 27500/27501, 27503/27504, disabled 27502/27505
      # (VERIFIED).
      ships: {kind: list, source: hangar, rect: [17, 397, 500, 60], font: body, style: compact, columns: "@orig.S_CSD_CHOOSESHIPTAB",
              detail: [436, 186, 198, 118], buttons: [436, 310, 198, 20],
              up: {rect: [518, 413, 24, 24], images: ["original:SpritesDLL.dll#27500", "original:SpritesDLL.dll#27501", "original:SpritesDLL.dll#27502"]},
              down: {rect: [518, 434, 24, 24], images: ["original:SpritesDLL.dll#27503", "original:SpritesDLL.dll#27504", "original:SpritesDLL.dll#27505"]}}
      # The three tabs 302/304/306 (VERIFIED SpriteButtonC, two states, a radio group with
      # the first latched); weapons / equipment / pilot pages are not built, so they only latch.
      tab_weapons: {kind: button, centre: [479, 57], images: {sprite: "original:sprite#1153", states: 2}, group: tabs, selected: true}
      tab_equipment: {kind: button, centre: [533, 57], images: {sprite: "original:sprite#1155", states: 2}, group: tabs}
      tab_pilot: {kind: button, centre: [587, 57], images: {sprite: "original:sprite#1157", states: 2}, group: tabs}
      # The red close button in the art's top-left corner (measured: centre (16, 16), radius 10;
      # DERIVED from the art); it goes back (the history, RQ-UI-15).
      back: {kind: button, rect: [5, 5, 22, 22], action: back}

  # 18: Equipment & Personnel - purchase, sell, transfer, manufacture.
  purchase:
    design: [640, 480]
    clock: pause
    background: original:WrappersDLL.dll#6110
    widgets:
      base: {kind: value, value: base, rect: [475, 13, 150, 16], font: body, align: centre}   # the base drop-down [475,13] w 150 (VERIFIED); font and centring DERIVED (D-40)
      funds: {kind: value, value: money, rect: [299, 229, 145, 22], font: value, align: centre}   # the readout slot (rect VERIFIED, wrappers/screens.yaml); font: E&P values (23013, DERIVED)
      # The ListBox [18,272,556,460] (VERIFIED) with its green header strip (DERIVED, the
      # art); the selected item in info box 3 [301,42,441,165] and its actions in info box 2
      # [135,42,275,165] (boxes VERIFIED, their use here DERIVED).
      # The original's list box (RQ-UI-13, VERIFIED, ListBox.cpp): rows in 23011 a line
      # + 2 apart, round((h - 7)/16) of them, a pulsing green bar; the header template
      # S_S6B_PURCHASE_HDR (its columns are its tokens' widths in 23010, VERIFIED 0x51c46b)
      # in the green strip (strip height DERIVED). Cells, in order: item, size, cost,
      # stores (the editable QUANTITY column has no spinners yet). Scroll arrows 700/701:
      # top-left (562,290)/(562,314), 24x24, images 6911/6912, 6914/6915, disabled 6913
      # (VERIFIED; the resources are in WrappersDLL).
      items: {kind: list, source: market, rect: [18, 272, 538, 188], font: body, style: compact, header: 18, title_font: readout,
              columns: "@orig.S_S6B_PURCHASE_HDR", detail: [305, 46, 132, 115], buttons: [139, 46, 132, 115],
              up: {rect: [562, 290, 24, 24], images: ["original:WrappersDLL.dll#6911", "original:WrappersDLL.dll#6912", "original:WrappersDLL.dll#6913"]},
              down: {rect: [562, 314, 24, 24], images: ["original:WrappersDLL.dll#6914", "original:WrappersDLL.dll#6915", "original:WrappersDLL.dll#6913"]}}
      # The category radios 300 (purchase, latched here) and 303 (manufacture): VERIFIED
      # SpriteButtonTL, two states (rows 1053/1059); sell and transfer (301/302) are not
      # built. Button 106 opens production (row 1061).
      cat_purchase: {kind: button, pos: [81, 226], images: {sprite: "original:sprite#1053", states: 2}, group: category, selected: true, action: replace(purchase)}
      cat_manufacture: {kind: button, pos: [234, 226], images: {sprite: "original:sprite#1059", states: 2}, group: category, action: replace(manufacture)}
      manufacture: {kind: button, pos: [587, 326], images: {sprite: "original:sprite#1061", states: 2}, action: open(manufacture)}
      # The red close button in the art's top-left corner (measured: centre (16, 16), radius 10;
      # DERIVED from the art); it goes back (the history, RQ-UI-15).
      back: {kind: button, rect: [5, 5, 22, 22], action: back}

  # 18 in its manufacture mode: the same art, the production list.
  manufacture:
    design: [640, 480]
    clock: pause
    background: original:WrappersDLL.dll#6110
    widgets:
      funds: {kind: value, value: money, rect: [299, 229, 145, 22], font: value, align: centre}   # the readout slot (rect VERIFIED, wrappers/screens.yaml); font: E&P values (23013, DERIVED)
      jobs: {kind: list, source: factory, rect: [18, 272, 538, 188], font: body, style: compact, header: 18, title_font: readout,
             columns: "@orig.S_S6B_MANUFACTURE_HDR", detail: [305, 46, 132, 115], buttons: [139, 46, 132, 115],
             up: {rect: [562, 290, 24, 24], images: ["original:WrappersDLL.dll#6911", "original:WrappersDLL.dll#6912", "original:WrappersDLL.dll#6913"]},
             down: {rect: [562, 314, 24, 24], images: ["original:WrappersDLL.dll#6914", "original:WrappersDLL.dll#6915", "original:WrappersDLL.dll#6913"]}}
      # The category radios, with manufacture (303) latched on this screen.
      cat_purchase: {kind: button, pos: [81, 226], images: {sprite: "original:sprite#1053", states: 2}, group: category, action: replace(purchase)}
      cat_manufacture: {kind: button, pos: [234, 226], images: {sprite: "original:sprite#1059", states: 2}, group: category, selected: true, action: replace(manufacture)}
      # The red close button in the art's top-left corner (measured: centre (16, 16), radius 10;
      # DERIVED from the art); it goes back (the history, RQ-UI-15).
      back: {kind: button, rect: [5, 5, 22, 22], action: back}

  # 9: Research.
  research:
    design: [640, 480]
    clock: pause
    background: original:WrappersDLL.dll#5101
    widgets:
      # The topic rows: 250x25 from [330,49,580,74], one every 34 px (VERIFIED, 0x4684a8),
      # on the art's eight black slots; the selected topic in the description pane
      # [20,368,444,466] (VERIFIED), its actions at the pane's foot (DERIVED).
      topics: {kind: list, source: research, rect: [330, 49, 250, 264], font: body, row_height: 34, row_size: 25, detail: [26, 374, 412, 64], buttons: [26, 442, 412, 20]}
      # The red close button in the art's top-left corner (measured: centre (16, 16), radius 10;
      # DERIVED from the art); it goes back (the history, RQ-UI-15).
      back: {kind: button, rect: [5, 5, 22, 22], action: back}

  # 22: Base Stats (the Stat-O-Matic).
  base_stats:
    design: [640, 480]
    clock: pause
    background: original:WrappersDLL.dll#6330
    widgets:
      # The stats view [26,60,371,390] (VERIFIED): rows, then the selected row and its actions.
      stats: {kind: list, source: bases, rect: [32, 64, 334, 256], font: body, style: compact, detail: [32, 324, 334, 42], buttons: [32, 368, 334, 20]}
      # The red close button in the art's top-left corner (measured: centre (16, 16), radius 10;
      # DERIVED from the art); it goes back (the history, RQ-UI-15).
      back: {kind: button, rect: [5, 5, 22, 22], action: back}

  # 23: the UFOpedia (databank).
  ufopedia:
    design: [640, 480]
    clock: pause
    background: original:WrappersDLL.dll#5107
    widgets:
      # Topics ListBox [346,105,596,275] and the article ListBox [95,325,592,446] (VERIFIED).
      topics: {kind: list, source: archive, rect: [346, 105, 250, 170], font: body, style: compact, detail: [95, 325, 497, 121]}
      back: {kind: button, rect: [596, 440, 30, 30], action: back}            # DERIVED: the UFOpedia's exit control is not recovered (no close button in its art)

  # 32-37: the status reports.
  reports:
    design: [640, 480]
    clock: pause
    background: original:WrappersDLL.dll#7700
    widgets:
      # The report area [24,58,568,447] (VERIFIED).
      report: {kind: list, source: reports, rect: [28, 62, 534, 326], font: body, style: compact, detail: [28, 392, 534, 32], buttons: [28, 424, 534, 20]}
      # The red close button in the art's top-left corner (measured: centre (16, 16), radius 10;
      # DERIVED from the art); it goes back (the history, RQ-UI-15).
      back: {kind: button, rect: [5, 5, 22, 22], action: back}
