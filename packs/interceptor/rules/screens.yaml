# yaml-language-server: $schema=../../../schemas/rules.schema.json
# The original's strategy screens (Stage 6.9, R-UI-020/023-037), laid out over its own
# art: every background is a reference into the player's WrappersDLL.dll (nothing is
# copied). Positions are in the original's 640x480 space, read from Interceptor.exe
# (each screen's setup code) - VERIFIED unless marked DERIVED (measured from the art or
# inferred). The buttons are drawn by the art itself here; their own state images live
# in the original's sprite table (SpritesDLL), not yet read - until then they are hot
# spots that highlight under the mouse.
#
# Screen numbers in comments are the original's own (its current-screen global).

screens:
  # 17: the Command and Strategic Display - the round star map.
  csd:
    design: [640, 480]
    # The campaign clock runs on the CSD only; every other screen holds it (RQ-UI-16,
    # VERIFIED: switching away pauses, the CSD resumes). Back remembers 29 screens.
    clock: run
    history: 29
    background: original:WrappersDLL.dll#5030
    widgets:
      # Labels as the original's (VERIFIED, notes/re/unknowns-2026-11.md §1.3): only for the
      # objects in a 30 px box around the cursor, upper-cased, in the 6 px font, centred 20 px
      # above a star (8 above a base), kept 3 px inside the circle, taking turns every second.
      # Zoom levels 0 and 1: 45 and 30 map units a pixel (VERIFIED, §1.1); the wheel steps
      # between them in place of the view knob (whose control is not placed yet). A click on
      # a system shows its star-class picture (level 2, §13.4; centred, DERIVED).
      map: {kind: map, shape: round, rect: [66, 61, 333, 333], labels: {font: caption}, zoom_levels: [45, 30]}
      minimap: {kind: map, source: minimap, shape: round, rect: [502, 43, 94, 94], tip: "@orig.S_CSD_MINIMAP"}
      # The four green readouts (VERIFIED, Interceptor.exe 0x43fb0f): font 23010, centred
      # on x 561 at y 370/390/410/430 (glyph tops 363/383/403/423); the time monospaced.
      # Order: time, weekday, date, funds. `rect` is the bar (DERIVED, the art).
      time: {kind: value, value: time, rect: [495, 365, 133, 15], font: readout, at: [561, 370], align: centre, monospace: true}
      weekday: {kind: value, value: weekday, rect: [495, 385, 133, 16], font: readout, at: [561, 390], align: centre}
      date: {kind: value, value: date_long, rect: [495, 406, 133, 15], font: readout, at: [561, 410], align: centre}
      funds: {kind: value, value: money, rect: [495, 426, 133, 15], font: readout, at: [561, 430], align: centre}
      # The six screen buttons (VERIFIED, sprite-states.md): SpriteButtonC on these
      # centres, one state each (S = 1: the art shows them up; the sprite - 45x32, rows
      # 372-382 of the exe's sprite table - is the pressed image). They fire on release.
      bases: {kind: button, centre: [516, 194], images: {sprite: "original:sprite#372", states: 1}, action: open(bases), sound: ui_beep22, tip: "@orig.S_CSD_BASES"}
      equip_ships: {kind: button, centre: [563, 194], images: {sprite: "original:sprite#380", states: 1}, action: open(equip_ships), sound: ui_beep22, tip: "@orig.S_CSD_EQUIPSHIP"}
      reports: {kind: button, centre: [609, 194], images: {sprite: "original:sprite#382", states: 1}, action: open(reports), sound: ui_beep22, tip: "@orig.S_CSD_STATUSREPORTS"}
      research: {kind: button, centre: [516, 226], images: {sprite: "original:sprite#378", states: 1}, action: open(research), sound: ui_beep22, tip: "@orig.S_CSD_RESEARCH"}
      purchase: {kind: button, centre: [563, 226], images: {sprite: "original:sprite#376", states: 1}, action: open(purchase), sound: ui_beep22, tip: "@orig.S_CSD_EQUIPPERS"}
      ufopedia: {kind: button, centre: [609, 226], images: {sprite: "original:sprite#374", states: 1}, action: open(ufopedia), sound: ui_beep22, tip: "@orig.S_CSD_DATABANK"}
      # The time dial (TimeDial 0x4cca65, VERIFIED): six 20x20 holes centred on these
      # points, the original's six speeds slowest first (no pause; see clock: in
      # strategy/campaign.yaml), each with its S_TIME_* help and the RotarySwitch sound;
      # keys 1-6 pick them too (clock.first_key). Each hole's lamp is a pair of sprites,
      # rows 966+2k (out) and 967+2k (lit: the clock's speed) - the pairing DERIVED from
      # the art (one size per pair). The globe in the dial (rows 918-929, 12 frames)
      # turns while the clock runs; its rate and place DERIVED.
      globe: {kind: anim, centre: [562, 304], frames: ["original:sprite#918", "original:sprite#919", "original:sprite#920", "original:sprite#921", "original:sprite#922", "original:sprite#923", "original:sprite#924", "original:sprite#925", "original:sprite#926", "original:sprite#927", "original:sprite#928", "original:sprite#929"], interval: 4, with_clock: true}
      speed0: {kind: button, centre: [523, 322], images: {sprite: "original:sprite#966", states: 2}, action: speed(0), sound: ui_dial, tip: "@orig.S_TIME_5SECS"}
      speed1: {kind: button, centre: [536, 336], images: {sprite: "original:sprite#968", states: 2}, action: speed(1), sound: ui_dial, tip: "@orig.S_TIME_1MIN"}
      speed2: {kind: button, centre: [554, 344], images: {sprite: "original:sprite#970", states: 2}, action: speed(2), sound: ui_dial, tip: "@orig.S_TIME_5MIN"}
      speed3: {kind: button, centre: [574, 344], images: {sprite: "original:sprite#972", states: 2}, action: speed(3), sound: ui_dial, tip: "@orig.S_TIME_30MIN"}
      speed4: {kind: button, centre: [592, 335], images: {sprite: "original:sprite#974", states: 2}, action: speed(4), sound: ui_dial, tip: "@orig.S_TIME_1HOUR"}
      speed5: {kind: button, centre: [605, 322], images: {sprite: "original:sprite#976", states: 2}, action: speed(5), sound: ui_dial, tip: "@orig.S_TIME_24HOUR"}
      # The four map-corner lamps (SpritesDLL 1900-1909, VERIFIED): one frame every 4
      # ticks, looping over 10 (notes/re/unknowns-2026-11.md §1.4); placed by their top-left
      # (DERIVED from the art). The status lamp at (618, 453): WrappersDLL 5060-5064 every
      # 6 ticks (ui-framework.md §2.5).
      lamp_tl: {kind: anim, pos: [59, 70], frames: ["original:SpritesDLL.dll#1900", "original:SpritesDLL.dll#1901", "original:SpritesDLL.dll#1902", "original:SpritesDLL.dll#1903", "original:SpritesDLL.dll#1904", "original:SpritesDLL.dll#1905", "original:SpritesDLL.dll#1906", "original:SpritesDLL.dll#1907", "original:SpritesDLL.dll#1908", "original:SpritesDLL.dll#1909"], interval: 4}
      lamp_tr: {kind: anim, pos: [348, 70], frames: ["original:SpritesDLL.dll#1900", "original:SpritesDLL.dll#1901", "original:SpritesDLL.dll#1902", "original:SpritesDLL.dll#1903", "original:SpritesDLL.dll#1904", "original:SpritesDLL.dll#1905", "original:SpritesDLL.dll#1906", "original:SpritesDLL.dll#1907", "original:SpritesDLL.dll#1908", "original:SpritesDLL.dll#1909"], interval: 4}
      lamp_br: {kind: anim, pos: [348, 354], frames: ["original:SpritesDLL.dll#1900", "original:SpritesDLL.dll#1901", "original:SpritesDLL.dll#1902", "original:SpritesDLL.dll#1903", "original:SpritesDLL.dll#1904", "original:SpritesDLL.dll#1905", "original:SpritesDLL.dll#1906", "original:SpritesDLL.dll#1907", "original:SpritesDLL.dll#1908", "original:SpritesDLL.dll#1909"], interval: 4}
      lamp_bl: {kind: anim, pos: [59, 354], frames: ["original:SpritesDLL.dll#1900", "original:SpritesDLL.dll#1901", "original:SpritesDLL.dll#1902", "original:SpritesDLL.dll#1903", "original:SpritesDLL.dll#1904", "original:SpritesDLL.dll#1905", "original:SpritesDLL.dll#1906", "original:SpritesDLL.dll#1907", "original:SpritesDLL.dll#1908", "original:SpritesDLL.dll#1909"], interval: 4}
      status_lamp: {kind: anim, pos: [618, 453], frames: ["original:WrappersDLL.dll#5060", "original:WrappersDLL.dll#5061", "original:WrappersDLL.dll#5062", "original:WrappersDLL.dll#5063", "original:WrappersDLL.dll#5064"], interval: 6}
      # The status bar [344,457,620,472] (VERIFIED, 0x447921: font 23010, centred,
      # DrawTextRect). The original shows the map object under the cursor; here: what is
      # selected.
      status: {kind: value, value: selection, rect: [344, 457, 276, 15], font: readout, align: centre}

  # 6: Bases - the base, its modules and the module list.
  bases:
    design: [640, 480]
    clock: pause
    background: original:WrappersDLL.dll#6105
    widgets:
      base: {kind: value, value: base, rect: [475, 13, 150, 16], font: body, align: centre}   # the base drop-down [475,13] w 150 (VERIFIED); font and centring DERIVED (D-40)
      # The info pane [347,39,639,266] (VERIFIED): the rows below its header, the selected
      # row and its actions at the pane's foot (placement in the pane DERIVED).
      # The module scroll buttons, ids 400 / 401 at (484, 247) and (580, 247), sprite rows
      # 1381 / 1379 (VERIFIED, unknowns-2026-11.md §13.3; the pressed row N + 1 is DERIVED).
      modules: {kind: list, source: build, rect: [356, 104, 274, 108], font: body, style: compact, detail: [356, 216, 274, 26], buttons: [356, 244, 274, 18],
                up: {pos: [484, 247], images: ["original:sprite#1381", "original:sprite#1382", "original:sprite#1381"]},
                down: {pos: [580, 247], images: ["original:sprite#1379", "original:sprite#1380", "original:sprite#1379"]}}
      # The side buttons 204/206/208 (VERIFIED): SpriteButtonTL with their top-left at
      # these points, two states (rows 1345/1347/1349: up, then pressed).
      purchase: {kind: button, pos: [504, 361], images: {sprite: "original:sprite#1345", states: 2}, action: open(purchase), sound: ui_beep22}
      equip_ships: {kind: button, pos: [504, 398], images: {sprite: "original:sprite#1347", states: 2}, action: open(equip_ships), sound: ui_beep22}
      stats: {kind: button, pos: [504, 435], images: {sprite: "original:sprite#1349", states: 2}, action: open(base_stats), sound: ui_beep22}
      # The red close button in the art's top-left corner (measured: centre (16, 16), radius 10;
      # DERIVED from the art); it goes back (the history, RQ-UI-15).
      back: {kind: button, rect: [5, 5, 22, 22], action: back}

  # 7/8: Equip Ships - the ship ring, its pilot and fit; the docked ships below.
  equip_ships:
    design: [640, 480]
    clock: pause
    background: original:WrappersDLL.dll#6100
    widgets:
      base: {kind: value, value: base, rect: [475, 13, 150, 16], font: body, align: centre}   # the base drop-down [475,13] w 150 (VERIFIED); font and centring DERIVED (D-40)
      # The docked-ships ListBox [17,397,517,457] (VERIFIED); the selected ship's text and
      # actions in the stat panel [432,89,639,347] under its header (DERIVED).
      # A compact list box (3 rows); columns from the CSD's ship-list template
      # S_CSD_CHOOSESHIPTAB (SHIP, PILOT, STATUS: DERIVED here - this screen's own template
      # is not recovered). Cells: ship, pilot, base and state. Arrows 204/205 top-left
      # (518,413)/(518,434), sprites 60/63: 27500/27501, 27503/27504, disabled 27502/27505
      # (VERIFIED).
      # The ring's nine sockets (centres VERIFIED, 0x535566): the selected ship's hard points
      # as icons only (VERIFIED, unknowns-2026-11.md §13.2) - row 1237 where the hull has no
      # hard point, the selection overlay 1235 at (+1, +1). The fitted items' icons come from
      # a table by item kind (0x690990) whose rows are not read yet: no slot_icons.
      ships: {kind: list, source: hangar, rect: [17, 397, 500, 60], font: body, style: compact, columns: "@orig.S_CSD_CHOOSESHIPTAB",
              slots: [[117, 336], [65, 265], [64, 178], [115, 107], [198, 79], [282, 106], [334, 177], [334, 265], [283, 336]],
              slot_unusable: "original:sprite#1237", slot_selected: "original:sprite#1235",
              detail: [436, 186, 198, 118], buttons: [436, 310, 198, 20],
              up: {rect: [518, 413, 24, 24], images: ["original:SpritesDLL.dll#27500", "original:SpritesDLL.dll#27501", "original:SpritesDLL.dll#27502"]},
              down: {rect: [518, 434, 24, 24], images: ["original:SpritesDLL.dll#27503", "original:SpritesDLL.dll#27504", "original:SpritesDLL.dll#27505"]}}
      # The three tabs 302/304/306 (VERIFIED SpriteButtonC, two states, a radio group with
      # the first latched); weapons / equipment / pilot pages are not built, so they only latch.
      tab_weapons: {kind: button, centre: [479, 57], images: {sprite: "original:sprite#1153", states: 2}, group: tabs, selected: true, sound: ui_beep3025}
      tab_equipment: {kind: button, centre: [533, 57], images: {sprite: "original:sprite#1155", states: 2}, group: tabs, sound: ui_beep3025}
      tab_pilot: {kind: button, centre: [587, 57], images: {sprite: "original:sprite#1157", states: 2}, group: tabs, sound: ui_beep3025}
      # The red close button in the art's top-left corner (measured: centre (16, 16), radius 10;
      # DERIVED from the art); it goes back (the history, RQ-UI-15).
      back: {kind: button, rect: [5, 5, 22, 22], action: back}

  # 18: Equipment & Personnel - purchase, sell, transfer, manufacture.
  purchase:
    design: [640, 480]
    clock: pause
    background: original:WrappersDLL.dll#6110
    widgets:
      base: {kind: value, value: base, rect: [475, 13, 150, 16], font: body, align: centre}   # the base drop-down [475,13] w 150 (VERIFIED); font and centring DERIVED (D-40)
      funds: {kind: value, value: money, rect: [299, 229, 145, 22], font: value, align: centre}   # the readout slot (rect VERIFIED, wrappers/screens.yaml); font: E&P values (23013, DERIVED)
      # The ListBox [18,272,556,460] (VERIFIED) with its green header strip (DERIVED, the
      # art); the selected item in info box 3 [301,42,441,165] and its actions in info box 2
      # [135,42,275,165] (boxes VERIFIED, their use here DERIVED).
      # The original's list box (RQ-UI-13, VERIFIED, ListBox.cpp): rows in 23011 a line
      # + 2 apart, round((h - 7)/16) of them, a pulsing green bar; the header template
      # S_S6B_PURCHASE_HDR (its columns are its tokens' widths in 23010, VERIFIED 0x51c46b)
      # in the green strip (strip height DERIVED). Cells, in order: item, size, cost,
      # stores (the editable QUANTITY column has no spinners yet). Scroll arrows 700/701:
      # top-left (562,290)/(562,314), 24x24, images 6911/6912, 6914/6915, disabled 6913
      # (VERIFIED; the resources are in WrappersDLL).
      items: {kind: list, source: market, rect: [18, 272, 538, 188], font: body, style: compact, header: 18, title_font: readout,
              columns: "@orig.S_S6B_PURCHASE_HDR", detail: [305, 46, 132, 115], buttons: [139, 46, 132, 115],
              up: {rect: [562, 290, 24, 24], images: ["original:WrappersDLL.dll#6911", "original:WrappersDLL.dll#6912", "original:WrappersDLL.dll#6913"]},
              down: {rect: [562, 314, 24, 24], images: ["original:WrappersDLL.dll#6914", "original:WrappersDLL.dll#6915", "original:WrappersDLL.dll#6913"]}}
      # The category radios 300 (purchase, latched here) and 303 (manufacture): VERIFIED
      # SpriteButtonTL, two states (rows 1053/1059); sell and transfer (301/302) are not
      # built. Button 106 opens production (row 1061).
      cat_purchase: {kind: button, pos: [81, 226], images: {sprite: "original:sprite#1053", states: 2}, group: category, selected: true, action: replace(purchase), sound: ui_beep22}
      cat_manufacture: {kind: button, pos: [234, 226], images: {sprite: "original:sprite#1059", states: 2}, group: category, action: replace(manufacture), sound: ui_beep22}
      manufacture: {kind: button, pos: [587, 326], images: {sprite: "original:sprite#1061", states: 2}, action: open(manufacture)}
      # The red close button in the art's top-left corner (measured: centre (16, 16), radius 10;
      # DERIVED from the art); it goes back (the history, RQ-UI-15).
      back: {kind: button, rect: [5, 5, 22, 22], action: back}

  # 18 in its manufacture mode: the same art, the production list.
  manufacture:
    design: [640, 480]
    clock: pause
    background: original:WrappersDLL.dll#6110
    widgets:
      funds: {kind: value, value: money, rect: [299, 229, 145, 22], font: value, align: centre}   # the readout slot (rect VERIFIED, wrappers/screens.yaml); font: E&P values (23013, DERIVED)
      jobs: {kind: list, source: factory, rect: [18, 272, 538, 188], font: body, style: compact, header: 18, title_font: readout,
             columns: "@orig.S_S6B_MANUFACTURE_HDR", detail: [305, 46, 132, 115], buttons: [139, 46, 132, 115],
             up: {rect: [562, 290, 24, 24], images: ["original:WrappersDLL.dll#6911", "original:WrappersDLL.dll#6912", "original:WrappersDLL.dll#6913"]},
             down: {rect: [562, 314, 24, 24], images: ["original:WrappersDLL.dll#6914", "original:WrappersDLL.dll#6915", "original:WrappersDLL.dll#6913"]}}
      # The category radios, with manufacture (303) latched on this screen.
      cat_purchase: {kind: button, pos: [81, 226], images: {sprite: "original:sprite#1053", states: 2}, group: category, action: replace(purchase), sound: ui_beep22}
      cat_manufacture: {kind: button, pos: [234, 226], images: {sprite: "original:sprite#1059", states: 2}, group: category, selected: true, action: replace(manufacture), sound: ui_beep22}
      # The red close button in the art's top-left corner (measured: centre (16, 16), radius 10;
      # DERIVED from the art); it goes back (the history, RQ-UI-15).
      back: {kind: button, rect: [5, 5, 22, 22], action: back}

  # 9: Research.
  research:
    design: [640, 480]
    clock: pause
    background: original:WrappersDLL.dll#5101
    widgets:
      # The topic rows: 250x25 from [330,49,580,74], one every 34 px (VERIFIED, 0x4684a8),
      # on the art's eight black slots; the selected topic in the description pane
      # [20,368,444,466] (VERIFIED), its actions at the pane's foot (DERIVED).
      topics: {kind: list, source: research, rect: [330, 49, 250, 264], font: body, row_height: 34, row_size: 25, detail: [26, 374, 412, 64], buttons: [26, 442, 412, 20]}
      # The red close button in the art's top-left corner (measured: centre (16, 16), radius 10;
      # DERIVED from the art); it goes back (the history, RQ-UI-15).
      back: {kind: button, rect: [5, 5, 22, 22], action: back}

  # 22: Base Stats (the Stat-O-Matic).
  base_stats:
    design: [640, 480]
    clock: pause
    background: original:WrappersDLL.dll#6330
    widgets:
      # The stats view [26,60,371,390] (VERIFIED): rows, then the selected row and its actions.
      # Arrows 401 / 400 at (list right + 8, list top + 65) and (list right + 8, list bottom
      # - 20) (VERIFIED, §13.3); their size, 24 x 24 hot spots over the art, is DERIVED.
      stats: {kind: list, source: bases, rect: [32, 64, 334, 256], font: body, style: compact, detail: [32, 324, 334, 42], buttons: [32, 368, 334, 20],
              up: [374, 129, 24, 24], down: [374, 300, 24, 24]}
      # The red close button in the art's top-left corner (measured: centre (16, 16), radius 10;
      # DERIVED from the art); it goes back (the history, RQ-UI-15).
      back: {kind: button, rect: [5, 5, 22, 22], action: back}

  # 23: the UFOpedia (databank).
  ufopedia:
    design: [640, 480]
    clock: pause
    background: original:WrappersDLL.dll#5107
    widgets:
      # Topics ListBox [346,105,596,275] and the article ListBox [95,325,592,446] (VERIFIED).
      # The topic list's scroll anchor (616, 222) (VERIFIED, §13.3): its upper and lower
      # halves scroll up and down (24 x 48 around the anchor, DERIVED). The article text's
      # anchor (616, 386) is not built: the article box does not scroll yet.
      topics: {kind: list, source: databank, rect: [346, 105, 250, 170], font: body, style: compact, detail: [95, 325, 497, 121],
               up: [604, 198, 24, 24], down: [604, 222, 24, 24]}
      # The exit, control 106 (VERIFIED, 0x530d66): a 23x23 sprite button (rows 4/5,
      # WrappersDLL 4000/4001) centred at (619, 466); it goes back.
      back: {kind: button, centre: [619, 466], images: {sprite: "original:sprite#4", states: 2}, action: back}

  # 32-37: the status reports.
  # 32-37: the six status reports (StatusReports.cpp, unknowns-2026-11.md §13.1). VERIFIED:
  # the screens, the report area [24,58,568,447], next 102 at (620, 282) and previous 104 at
  # (617, 365) (sprite rows 69 / 66); each report is a title and a 1 px line graph (grid
  # RGB(0,50,0), ticks and axes RGB(0,100,0), up to 16 month labels and values in the 6 px
  # font RGB(0,200,0)); finance's five rows pick its series and it draws LOW / HIGH lines;
  # the activity reports add a system map coloured by activity (none / 1-5 / 6-15 / 16+);
  # the outpost report a six-column table and a small map; player status a pilot/skill list.
  # DERIVED: every position and size below, the activity colours, the series line's colour,
  # the table's columns, and the player status title (no text key found).
  reports:   # Income (32)
    design: [640, 480]
    clock: pause
    background: original:WrappersDLL.dll#7700
    widgets:
      title: {kind: text, text: "@orig.INCOMEREPORT_TITLE", rect: [28, 64, 534, 20], font: readout, at: [296, 74], align: centre}
      graph_title: {kind: text, text: "@orig.INCOMEREPORT_GRAPHTITLE", rect: [40, 90, 520, 10], font: caption, at: [296, 94], align: centre}
      graph: {kind: graph, source: income, rect: [40, 104, 512, 170], font: caption, months: ["@orig.S_MONTH_ABREV_JAN", "@orig.S_MONTH_ABREV_FEB", "@orig.S_MONTH_ABREV_MAR", "@orig.S_MONTH_ABREV_APR", "@orig.S_MONTH_ABREV_MAY", "@orig.S_MONTH_ABREV_JUN", "@orig.S_MONTH_ABREV_JUL", "@orig.S_MONTH_ABREV_AUG", "@orig.S_MONTH_ABREV_SEP", "@orig.S_MONTH_ABREV_OCT", "@orig.S_MONTH_ABREV_NOV", "@orig.S_MONTH_ABREV_DEC"]}
      report: {kind: list, source: report_income, rect: [40, 300, 512, 120], font: body, style: compact, detail: [40, 424, 512, 18]}
      next: {kind: button, centre: [620, 282], images: {sprite: "original:sprite#69", states: 2}, action: replace(report_finance)}
      previous: {kind: button, centre: [617, 365], images: {sprite: "original:sprite#66", states: 2}, action: replace(report_player)}
      back: {kind: button, rect: [5, 5, 22, 22], action: back}

  report_finance:   # Finance (33)
    design: [640, 480]
    clock: pause
    background: original:WrappersDLL.dll#7700
    widgets:
