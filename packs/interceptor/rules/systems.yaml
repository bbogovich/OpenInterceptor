# yaml-language-server: $schema=../../../schemas/rules.schema.json
# Ship systems, power and damage for X-COM: Interceptor (Stage 2).
#
# Every fitted system can be damaged; switchable ones (tractor, cloak, ECM) draw power
# steps while on. Kinds and keys: docs site, Modding > Rulesets > Systems.
#
# Sources: hit points from the equipment sections of GameSettings.ini (EngineType1 100,
# SensorTargetingSystem1 60, ShieldType1 50, VectorControlThrusters 150, TractorBeam 250,
# ShipDamageControlComputer 150). ECM range and strength restate ECMPodType1/2
# (Range 250/500, Special 10/25), read here as metres and % per second (DERIVED).
# Power steps, cloak values and repair rates are engine estimates (DERIVED).
#

systems:
  engines:
    hit_points: 100
  sensors:
    name: Targeting/sensors
    hit_points: 60
  shields:
    name: Shield generator
    hit_points: 50
  vct:
    name: Vector control thrusters
    hit_points: 150
  tractor:
    name: Tractor beam
    hit_points: 250
    power: 2
    range: 250
    strength: 60
  cloak:
    name: Cloaking device
    hit_points: 100
    power: 3
    range: 400
    strength: 25
  ecm:
    name: ECM pod
    hit_points: 100
    power: 1
    range: 250
    strength: 10
  advanced_ecm:
    kind: ecm
    name: Advanced ECM pod
    hit_points: 100
    power: 1
    range: 500
    strength: 25
  damage_control:
    name: Ship damage control computer
    hit_points: 150
    repair_rate: 4

# The beam and shield charge settings A-E. The original's BeamRechargeRate table is
# A-E = 0, 7, 10, 15, 22 and ShieldRechargeRate 0, 1, 2, 3, 5 (GameSettings.ini); they
# are restated here as fractions of the top level (cockpit messages call the levels
# 25/50/75/100%). How many levels may be high at once is not in the data: Budget is an
# engine value (DERIVED).
power:
  beam_recharge: [0, 0.32, 0.45, 0.68, 1]
  shield_recharge: [0, 0.2, 0.4, 0.6, 1]
  budget: 6
  # Start at D/C: one step free, so an ECM pod can be switched on at once.
  start_beam: 3
  start_shield: 2
  balance_shift: 0.5

damage:
  system_share: 1
  destroy_below: 0.5
  repair_rate: 2
