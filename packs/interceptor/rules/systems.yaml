# yaml-language-server: $schema=../../../schemas/rules.schema.json
# Ship systems, power and damage for X-COM: Interceptor (Stage 2).
#
# Every fitted system can be damaged; switchable ones (tractor, cloak, ECM) draw power
# steps while on. Kinds and keys: docs site, Modding > Rulesets > Systems.
#
# Sources: hit points from the equipment sections of GameSettings.ini (EngineType1 100,
# SensorTargetingSystem1 60, ShieldType1 50, VectorControlThrusters 150, TractorBeam 250,
# ShipDamageControlComputer 150). ECM range and strength restate ECMPodType1/2
# (Range 250/500, Special 10/25), read here as metres and % per second (DERIVED).
# Power steps, cloak values and repair rates are engine estimates (DERIVED). Masses (kg)
# are the exe's special-system table (verified).
#

systems:
  engines:
    hit_points: 100
  sensors:
    name: Targeting/sensors
    hit_points: 60
  shields:
    name: Shield generator
    hit_points: 50
  vct:
    name: Vector control thrusters
    hit_points: 150
    mass: 450
  tractor:
    name: Tractor beam
    hit_points: 250
    mass: 300
    power: 2
    range: 250
    strength: 60
  cloak:
    name: Cloaking device
    hit_points: 100
    mass: 550
    power: 6   # draws 50 % of engine power (Interceptor.exe; 6 steps x 8.33 %)
    range: 400
    strength: 25
  ecm:
    name: ECM pod
    hit_points: 100
    mass: 200
    power: 1
    range: 250
    strength: 10
  advanced_ecm:
    kind: ecm
    name: Advanced ECM pod
    hit_points: 100
    mass: 200
    power: 1
    range: 500
    strength: 25
  damage_control:
    name: Ship damage control computer
    hit_points: 150
    mass: 100
    repair_rate: 4

# The beam and shield charge settings A-E (Interceptor.exe, verified). Once a second a
# ship's energy pool (0-1000, starting full) gains BeamRechargeRate[setting] = 0, 7, 10,
# 15, 22 and its shields gain ShieldRechargeRate[setting] = 0, 1, 2, 3, 5
# (GameSettings.ini), restated here as fractions of the top level times energy_recharge
# 22 and each class's shield_recharge (5 by default). The shield gain is one stream that
# the balance setting sends fore first, aft first, or half each (balance: share). Ships
# start at C/C. The original has no step budget (the settings cost engine power
# instead), so the budget is set out of reach (DERIVED).
power:
  beam_recharge: [0, 0.318, 0.4545, 0.682, 1]
  shield_recharge: [0, 0.2, 0.4, 0.6, 1]
  energy: 1000
  energy_recharge: 22
  balance: share
  budget: 20
  start_beam: 2
  start_shield: 2

# The damage pipeline (Interceptor.exe, verified): each beam or missile hit does 75-100 %
# of its damage. A hit strikes the shield bank on its side, then the armour bank on that
# side (each holds the armour's full HitPoints), then the hull. Below 75 % hull, 30 % of
# what reaches the hull goes to the ship's systems instead. (The original also rolls a
# min(damage, 100) % chance of injuring the pilot; not modelled yet.)
damage:
  spread: 75%
  armor: per_side
  system_share: 30%
  system_below: 75%
  system_divert: true
  destroy_below: 0.5   # DERIVED
  repair_rate: 2       # DERIVED
  # Bank maxima by difficulty (Beginner ... Superhuman): X-COM's own and everyone else's.
  # The player's own beam hits x 1.15 on the two easiest levels; hits on the player
  # x 0.85 on Beginner.
  difficulty:
    side: xcom
    own_shields: [150%, 125%, 100%, 100%, 100%]
    own_armor: [130%, 115%, 100%, 100%, 100%]
    other_shields: [40%, 52%, 64%, 76%, 88%]
    other_armor: [50%, 60%, 70%, 80%, 90%]
    player_hits: [115%, 115%, 100%, 100%, 100%]
    hits_on_player: [85%, 100%, 100%, 100%, 100%]
