# yaml-language-server: $schema=../../../schemas/rules.schema.json
# Ship systems, power and damage for X-COM: Interceptor (Stage 2).
#
# Every fitted system can be damaged; switchable ones (tractor, cloak, ECM) draw power
# steps while on. Kinds and keys: docs site, Modding > Rulesets > Systems.
#
# Sources: hit points from the equipment sections of GameSettings.ini (EngineType1 100,
# SensorTargetingSystem1 60, ShieldType1 50, VectorControlThrusters 150, TractorBeam 250,
# ShipDamageControlComputer 150). ECM range and strength restate ECMPodType1/2
# (Range 250/500, Special 10/25), read here as metres and % per second (DERIVED).
# Power steps, cloak values and repair rates are engine estimates (DERIVED). Masses (kg)
# are the exe's special-system table (verified).
#

# How damage affects each system (notes/re/flight/README.md, VERIFIED unless marked):
# the engine gives x0.5 thrust below 50 % of its HitPoints, x0.25 below 25 % and none
# below 15 %, where the ship is disabled (no thrust, afterburner and cloak off; §5, §11);
# the shield generator recharges at half below 50 % and not at all below 25 % (§3);
# flight control (40 points) turns at HP / 40 and a hit never takes it below 1 (§4.1,
# §5); damage to the sensor and the hyperdrive (80 points) changes nothing (§11).
# Which systems a hull carries and the other systems' damage effects are DERIVED.
systems:
  engines:
    hit_points: 100
    efficiency: [{below: 50%, factor: 0.5}, {below: 25%, factor: 0.25}, {below: 15%, factor: 0}]
    disables_below: 15%
  manoeuvring:
    name: Flight control
    hit_points: 40
    efficiency: linear
    min_hit_points: 1
  hyperdrive:
    hit_points: 80
    efficiency: ignore
  sensors:
    name: Targeting/sensors
    hit_points: 60
    efficiency: ignore
    # SensorTargetingSystem1 (setting A; Interceptor.exe, verified): LockTime 2500 ms,
    # LockAngle 2500 millidegrees, 3 km against ships. Which sensor a hull carries by
    # default is DERIVED.
    lock_time: 2.5s
    lock_angle: 2.5
    lock_range: 3km
  shields:
    name: Shield generator
    hit_points: 50
    efficiency: [{below: 50%, factor: 0.5}, {below: 25%, factor: 0}]
  vct:
    name: Vector control thrusters
    hit_points: 150
    mass: 450
  tractor:
    name: Tractor beam
    hit_points: 250
    mass: 300
    power: 2
    range: 250
    strength: 60
  cloak:
    name: Cloaking device
    hit_points: 100
    mass: 550
    power: 6   # draws 50 % of engine power (Interceptor.exe; 6 steps x 8.33 %)
    # Cloaked: 50 energy a second instead of the shield recharge, dropping at 0; hits skip
    # the shields; no missiles (README §3-5, VERIFIED).
    drain: 50
    shields_off: true
    no_missiles: true
    range: 400
    strength: 25
  ecm:
    name: ECM pod
    hit_points: 100
    mass: 200
    power: 1
    range: 250
    strength: 10
  advanced_ecm:
    kind: ecm
    name: Advanced ECM pod
    hit_points: 100
    mass: 200
    power: 1
    range: 500
    strength: 25
  damage_control:
    name: Ship damage control computer
    hit_points: 150
    mass: 100
    repair_rate: 2   # x2: 4 points a second instead of 2 (README §4.3, VERIFIED)

# The beam and shield charge settings A-E (Interceptor.exe, verified). Once a second a
# ship's energy pool (0-1000, starting full) gains BeamRechargeRate[setting] = 0, 7, 10,
# 15, 22 and its shields gain ShieldRechargeRate[setting] = 0, 1, 2, 3, 5
# (GameSettings.ini), restated here as fractions of the top level times energy_recharge
# 22 and each class's shield_recharge (5 by default). The shield gain is one stream that
# the balance setting sends fore first, aft first, or half each (balance: share). Ships
# start at C/C. The original has no step budget (the settings cost engine power
# instead), so the budget is set out of reach (DERIVED).
power:
  beam_recharge: [0, 0.318, 0.4545, 0.682, 1]
  shield_recharge: [0, 0.2, 0.4, 0.6, 1]
  energy: 1000
  energy_recharge: 22
  balance: share
  recharge_while_burning: true   # the 1 s tick recharges regardless (README §3, VERIFIED)
  budget: 20
  start_beam: 2
  start_shield: 2

# The damage pipeline (Interceptor.exe, verified): each beam or missile hit does 75-100 %
# of its damage. A hit strikes the shield bank on its side, then the armour bank on that
# side (each holds the armour's full HitPoints), then the hull. Below 75 % hull, 30 % of
# what reaches the hull goes to the ship's systems instead. (The original also rolls a
# min(damage, 100) % chance of injuring the pilot; not modelled yet.)
#
# System damage (README §4.1, VERIFIED): up to 5 rolls of rand(100)+1; beam mounts 20 %
# (rolls 1-10, 26-35), launchers 30 % (11-25, 36-50), shield generator, flight control,
# sensor and engine 10 % each, hyperdrive 5 %, special systems 3 %, nothing 2 %. The
# shield generator, sensor and engine pass damage beyond their hit points on to the next
# roll; whether the hyperdrive does is not traced (here: no). Repair (§4.3, VERIFIED):
# 2 points a second to the first of engine, hull, shield generator, flight control,
# hyperdrive, sensor, beam mounts, launchers, special systems that needs it; a system
# at 0 is never repaired (destroy_below: 0). A damaged mount or launcher fires at half
# rate at 50 % or less and not at all at 25 % or less (§3, §5.2).
damage:
  spread: 75%
  armor: per_side
  system_share: 30%
  system_below: 75%
  system_divert: true
  destroy_below: 0
  repair_rate: 2
  repair_order: [engines, hull, shields, manoeuvring, hyperdrive, sensors, beams, launchers, others]
  system_table:
    tries: 5
    rolls:
      - {chance: 20%, hit: beams}
      - {chance: 30%, hit: launchers}
      - {chance: 10%, hit: shields, carry: true}
      - {chance: 10%, hit: manoeuvring}
      - {chance: 10%, hit: sensors, carry: true}
      - {chance: 10%, hit: engines, carry: true}
      - {chance: 5%, hit: hyperdrive}
      - {chance: 3%, hit: special}
      - {chance: 2%, hit: none}
  mounts: {half_rate: 50%, no_fire: 25%}
  # The Tachyon Pulser's own table (0x44fe59, README §4.4, VERIFIED): beam mounts 10 %,
  # empty tries 10 %, shield generator 10 %, sensor 5 %, engine 50 %, hyperdrive 10 %,
  # special systems 3 %. The number of tries and which entries carry are not traced
  # (DERIVED: as the system table).
  tachyon_table:
    tries: 5
    rolls:
      - {chance: 10%, hit: beams}
      - {chance: 10%, hit: none, carry: true}
      - {chance: 10%, hit: shields, carry: true}
      - {chance: 5%, hit: sensors, carry: true}
      - {chance: 50%, hit: engines, carry: true}
      - {chance: 10%, hit: hyperdrive}
      - {chance: 3%, hit: special}
  # Bank maxima by difficulty (Beginner ... Superhuman): X-COM's own and everyone else's.
  # The player's own beam hits x 1.15 on the two easiest levels; hits on the player
  # x 0.85 on Beginner.
  difficulty:
    side: xcom
    own_shields: [150%, 125%, 100%, 100%, 100%]
    own_armor: [130%, 115%, 100%, 100%, 100%]
    other_shields: [40%, 52%, 64%, 76%, 88%]
    other_armor: [50%, 60%, 70%, 80%, 90%]
    player_hits: [115%, 115%, 100%, 100%, 100%]
    hits_on_player: [85%, 100%, 100%, 100%, 100%]
