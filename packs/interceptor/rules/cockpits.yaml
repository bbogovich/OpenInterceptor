# yaml-language-server: $schema=../../../schemas/rules.schema.json
# The three original cockpits. Which hull uses which cockpit is DERIVED (one per hull).
# Instrument.<name> = x, y, width, height in the 640x480 design space of the image.
# Instruments the engine draws: message, radar_front, radar_rear, mfd, gauge1..gauge4
# (speed, energy, shields, hull), status (throttle line), power, systems. Move them to
# match your own cockpit art. A strip much wider than tall gets an instrument's one-line
# form. All three cockpits share the top display bar, measured from the art: a lit band
# at y 9-19 (x 115-529) and two strips at y 26-37 (x 115-262 and 268-529).
# The radar rectangles enclose the round glass of each scope, measured from the art
# (crosshair centre +-1 px); the engine draws contacts only, the art supplies the rings.
#

cockpits:
  a:
    image: original:CockpitA.dll#12000
    # Wide screens: black out the sides of the dashboard (from y=305, where this art's
    # edges become solid) so space never shows through beside it (R-HUD-013).
    wide: {blackout: true, from: 305}
    instruments:
      message: [117, 9, 410, 11]
      status: [117, 26, 144, 11]
      power: [270, 26, 112, 11]
      systems: [384, 26, 144, 11]
      radar_front: [111, 332, 60, 60]
      radar_rear: [473, 332, 60, 60]
      mfd: [246, 338, 156, 82]
      gauge1: [243, 299, 26, 26]
      gauge2: [288, 299, 26, 26]
      gauge3: [333, 299, 26, 26]
      gauge4: [378, 299, 26, 26]
  b:
    image: original:CockpitB.dll#12200
    # Wide screens: black out the sides of the dashboard (from y=382, where this art's
    # edges become solid) so space never shows through beside it (R-HUD-013).
    wide: {blackout: true, from: 382}
    instruments:
      message: [117, 9, 410, 11]
      status: [117, 26, 144, 11]
      power: [270, 26, 112, 11]
      systems: [384, 26, 144, 11]
      radar_front: [126, 366, 56, 56]
      radar_rear: [462, 366, 56, 56]
      mfd: [248, 324, 146, 76]
      gauge1: [243, 431, 30, 28]
      gauge2: [285, 431, 30, 28]
      gauge3: [328, 431, 30, 28]
      gauge4: [370, 431, 30, 28]
  c:
    image: original:CockpitC.dll#12400
    # Wide screens: black out the sides of the dashboard (from y=352, where this art's
    # edges become solid) so space never shows through beside it (R-HUD-013).
    wide: {blackout: true, from: 352}
    instruments:
      message: [117, 9, 410, 11]
      status: [117, 26, 144, 11]
      power: [270, 26, 112, 11]
      systems: [384, 26, 144, 11]
      radar_front: [26, 361, 53, 53]
      radar_rear: [560, 361, 53, 53]
      mfd: [250, 377, 136, 72]
      gauge1: [246, 325, 26, 24]
      gauge2: [288, 325, 26, 24]
      gauge3: [331, 325, 26, 24]
      gauge4: [372, 325, 26, 24]
