# yaml-language-server: $schema=../../../schemas/rules.schema.json
# Beam weapons and missiles. Damage, energy, rate of fire, speed and range come from the
# original GameSettings.ini; colours and sounds are added here.
#

beams:
  laser_cannon:
    inherit: original:GameSettings.ini/LaserCannon
    name: Laser Cannon
    color: [1.0, 0.25, 0.2]
    sound: cue:Beam1
  heavy_laser:
    inherit: original:GameSettings.ini/HeavyLaser
    name: Heavy Laser
    color: [1.0, 0.5, 0.1]
    sound: cue:Beam2
  gatling_laser:
    inherit: original:GameSettings.ini/GatlingLaser
    name: Gatling Laser
    color: [1.0, 0.9, 0.2]
    sound: cue:Beam3
  tracer_cannon:
    inherit: original:GameSettings.ini/TracerCannon
    name: Tracer Cannon
    color: [0.4, 1.0, 1.0]
    sound: cue:Beam5
  phase_cannon:
    inherit: original:GameSettings.ini/PhaseCannon
    name: Phase Cannon
    shield_factor: 1.5   # x 1.5 against shields (Interceptor.exe, verified)
    color: [0.6, 0.4, 1.0]
    sound: cue:Beam4
  plasma_cannon:
    inherit: original:GameSettings.ini/PlasmaCannon
    name: Plasma Cannon
    color: [0.3, 1.0, 0.3]
    sound: cue:Beam6
  tachyon_pulser:
    inherit: original:GameSettings.ini/TachyonPulser
    name: Tachyon Pulser
    color: [0.9, 0.3, 1.0]
    sound: cue:Beam8

missiles:
  # Beam mounts take the beam section's HitPoints as their hit_points (inherited), and
  # each rack its launcher's HitPoints: both are struck by damage.system_table
  # (systems.yaml; README §4.1, VERIFIED).
  # Missiles: speed, duration, impact and proximity damage from the original. Homing
  # (Interceptor.exe, verified): every type turns at most 2.5 rad/s (143 deg/s) and leads
  # its target as if it flew at 200 m/s. The lock time, cone and range come from the
  # ship's sensor (systems.yaml). Each type's special behaviour (guidance, damage) is from
  # the guide's descriptions (DERIVED).
  xwinder:
    inherit: original:GameSettings.ini/XWinderMissile
    launcher_hit_points: 25   # XWinderMissileLauncher HitPoints (VERIFIED, notes/re/ini-files.md §1.3)
    mass: 85   # kg per round (Interceptor.exe)
    name: X-Winder
    turn_rate: 143.2
    lead_speed: 200
    color: [1.0, 0.85, 0.5]
    sound: cue:Missile1
  permeator:
    inherit: original:GameSettings.ini/PermeatorMissile
    launcher_hit_points: 25   # PermeatorMissileLauncher HitPoints (VERIFIED, notes/re/ini-files.md §1.3)
    mass: 370   # kg per round (Interceptor.exe)
    name: Permeator
    damage: bypass_shields   # "bypasses shields"
    turn_rate: 143.2
    lead_speed: 200
    color: [0.6, 1.0, 0.6]
    sound: cue:Missile3
  sidestep:
    inherit: original:GameSettings.ini/SidestepMissile
    launcher_hit_points: 25   # SidestepMissileLauncher HitPoints (VERIFIED, notes/re/ini-files.md §1.3)
    mass: 230   # kg per round (Interceptor.exe)
    name: Sidestep
    guidance: sidestep       # its own thrusters
    turn_rate: 143.2
    lead_speed: 200
    color: [0.6, 0.8, 1.0]
    sound: cue:Missile1
  fusion:
    inherit: original:GameSettings.ini/FusionMissile
    launcher_hit_points: 25   # FusionMissileLauncher HitPoints (VERIFIED, notes/re/ini-files.md §1.3)
    mass: 940   # kg per round (Interceptor.exe)
    name: Fusion Missile
    turn_rate: 143.2
    lead_speed: 200
    color: [1.0, 0.4, 0.9]
    sound: cue:Missile2
  elerium_torpedo:
    inherit: original:GameSettings.ini/EleriumTorpedo
    launcher_hit_points: 25   # EleriumTorpedoLauncher HitPoints (VERIFIED, notes/re/ini-files.md §1.3)
    mass: 70   # kg per round (Interceptor.exe)
    name: Elerium Torpedo
    turn_rate: 143.2
    lead_speed: 200
    color: [0.4, 1.0, 0.4]
    sound: cue:Missile6
  enveloping_torpedo:
    inherit: original:GameSettings.ini/EnvelopingFusionTorpedo
    launcher_hit_points: 25   # EnvelopingFusionTorpedoLauncher HitPoints (VERIFIED, notes/re/ini-files.md §1.3)
    mass: 670   # kg per round (Interceptor.exe)
    name: Enveloping Fusion Torpedo
    damage: enveloping       # damage spread over the whole surface
    turn_rate: 143.2
    lead_speed: 200
    color: [1.0, 0.6, 0.9]
    sound: cue:Missile2
  parallax_torpedo:
    inherit: original:GameSettings.ini/ParallaxTorpedo
    launcher_hit_points: 25   # ParallaxTorpedoLauncher HitPoints (VERIFIED, notes/re/ini-files.md §1.3)
    mass: 210   # kg per round (Interceptor.exe)
    name: Parallax Torpedo
    guidance: parallax       # two decoys
    decoys: 2
    turn_rate: 143.2
    lead_speed: 200
    color: [0.9, 0.9, 1.0]
    sound: cue:Missile6
  cloaking_torpedo:
    inherit: original:GameSettings.ini/PassiveCloakingTorpedo
    launcher_hit_points: 25   # PassiveCloakingTorpedoLauncher HitPoints (VERIFIED, notes/re/ini-files.md §1.3)
    mass: 440   # kg per round (Interceptor.exe)
    name: Passive Cloaking Torpedo
    guidance: cloaked_wait   # dropped; waits cloaked
    trigger_range: 800m
    turn_rate: 90
    lock_time: 0.5
    color: [0.5, 0.5, 0.6]
    sound: cue:MissileCloak
  doppelganger:
    inherit: original:GameSettings.ini/DoppelgangerMissile
    launcher_hit_points: 25   # DoppelgangerMissileLauncher HitPoints (VERIFIED, notes/re/ini-files.md §1.3)
    mass: 1145   # kg per round (Interceptor.exe)
    name: Doppelganger
    guidance: doppelganger   # a decoy copy of your ship
    turn_rate: 0
    lock_time: 0.5
    color: [1.0, 1.0, 1.0]
    sound: cue:Missile4
  # Alien base mine warheads: ExplosiveMine Damage 300, MissileMine Damage 250 (VERIFIED);
  # the blast radius is DERIVED (as the default campaign's mines).
  alien_mine_explosive: {name: Explosive mine, guidance: dumbfire, speed: 0, impact_damage: 0, proximity_damage: 300, proximity_radius: 40m}
  alien_mine_missile: {name: Missile mine, guidance: dumbfire, speed: 0, impact_damage: 0, proximity_damage: 250, proximity_radius: 40m}
