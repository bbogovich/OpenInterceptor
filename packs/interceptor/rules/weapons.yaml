# yaml-language-server: $schema=../../../schemas/rules.schema.json
# Beam weapons and missiles. Damage, energy, rate of fire, speed and range come from the
# original GameSettings.ini; colours and sounds are added here.
#

beams:
  laser_cannon:
    inherit: original:GameSettings.ini/LaserCannon
    name: Laser Cannon
    color: [1.0, 0.25, 0.2]
    sound: cue:Beam1
  heavy_laser:
    inherit: original:GameSettings.ini/HeavyLaser
    name: Heavy Laser
    color: [1.0, 0.5, 0.1]
    sound: cue:Beam2
  gatling_laser:
    inherit: original:GameSettings.ini/GatlingLaser
    name: Gatling Laser
    color: [1.0, 0.9, 0.2]
    sound: cue:Beam3
  tracer_cannon:
    inherit: original:GameSettings.ini/TracerCannon
    name: Tracer Cannon
    color: [0.4, 1.0, 1.0]
    sound: cue:Beam5
  phase_cannon:
    inherit: original:GameSettings.ini/PhaseCannon
    name: Phase Cannon
    color: [0.6, 0.4, 1.0]
    sound: cue:Beam4
  plasma_cannon:
    inherit: original:GameSettings.ini/PlasmaCannon
    name: Plasma Cannon
    color: [0.3, 1.0, 0.3]
    sound: cue:Beam6
  tachyon_pulser:
    inherit: original:GameSettings.ini/TachyonPulser
    name: Tachyon Pulser
    color: [0.9, 0.3, 1.0]
    sound: cue:Beam8

missiles:
  # Missiles: speed, duration, impact and proximity damage from the original. Turn rate
  # and lock time are engine values; each type's special behaviour (guidance, damage) is
  # from the guide's descriptions (DERIVED).
  xwinder:
    inherit: original:GameSettings.ini/XWinderMissile
    name: X-Winder
    turn_rate: 100
    lock_time: 2.0
    color: [1.0, 0.85, 0.5]
    sound: cue:Missile1
  permeator:
    inherit: original:GameSettings.ini/PermeatorMissile
    name: Permeator
    damage: bypass_shields   # "bypasses shields"
    turn_rate: 90
    lock_time: 2.5
    color: [0.6, 1.0, 0.6]
    sound: cue:Missile3
  sidestep:
    inherit: original:GameSettings.ini/SidestepMissile
    name: Sidestep
    guidance: sidestep       # its own thrusters
    turn_rate: 160
    lock_time: 2.0
    color: [0.6, 0.8, 1.0]
    sound: cue:Missile1
  fusion:
    inherit: original:GameSettings.ini/FusionMissile
    name: Fusion Missile
    turn_rate: 40
    lock_time: 3.0
    color: [1.0, 0.4, 0.9]
    sound: cue:Missile2
  elerium_torpedo:
    inherit: original:GameSettings.ini/EleriumTorpedo
    name: Elerium Torpedo
    turn_rate: 80
    lock_time: 2.0
    color: [0.4, 1.0, 0.4]
    sound: cue:Missile6
  enveloping_torpedo:
    inherit: original:GameSettings.ini/EnvelopingFusionTorpedo
    name: Enveloping Fusion Torpedo
    damage: enveloping       # damage spread over the whole surface
    turn_rate: 60
    lock_time: 2.5
    color: [1.0, 0.6, 0.9]
    sound: cue:Missile2
  parallax_torpedo:
    inherit: original:GameSettings.ini/ParallaxTorpedo
    name: Parallax Torpedo
    guidance: parallax       # two decoys
    decoys: 2
    turn_rate: 80
    lock_time: 2.0
    color: [0.9, 0.9, 1.0]
    sound: cue:Missile6
  cloaking_torpedo:
    inherit: original:GameSettings.ini/PassiveCloakingTorpedo
    name: Passive Cloaking Torpedo
    guidance: cloaked_wait   # dropped; waits cloaked
    trigger_range: 800m
    turn_rate: 90
    lock_time: 0.5
    color: [0.5, 0.5, 0.6]
    sound: cue:MissileCloak
  doppelganger:
    inherit: original:GameSettings.ini/DoppelgangerMissile
    name: Doppelganger
    guidance: doppelganger   # a decoy copy of your ship
    turn_rate: 0
    lock_time: 0.5
    color: [1.0, 1.0, 1.0]
    sound: cue:Missile4
