# yaml-language-server: $schema=../../../schemas/rules.schema.json
# The original's interactive music (Stage 6.4): its three loop sets, each with cruise,
# threat and battle states of five segments and death and victory stingers, read from the
# player's own CD (Loops/*.wav) by name. The transition tables (Loops/*.wtl) are not
# read yet: segments change state at a segment's end.

music:
  set_1:
    states:
      cruise: ["original:cruise1-1.wav", "original:cruise1-2.wav", "original:cruise1-3.wav", "original:cruise1-4.wav", "original:cruise1-5.wav"]
      threat: ["original:threat1-1.wav", "original:threat1-2.wav", "original:threat1-3.wav", "original:threat1-4.wav", "original:threat1-5.wav"]
      battle: ["original:battle1-1.wav", "original:battle1-2.wav", "original:battle1-3.wav", "original:battle1-4.wav", "original:battle1-5.wav"]
      strategy: ["original:cruise1-1.wav", "original:cruise1-2.wav", "original:cruise1-3.wav", "original:cruise1-4.wav", "original:cruise1-5.wav"]
    stingers: {death: "original:death1.wav", victory: "original:victory1.wav", good: "original:goodre1.wav", bad: "original:badre1.wav"}
    threat_range: 12km
    battle_range: 4km
    volume: 60%
