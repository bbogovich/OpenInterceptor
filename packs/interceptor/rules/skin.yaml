# yaml-language-server: $schema=../../../schemas/rules.schema.json
# The X-COM: Interceptor skin (Stage 6.1): the original's steel-grey and green palette.
# Its wrapper art (screens at 640 x 480) comes with Stage 6.7.

skins:
  xcom:
    colours:
      background: [0.02, 0.03, 0.03]
      panel: [0.10, 0.13, 0.12, 0.95]
      border: [0.35, 0.62, 0.42]
      text: [0.72, 0.95, 0.75]
      dim: [0.42, 0.55, 0.45]
      accent: [0.95, 0.80, 0.30]
      highlight: [0.14, 0.28, 0.18]
    # The original's nine bitmap sheet fonts (RQ-UI-03), read at run time from the
    # player's SpritesDLL.dll - nothing is copied. Facts: notes/re/wrappers/ui-framework.md
    # §3 and fonts.yaml (VERIFIED from Interceptor.exe: the font list 0x5ff91c, the sheet
    # loader 0x5fd750, DrawText 0x5fe4ad: glyph top = y - 5, y - 7 for 23010/23011/23013/
    # 23015; DrawTextRect 0x5fed2b: those four drop wrapped text a further 4 px). Roles are
    # the exe's call sites; the colour is painted into each sheet.
    fonts:
      topic: {sheet: original:SpritesDLL.dll#23000, top: 5}                       # cream: Research topic texts
      map: {sheet: original:SpritesDLL.dll#23006, top: 5}                         # CSD map labels (DERIVED)
      map_small: {sheet: original:SpritesDLL.dll#23007, top: 5}                   # CSD map labels (DERIVED)
      map_large: {sheet: original:SpritesDLL.dll#23008, top: 5}                   # CSD map labels (DERIVED)
      readout: {sheet: original:SpritesDLL.dll#23010, top: 7, wrap_offset: 4}     # white/green: CSD readouts, headers, captions
      body: {sheet: original:SpritesDLL.dll#23011, top: 7, wrap_offset: 4}        # white/grey: lists, tooltips, dialogs
      value: {sheet: original:SpritesDLL.dll#23013, top: 7, wrap_offset: 4}       # yellow: Research values, E&P
      highlight: {sheet: original:SpritesDLL.dll#23015, top: 7, wrap_offset: 4}   # yellow: Equip Ships, Production
      title: {sheet: original:SpritesDLL.dll#23014, top: 5}                       # large yellow: Base Stats titles
      # The exe's built-in 6 px caption font (PortDrawString 0x5ffa81): drawn by the engine
      # in its own design with the exe's advances (0x617487); y is the glyph top, a centred
      # line moves up 2 (VERIFIED).
      caption: {sheet: "builtin:small", top: 0, centre_raise: 2}
    # The TextButton (paint 0x41932d, VERIFIED): caption in the 6 px font in
    # RGB(200,200,200), frame lines RGB(0,150,0), pressed fill RGB(0,200,0) translucent
    # (its level 50 read as half: DERIVED). These are the defaults; named for clarity.
    text_button: {font: caption, colour: [0.784, 0.784, 0.784], line: [0, 0.588, 0], fill: [0, 0.784, 0, 0.5]}
    # Prompts as the original's message boxes: caption in 23010, text in 23011, text
    # buttons stacked up from the bottom (MsgBox.cpp, VERIFIED). The width and offsets
    # are DERIVED until the frame art (#127) gives the caption its verified top + 54.
    # The original's message box (MsgBox.cpp, VERIFIED - ui-framework.md §4): the style
    # kits 163 / 179 / 190 and the kits every style switches to for two (242) or three and
    # more (250) button rows; sized by its text (325 wide at least, wrapped at 425, 100 tall
    # up to 400), the fill row 430 (429 for big boxes) centred and clipped, capsule buttons
    # (rows 258-263) on the exe's rows. The style per dialog (§4.6): the common box and
    # every queued-event notice use style 1; research complete 0; reports and deliveries 2;
    # sightings, side-mission offers (and the research prompt) 3.
    dialog: {title_font: readout, body_font: body,
             kits: {style1: "original:sprite#163", style2: "original:sprite#179", style3: "original:sprite#190",
                    rows2: "original:sprite#242", rows3: "original:sprite#250"},
             styles: {default: 1, research_complete: 0, report: 2, delivery: 2, contact: 3, interception: 3, offer: 3},
             fill: "original:sprite#430", fill_large: "original:sprite#429", capsule: "original:sprite#258"}
    # Interface sounds by control (names of the sounds: in screens.yaml) and the hover
    # help box: font 23011, fill RGB(0,0,100) at level 75 (read as 75 %: DERIVED), frame,
    # kept left of x = 630 (Floaters.cpp, VERIFIED).
    sounds: {button: ui_click, text_button: ui_beep29b, capsule: ui_box_button, box_open: ui_box_open, arrow: ui_beep8}
    tooltip: {font: body}
