# yaml-language-server: $schema=../../../schemas/rules.schema.json
# Station modules in battle. Hit points come from the original module sections
# (M_XCOM*/M_ALIEN* in GameSettings.ini); meshes are the original turret and pod meshes;
# which attachment point of XBASE7 (33 points) and AL-BASE01 (28) holds what is DERIVED
# (the original builds bases from the strategy layer, Stage 4).
# Every module is covered by its hub's shield pool while the pool holds points: hits on it
# drain the pool, and what gets through strikes the hub's hull (shielded_by_hub;
# notes/re/flight/README.md §8.3, VERIFIED, RQ-C-03). A generator's shield_capacity is the
# pool maximum the original hard-codes by module type (README §8.2, VERIFIED; the INI has
# no key for it): X-COM Type1/2/3 = 2000/3000/4000, alien Type2/3 = 3000/4000.

behaviours:
  station_turret:
    prefer: {fighter: 1.5}
    states:
      guns:
        do: turret
        range: 2.5km
        burst: {per_level: [1s, 1.2s, 1.5s, 1.8s, 2.2s]}
        pause: {per_level: [2s, 1.6s, 1.2s, 1s, 0.7s]}
    skill:
      aim: {per_level: [0.3, 0.45, 0.6, 0.7, 0.8]}
      reaction: {per_level: [1.2s, 1s, 0.8s, 0.6s, 0.45s]}

  # The original's station turrets (README §8.6, unknowns §6, VERIFIED): no energy, one
  # shot per interval, 5 km. The X-COM base's are gimballed: they lead at 2,000 m/s with no
  # error, only at targets in front of them, one shot per the beam's RateOfFire. The alien
  # base's are fixed (85 deg arc): full lead, accuracy rolled once in [40 + 5d, 75 + 5d) %, a
  # miss of up to 20 m along the target's x or y axis on a failed roll beyond 200 m, a shot
  # every 1,000 - 25d ms + 0-50 ms. Both bases check their line of sight (0x59c124 and
  # 0x59cc07 set LOS on, README §8.8, VERIFIED).
  station_turret_xcom:
    prefer: {fighter: 1.5}
    states:
      guns: {do: turret, aim: gimballed, lead_speed: 2000, range: 5km, interval: rate_of_fire, line_of_sight: true, free_fire: true}
  station_turret_alien:
    prefer: {fighter: 1.5}
    states:
      guns:
        do: turret
        aim: fixed
        range: 5km
        accuracy: {per_level: [[40, 75], [45, 80], [50, 85], [55, 90], [60, 95]]}
        interval: {per_level: [1s, 0.975s, 0.95s, 0.925s, 0.9s]}
        interval_jitter: 0.05s
        line_of_sight: true
        free_fire: true

  # Pirate station turrets (README §8.6; tables 0x67d430 / 0x67d548, VERIFIED): Laser,
  # range and arc per row; fixed turrets (full lead, accuracy a + b x d %, a 20 m miss on a
  # failed roll), a shot every base + per level x d ms + 0-50 ms, the line of sight per row,
  # no energy. In the original they are gun points on the station's own model: here they
  # are modules with the X-COM laser turret's mesh and hit points (DERIVED), and the arc is
  # read as the half-angle off their facing (DERIVED).
  pirate_turret_long:    # rows 0-1: 3,000 m, 125 deg, accuracy 50 + 7d, 950 - 25d ms
    states: {guns: {do: turret, aim: fixed, range: 3km, accuracy: {per_level: [50, 57, 64, 71, 78]}, interval: {per_level: [0.95s, 0.925s, 0.9s, 0.875s, 0.85s]}, interval_jitter: 0.05s, line_of_sight: false, free_fire: true}}
  pirate_turret_short:   # rows 2-9: 2,250 m, 75 deg, accuracy 60 + 7d, 800 - 15d ms
    states: {guns: {do: turret, aim: fixed, range: 2.25km, accuracy: {per_level: [60, 67, 74, 81, 88]}, interval: {per_level: [0.8s, 0.785s, 0.77s, 0.755s, 0.74s]}, interval_jitter: 0.05s, line_of_sight: true, free_fire: true}}
  dealer_turret_top:     # row 0: 3,000 m, 125 deg, accuracy 75 + 5d, 950 + 25d ms
    states: {guns: {do: turret, aim: fixed, range: 3km, accuracy: {per_level: [75, 80, 85, 90, 95]}, interval: {per_level: [0.95s, 0.975s, 1s, 1.025s, 1.05s]}, interval_jitter: 0.05s, line_of_sight: false, free_fire: true}}
  dealer_turret_low:     # rows 1-2: 2,000 m, 85 deg, accuracy 65 + 5d, 1,250 - 25d ms
    states: {guns: {do: turret, aim: fixed, range: 2km, accuracy: {per_level: [65, 70, 75, 80, 85]}, interval: {per_level: [1.25s, 1.225s, 1.2s, 1.175s, 1.15s]}, interval_jitter: 0.05s, line_of_sight: true, free_fire: true}}
  dealer_turret_side:    # rows 3-4: 3,000 m, 90 deg, accuracy 65 + 5d, 1,000 - 10d ms
    states: {guns: {do: turret, aim: fixed, range: 3km, accuracy: {per_level: [65, 70, 75, 80, 85]}, interval: {per_level: [1s, 0.99s, 0.98s, 0.97s, 0.96s]}, interval_jitter: 0.05s, line_of_sight: false, free_fire: true}}
  # Freighter turrets (X-COM, outpost and pirate freighters, 0x593e13, VERIFIED): two fixed
  # Laser turrets, 2,000 m, the fore one at the pilot's Accuracy (25 without a pilot), the
  # aft one at 0.75 of it, a shot every 750 - 25d ms + 0-100 ms, line of sight checked.
  freighter_turret_fore:
    states: {guns: {do: turret, aim: fixed, range: 2km, accuracy: pilot, interval: {per_level: [0.75s, 0.725s, 0.7s, 0.675s, 0.65s]}, interval_jitter: 0.1s, line_of_sight: true, free_fire: true}}
  freighter_turret_aft:
    states: {guns: {do: turret, aim: fixed, range: 2km, accuracy: pilot, accuracy_factor: 75%, interval: {per_level: [0.75s, 0.725s, 0.7s, 0.675s, 0.65s]}, interval_jitter: 0.1s, line_of_sight: true, free_fire: true}}

  # Alien ship turrets (README §8.8, VERIFIED; every one fixed, no line-of-sight check, no
  # energy). S is the ship's turret skill: from the pilot's record (DERIVED: its Accuracy;
  # AlienType3 averages Intelligence, Accuracy and Flying), else rand[50, 75) on the
  # Phantasm (AlienType3) and 25 on the others. The Phantasm's Psi Blaster turret is not
  # built (no Psi beam yet, #117).
  phantasm_phase:      # (0, -2, 0) down, 3,000 m, 85 deg, S - rand[5, 15), 50(4 - d) + 900 ms
    states: {guns: {do: turret, aim: fixed, range: 3km, accuracy: pilot, accuracy_unpiloted: [50, 75], accuracy_minus: [5, 15], interval: {per_level: [1.1s, 1.05s, 1s, 0.95s, 0.9s]}, free_fire: true}}
  phantasm_plasma_low: # (0, -4.25, 0) down, 2,500 m, 95 deg, S, 25(4 - d) + 750 ms
    states: {guns: {do: turret, aim: fixed, range: 2.5km, accuracy: pilot, accuracy_unpiloted: [50, 75], interval: {per_level: [0.85s, 0.825s, 0.8s, 0.775s, 0.75s]}, free_fire: true}}
  phantasm_plasma_top: # (0, 4.25, 0) up, 1,500 m, 92 deg, S - rand[5, 15), 50(4 - d) + 500 ms
    states: {guns: {do: turret, aim: fixed, range: 1.5km, accuracy: pilot, accuracy_unpiloted: [50, 75], accuracy_minus: [5, 15], interval: {per_level: [0.7s, 0.65s, 0.6s, 0.55s, 0.5s]}, free_fire: true}}
  shade_phase:         # 1,500 m, 45 deg, S - rand[5, 15), 50(4 - d) + 750 ms
    states: {guns: {do: turret, aim: fixed, range: 1.5km, accuracy: pilot, accuracy_minus: [5, 15], interval: {per_level: [0.95s, 0.9s, 0.85s, 0.8s, 0.75s]}, free_fire: true}}
  harbinger_tachyon:   # 1,000 m, 85 deg, 50 + 5d, rand[1,000, 1,250) - 25d ms
    states: {guns: {do: turret, aim: fixed, range: 1km, accuracy: {per_level: [50, 55, 60, 65, 70]}, interval: {per_level: [1s, 0.975s, 0.95s, 0.925s, 0.9s]}, interval_jitter: 0.25s, free_fire: true}}
  harbinger_tachyon_tail: # 275 m, 15 deg, accuracy 0 (held to 1), every frame
    states: {guns: {do: turret, aim: fixed, range: 275m, accuracy: 0, interval: 0s, free_fire: true}}
  spirit_plasma_low:   # (0, -23, 0) down, 1,000 m, 85 deg, S (25), rand[750, 850) - 25d ms
    states: {guns: {do: turret, aim: fixed, range: 1km, accuracy: pilot, interval: {per_level: [0.75s, 0.725s, 0.7s, 0.675s, 0.65s]}, interval_jitter: 0.1s, free_fire: true}}
  spirit_plasma_top:   # (0, 27, 0) up, 1,000 m, 95 deg, int(S x 0.75)
    states: {guns: {do: turret, aim: fixed, range: 1km, accuracy: pilot, accuracy_factor: 75%, interval: {per_level: [0.75s, 0.725s, 0.7s, 0.675s, 0.65s]}, interval_jitter: 0.1s, free_fire: true}}

  # Alien base mines go off on contact: collidable objects of radius 10 whose INI Range
  # is 0 (unknowns §9, DERIVED).
  alien_mine:
    states: {wait: {do: mine, range: 0}}

modelsets:
  xcom_turret: {intact: original:GUNTURRET2, debris: xcom_base, destroyed_effect: explosion_fighter}
  xcom_module: {intact: original:XMMOD02, debris: xcom_base, destroyed_effect: explosion_capital}
  alien_gun_pod: {intact: original:A-BMODG01, debris: alien_base, destroyed_effect: explosion_alien}
  alien_pod: {intact: original:A-BMOD01, debris: alien_base, destroyed_effect: explosion_alien}
  alien_explosive_mine: {intact: original:A_EXPMIN, destroyed_effect: explosion_alien}
  alien_missile_mine: {intact: original:MISSMINE, destroyed_effect: explosion_alien}

objects:
  xcom_beam_defense:
    inherit: original:GameSettings.ini/M_XCOMBeamDefense_Laser
    name: Beam defence module
    model_set: xcom_turret
    faction: xcom
    beams: [laser_cannon, laser_cannon]
    turret_arc: 180
    behaviour: station_turret_xcom
    shielded_by_hub: true
  xcom_shield_generator:
    inherit: original:GameSettings.ini/M_XCOMShieldGeneratorType1
    name: Shield generator module
    model_set: xcom_module
    faction: xcom
    shield_capacity: 2000   # M_XCOMShieldGeneratorType1 (VERIFIED)
    shielded_by_hub: true
  xcom_hangar:
    inherit: original:GameSettings.ini/M_XCOMHangar
    name: Hangar module
    model_set: xcom_module
    faction: xcom
    shielded_by_hub: true
  alien_beam_pod:
    inherit: original:GameSettings.ini/M_ALIENBeamDefense_PlasmaPulse
    name: Alien plasma pod
    model_set: alien_gun_pod
    faction: alien
    beams: [plasma_cannon]
    turret_arc: 85
    behaviour: station_turret_alien
    shielded_by_hub: true
  alien_shield_pod:
    inherit: original:GameSettings.ini/M_ALIENShieldGeneratorType2
    name: Alien shield pod
    model_set: alien_pod
    faction: alien
    shield_capacity: 3000   # M_ALIENShieldGeneratorType2 (VERIFIED)
    shielded_by_hub: true
  pirate_turret_long:
    inherit: original:GameSettings.ini/M_XCOMBeamDefense_Laser   # hit points: DERIVED
    name: Pirate laser turret
    model_set: xcom_turret
    faction: pirate
    beams: [laser_cannon]
    turret_arc: 125
    behaviour: pirate_turret_long
  pirate_turret_short:
    inherit: pirate_turret_long
    turret_arc: 75
    behaviour: pirate_turret_short
  dealer_turret_top:
    inherit: pirate_turret_long
    name: Arms dealer laser turret
    faction: neutral
    behaviour: dealer_turret_top
  dealer_turret_low:
    inherit: dealer_turret_top
    turret_arc: 85
    behaviour: dealer_turret_low
  dealer_turret_side:
    inherit: dealer_turret_top
    turret_arc: 90
    behaviour: dealer_turret_side
  # Alien base mines (mine table 0x73f4ac: type 1 a_expmin, type 2 missmine, VERIFIED);
  # 50 hit points and the warheads' damage from ExplosiveMine / MissileMine (VERIFIED).
  alien_explosive_mine:
    kind: mine
    name: Explosive mine
    model_set: alien_explosive_mine
    faction: alien
    hit_points: 50
    missiles: {alien_mine_explosive: 1}
    behaviour: alien_mine
  alien_missile_mine:
    kind: mine
    name: Missile mine
    model_set: alien_missile_mine
    faction: alien
    hit_points: 50
    missiles: {alien_mine_missile: 1}
    behaviour: alien_mine
  # Freighter turrets (0x593e13, VERIFIED but for the look: the X-COM turret's mesh and hit
  # points, DERIVED).
  freighter_turret_fore:
    inherit: pirate_turret_long
    name: Freighter laser turret
    faction: xcom
    turret_arc: 85
    behaviour: freighter_turret_fore
  freighter_turret_aft:
    inherit: freighter_turret_fore
    turret_arc: 80
    behaviour: freighter_turret_aft
  # Alien ship turrets: gun points on the ship's own model in the original; here modules
  # with the alien gun pod's mesh and the plasma pod's hit points (DERIVED).
  phantasm_phase:
    inherit: alien_beam_pod
    name: Alien phase turret
    beams: [phase_cannon]
    behaviour: phantasm_phase
  phantasm_plasma_low: {inherit: alien_beam_pod, name: Alien plasma turret, turret_arc: 95, behaviour: phantasm_plasma_low}
  phantasm_plasma_top: {inherit: alien_beam_pod, name: Alien plasma turret, turret_arc: 92, behaviour: phantasm_plasma_top}
  shade_phase: {inherit: phantasm_phase, turret_arc: 45, behaviour: shade_phase}
  harbinger_tachyon: {inherit: alien_beam_pod, name: Alien tachyon turret, beams: [tachyon_pulser], behaviour: harbinger_tachyon}
  harbinger_tachyon_tail: {inherit: harbinger_tachyon, turret_arc: 15, behaviour: harbinger_tachyon_tail}
  spirit_plasma_low: {inherit: alien_beam_pod, name: Alien plasma turret, behaviour: spirit_plasma_low}
  spirit_plasma_top: {inherit: alien_beam_pod, name: Alien plasma turret, turret_arc: 95, behaviour: spirit_plasma_top}
