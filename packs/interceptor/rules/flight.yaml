# yaml-language-server: $schema=../../../schemas/rules.schema.json
# Global flight settings. Afterburner Boost/Cost come from the original file.
flight:
  inherit: original:GameSettings.ini/Afterburners
  # newtonian: throttle is thrust, ships coast, Z reverses thrust, B brakes.
  # assisted: throttle is a target speed with automatic slowing (arcade feel).
  model: newtonian
  # Ships reaching this distance from the arena centre are halted at the edge (metres).
  arena_radius: 60000
  # Missile lock cone half-angle and radar range: engine values (the original
  # SensorsSetting LockAngle units are not yet decoded — see Deviations).
  lock_angle: 10
  radar_range: 6000
  # Hyperdrive countdown in seconds (engine value; the original counts down on screen).
  hyperspace_time: 10
  # Shots: plain physics, as the original (engine value; recorded in Deviations until
  # observed side by side). Lighting is an engine choice for visibility: the rim
  # outlines dark alien hulls, distant craft show as radar-coloured dots.
  bolt_frame: world
  lighting: {ambient: 0.30, sun: 0.85, rim: 0.35, distant_dot: 4}

# Event sounds by the original's cue names (ProgramFiles/soundfx.ini on the CD).
audio:
  cue_table: original:soundfx.ini/InterceptorSounds

sounds:
  explosion: cue:SmallExplode
  big_explosion: cue:BigExplode
  shield_hit: cue:ShieldHit1
  hull_hit: cue:MissileHullHit
  lock: cue:TargetLock
  missile_launch: cue:Missile1
  afterburner: cue:AfterBurner
  target: cue:CycleTarget
  denied: cue:Denied
  collision: cue:SmallCollide
  system_damage: cue:SystemDamage1
  tractor: cue:TractorStart
  cloak: cue:Cloak
  ecm: cue:Beep2
  hyperspace: cue:WarpOut
  point_defence: cue:Beam5
  # The computer voice (named cues in the original's sound table).
  mission_accomplished: cue:Comp_MissionAccomplished
  mission_failed: cue:Comp_MissionFailed
  # Pilot radio voices (voices: <set>) are not mapped yet: the original's FPilot/MPilot
  # chatter clips are numbered, and which line each one says is not known (R-MSN-007).
