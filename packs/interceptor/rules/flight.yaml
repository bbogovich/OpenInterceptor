# yaml-language-server: $schema=../../../schemas/rules.schema.json
# Global flight settings.
flight:
  # The afterburner draws 100 energy a second from the pool (Interceptor.exe, verified;
  # the INI's Afterburners Boost/Cost are only sent to multiplayer peers).
  cost: 100
  # The original's motion (Interceptor.exe and xcgen.dll, verified): drag dv/dt = a - 2v
  # on every ship; the player's push is engine thrust (kN) x 1000 x throttle % x engine
  # power / mass, where each beam or shield level and system step in use costs 1/12 of
  # the engine's power; reverse is half; the afterburner adds half the full thrust; a
  # shield adds 250 kg. The player is held to MaxSpeed; AI ships drive by ai_speed.
  drive: {drag: 2, thrust_scale: 100000, power_cost: 8.333%, reverse: 50%, afterburner: 50%, shield_mass: 250}
  # The original's turn model: hull rates x 0.08 per stick, settling at that / k with
  # k = 4 x (1 - 0.1 x AngularDamp) (a Lightning rolls 5 rad/s, tau 0.31 s); AI pilots
  # turn at their class's ai_turn rates.
  turning: {gain: 0.08, damping: 4, damp_step: 0.1, ai_rates: {pitch: 2, yaw: 2, roll: 3}}
  # AI pilot grades (the pilot record's +0x28; notes/re/unknowns-2026-11.md §5 and
  # flight README §5.1, VERIFIED): obstacle look-ahead along the course 225 m for grade 0,
  # 100 m for grade 2, 250 m otherwise and with no pilot; beyond 3 km from its target a
  # pilot sprints at 1.0625 x the full throttle when its grade is not 0, and every pilot
  # does from Genius (level index 3) on.
  # Beam link modes as the original's (README §3, VERIFIED): linked fires every mount of the
  # selected mount's type, and each mount fires on its own timer and energy.
  link_modes: original
  pilot_grades:
    lookahead: 250m
    grades: [{lookahead: 225m, sprint: false}, {lookahead: 250m}, {lookahead: 100m}, {lookahead: 250m}, {lookahead: 250m}]
    sprint: {beyond: 3km, throttle: 106.25%, from_level: 3}
  # newtonian: throttle is thrust, ships coast, Z reverses thrust, B brakes.
  # assisted: throttle is a target speed with automatic slowing (arcade feel).
  model: newtonian
  # Ships reaching this distance from the arena centre are halted at the edge (metres).
  arena_radius: 60000
  # Missile lock (Interceptor.exe, verified): the sensor sets the time, cone and range
  # (systems.yaml); once locked the cone doubles, and off target a part-built lock runs
  # down as fast as it built. lock_angle is only the fallback for a ship without sensors.
  lock_angle: 2.5
  lock_decay: true
  lock_hold: 2
  radar_range: 6000
  # Hyperdrive countdown in seconds (engine value; the original counts down on screen).
  hyperspace_time: 10
  # Shots: plain physics, as the original (engine value; recorded in Deviations until
  # observed side by side). Lighting is an engine choice for visibility: the rim
  # outlines dark alien hulls, distant craft show as radar-coloured dots.
  bolt_frame: world
  # Bolts leave at their muzzle speed alone, without the ship's velocity (verified).
  bolt_inherit: false
  lighting: {ambient: 0.30, sun: 0.85, rim: 0.35, distant_dot: 4}

# Event sounds by the original's cue names (ProgramFiles/soundfx.ini on the CD).
audio:
  cue_table: original:soundfx.ini/InterceptorSounds

sounds:
  explosion: cue:SmallExplode
  big_explosion: cue:BigExplode
  shield_hit: cue:ShieldHit1
  hull_hit: cue:MissileHullHit
  lock: cue:TargetLock
  missile_launch: cue:Missile1
  afterburner: cue:AfterBurner
  target: cue:CycleTarget
  denied: cue:Denied
  collision: cue:SmallCollide
  system_damage: cue:SystemDamage1
  tractor: cue:TractorStart
  cloak: cue:Cloak
  ecm: cue:Beep2
  hyperspace: cue:WarpOut
  point_defence: cue:Beam5
  # The computer voice (named cues in the original's sound table).
  mission_accomplished: cue:Comp_MissionAccomplished
  mission_failed: cue:Comp_MissionFailed
  # Pilot radio voices: see voices: below.

# Pilot radio voices (notes/re/unknowns-2026-11.md §11, VERIFIED): radio wave n of voice set v
# (1-5, male M / female F) plays SoundFX\\Chatter\\{M|F}Pilot{v}{nn}.wav, file number 100 v + n.
# Which line most waves say is not known (R-MSN-007); waves 33-36 are the Nova bomb messages
# 0x46-0x49, given here as the lines wave33-wave36. Which set a pilot speaks with comes from
# its record; the X-COM craft use mpilot1 until pilot records reach battle (DERIVED).
voices:
  mpilot1: {name: Male pilot 1, wave33: ["original:MPilot133.wav"], wave34: ["original:MPilot134.wav"], wave35: ["original:MPilot135.wav"], wave36: ["original:MPilot136.wav"]}
  mpilot2: {name: Male pilot 2, wave33: ["original:MPilot233.wav"], wave34: ["original:MPilot234.wav"], wave35: ["original:MPilot235.wav"], wave36: ["original:MPilot236.wav"]}
  mpilot3: {name: Male pilot 3, wave33: ["original:MPilot333.wav"], wave34: ["original:MPilot334.wav"], wave35: ["original:MPilot335.wav"], wave36: ["original:MPilot336.wav"]}
