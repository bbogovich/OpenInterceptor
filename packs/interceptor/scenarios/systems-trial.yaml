# Stage 2 testbed: every ship system in one arena.
id: systems-trial
order: 25
title: "Systems trial: power, tractor, cloak, hyperspace"
description: >-
  Try the power controls (F9/F10 charge rates, ; and ' to move power, S shield balance),
  tow the disabled Wraith with the tractor beam (Shift+T; the Super Avenger and Firestar
  carry one) and jump out with it (H) to capture it. A Shade cloaks (Shift+C on your
  side too, if fitted); a Harbinger tries to tow you. Wingman orders: ] menu.
player: choose
player_position: [0, 0, 0]
sun: [-0.4, 0.45, -0.8]
starfield_seed: 12

objects:
  wing1:
    class: lightning
    ai: wingman
    leader: player
    position: [-80, 0, 40]
    offset: [-80, 0, 40]
  wing2:
    class: firestar
    ai: wingman
    leader: player
    position: [80, 0, 40]
    offset: [80, 0, 40]
  # A disabled Wraith drifting ahead: the capture target.
  prize:
    class: wraith
    position: [0, 0, -900]
    rotation: [40, 10, 0]
    speed: 20
    destroyed_systems: [engines, manoeuvring]
    hull: 0.5
    ai: idle
  shade:
    class: shade
    ai: enemy
    position: [-1500, 300, -5000]
    speed: 300
  harbinger:
    class: harbinger
    ai: enemy
    position: [2000, -200, -6000]
    speed: 150
  wraith1:
    class: wraith
    ai: enemy
    position: [1200, 400, -5500]
    speed: 300
