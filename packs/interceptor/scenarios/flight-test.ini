; Stage 1 exit scenario: the player, an X-COM base, two wingmen and one of every enemy
; type. The enemies fly practice circles ("target") so the flight model, cockpit,
; targeting and weapons can be tested without being shot down. See combat-test for the
; same arena with hostile enemies.
[scenario]
id = flight-test
order = 10
title = Flight test: station patrol
description = Patrol around the X-COM base with two wingmen. One of every alien and pirate type circles nearby as a practice target.
player = choose
player_position = 0, 0, 0
sun = -0.4, 0.45, -0.8
starfield_seed = 7

