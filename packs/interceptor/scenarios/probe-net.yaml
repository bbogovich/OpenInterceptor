# Stage 2 testbed: sensor and jamming probes.
id: probe-net
order: 28
title: "Probe net: sensors and jamming"
description: >-
  Your sensor probe 7 km ahead shows the Wraiths around it on your radar long before
  your own sensors reach them. An alien ECM probe sits on the way: fly within 2.5 km of
  it and your radar range halves and missile locks take twice as long. Shoot it down.
player: choose
player_position: [0, 0, 0]
starfield_seed: 12
objects:
  eye: {class: sensor_probe, position: [0, 200, -7000]}
  jammer: {class: ecm_probe, faction: alien, position: [600, 0, -2500]}
  wraith1: {class: wraith, ai: enemy, position: [-800, 300, -9500], speed: 150}
  wraith2: {class: wraith, ai: enemy, position: [900, -200, -9800], speed: 150}
