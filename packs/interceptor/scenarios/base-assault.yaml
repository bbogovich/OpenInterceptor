  base:
    class: alien_base
    position: [0, 0, -1500]
    ai: idle
  wing1: {class: firestar, ai: wingman, leader: player, position: [-80, 400, 1540], offset: [-80, 0, 40]}
  wing2: {class: lightning, ai: wingman, leader: player, position: [80, 400, 1540], offset: [80, 0, 40]}
  wraith1: {class: wraith, ai: enemy, position: [-1200, 600, -800], speed: 300}
  wraith2: {class: wraith, ai: enemy, position: [1200, 300, -900], speed: 300}
