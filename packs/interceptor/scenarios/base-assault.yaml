# Stage 2 testbed: a station with modules. Knock out the alien base's shield pods to
# bring its shields down, silence its plasma pods, then destroy the hub (its pods go
# with it).
id: base-assault
order: 26
title: "Base assault: alien base with pods"
description: >-
  An alien base with plasma gun pods and shield pods. While a shield pod survives the
  hub's shields hold; destroy the hub and every pod goes with it. Two wingmen fly with
  you (] for orders).
player: choose
player_position: [0, 400, 1500]
sun: [-0.4, 0.45, -0.8]
starfield_seed: 31
