# yaml-language-server: $schema=../../../schemas/rules.schema.json
# The X-COM: Interceptor strategy layer (Stage 4.12), on top of references.yaml (the
# original's sections, inherited, and its tech-id table). Values marked DERIVED are
# estimates from the design analysis (docs: Design > Original analysis), not read from
# the original; everything else is inherited from the player's GameSettings.ini.

economy:
  cost_scale: 1000          # the original's costs, prices and upkeep are in thousands
  module_time: days         # module ProdTime is days
  delivery: 72h             # DERIVED
  salvage_per_kill: 20000   # DERIVED (the original's salvage tables, *Goodies, come later)

# The time dial (Interceptor.exe, verified): six speeds of game time per real second and
# no pause. Events and prompts drop the clock to the slowest; the original's "(5 secs)"
# buttons select it too.
clock:
  speeds: [5s, 1min, 5min, 30min, 1h, 1d]
  on_event: 0
  run: 3
  # "OK" keeps the speed, "OK (5 secs)" drops it to the slowest (RQ-S-18, VERIFIED -
  # ui-framework.md §4.5): offered by the queued events 2 (ship damaged), 6 (people
  # killed), 0xb (module built) and 0xc (base built), research complete, the reports,
  # deliveries, sightings and the like; every other box is a plain OK.
  notices: ask
  notice_buttons: ["@orig.S_OK", "@orig.S_OK5SECS"]
  ask_for: [base_built, module_built, research_complete, delivery, report, contact, damage]
  first_key: 0                              # keys 1-6 pick the six speeds (VERIFIED, OnCommand 49-54)

start:
  date: 2067-01-01                          # DERIVED from the manual's opening
  money_from: original:GameSettings.ini/StartingTreasury
  map: frontier
  pilots: 4                                 # DERIVED
  bases: [{type: xcom, system: s0, name: Frontier Base One, modules: [hangar]}]
  craft: [{hull: lightning, base: 0, count: 3}]   # DERIVED
  stock: {laser_cannon: 6, xwinder: 16}     # DERIVED

maps:
  frontier:
    kind: generated
    size: [60000, 60000]      # the executable's MAX_GRIDRANGE
    # The count rolled as the original does (VERIFIED, unknowns-2026-11.md §13.5: rand % 100
    # <= 10 -> 65, <= 20 -> 70, <= 90 -> 75, else 80).
    system_counts: {65: 11, 70: 10, 75: 70, 80: 9}
    # 4 or 5 existing systems become hidden black holes, each at least 7,500 units (1.25 ly)
    # from the others (VERIFIED, unknowns-2026-11.md §14.6).
    black_holes: [4, 5]
    black_hole_spacing: 7500
    names: ["original:starcorp1.txt/STAR NAMES"]   # the original's star names (Text/starcorp1.txt)
    travel: free
    unit_ly: 0.000167

# The original's nine star classes (VERIFIED, unknowns-2026-11.md §13.5): weights from its
# class roll (rand % 100: <= 2 Red Giant, <= 6 Blue Giant, <= 10 Black Hole, <= 13 White
# Dwarf, <= 24 Blue, <= 35 White, <= 70 Yellow, <= 85 Orange, else Red Dwarf); a black-hole
# roll is re-drawn, so black holes weigh 0 here and are placed by black_holes. Icons: the
# CSD's level-0 class icons, 9 x 9 (sprite rows 893-901, §1.2). Portraits (the CSD's level
# 2): five 20-frame star pictures (VERIFIED, §14.4) - 454 Yellow, 474 Orange, 494 Red Giant
# and Red Dwarf, 514 Blue Giant and Blue, 534 White Dwarf and White; a black hole has none
# (it cannot be opened). Colours (the dot when an icon is missing) are DERIVED. Planets
# (VERIFIED, 0x5dab1e): 1 + the class's entry of a 10 x 9 table (0x662e60, row rand % 10),
# held to 2-5; the lists below are those results. A black hole gets none (placed apart).
star_classes:
  red_giant: {color: [1.0, 0.4, 0.3], weight: 3, icon: "original:sprite#899", portrait: "original:sprite#494", portrait_frames: 20, planets: [2, 2, 2, 2, 2, 3, 3, 3, 4, 5]}
  blue_giant: {color: [0.5, 0.65, 1.0], weight: 4, icon: "original:sprite#896", portrait: "original:sprite#514", portrait_frames: 20, planets: [2, 3, 4, 4, 4, 5, 5, 5, 5, 5]}
  white_dwarf: {color: [0.9, 0.9, 1.0], weight: 3, icon: "original:sprite#893", portrait: "original:sprite#534", portrait_frames: 20, planets: [2, 2, 2, 2, 2, 2, 3, 3, 3, 5]}
  blue: {color: [0.55, 0.7, 1.0], weight: 11, icon: "original:sprite#895", portrait: "original:sprite#514", portrait_frames: 20, planets: [2, 2, 2, 3, 4, 4, 5, 5, 5, 5]}
  white: {color: [0.95, 0.95, 1.0], weight: 11, icon: "original:sprite#894", portrait: "original:sprite#534", portrait_frames: 20, planets: [2, 2, 2, 3, 3, 3, 4, 4, 5, 5]}
  yellow: {color: [1.0, 0.92, 0.55], weight: 35, icon: "original:sprite#897", portrait: "original:sprite#454", portrait_frames: 20, planets: [3, 3, 3, 4, 4, 5, 5, 5, 5, 5]}
  orange: {color: [1.0, 0.7, 0.35], weight: 15, icon: "original:sprite#898", portrait: "original:sprite#474", portrait_frames: 20, planets: [2, 3, 3, 3, 4, 4, 5, 5, 5, 5]}
  red_dwarf: {color: [1.0, 0.45, 0.35], weight: 14, icon: "original:sprite#900", portrait: "original:sprite#494", portrait_frames: 20, planets: [2, 2, 2, 2, 2, 2, 2, 2, 2, 2]}
  black_hole: {color: [0.5, 0.2, 0.7], weight: 0, icon: "original:sprite#901"}

# Research is downloaded from Earth through each base's downlinks (30/35/40 work units an
# hour by type). Progress belongs to the topic, so switching away keeps it (verified:
# notes/re/strategy/README.md section 4.1).
research_model:
  mode: download
  rate: module_count(downlink_type1) * 30 + module_count(downlink_type2) * 35 + module_count(downlink_type3) * 40
  switching: keep_progress
  # Score for a finished topic by its Level (VERIFIED, README §2.4 / §4.1: +250, +500,
  # +750 for Levels 1-3; Level 0 taking 250 too is DERIVED).
  score_by_level: [250, 250, 500, 750]

# Salvage chances by difficulty: the original's *Goodies tables, read from its INI
# (per cent, Beginner ... Superhuman; unknowns-2026-11.md §11.2).
goodies:
  beam: {inherit: original:GameSettings.ini/BeamGoodies}
  missile: {inherit: original:GameSettings.ini/MissileGoodies}
  freighter: {inherit: original:GameSettings.ini/FreighterGoodies}
  alien_corpse: {inherit: original:GameSettings.ini/AlienCorpseGoodies}

# Artefact-gated topics (RQ-S-03; the original's Prereq 127, README §4.2, VERIFIED): offered
# once their artefact is recovered and only while it stays in some base's stores. Which item
# each needs (the exe's table at 0x66f768 is not extracted) is DERIVED: the alien weapons'
# own items, and artefact items below for corpses, saucers and probes. Still open as before
# (no source yet): the mines, the Doomsday component pieces (#135), Poltergeist and Shade.
research:
  phase_cannon: {requires_item: phase_cannon}
  plasma_pulse_cannon: {requires_item: plasma_cannon}
  psi_blaster: {requires_item: psi_blaster}
  elerium_torpedo: {requires_item: elerium_torpedo}
  enveloping_fusion_torpedo: {requires_item: enveloping_torpedo}
  parallax_torpedo: {requires_item: parallax_torpedo}
  aereon: {requires_item: aereon_corpse}
  ethereal: {requires_item: ethereal_corpse}
  muton: {requires_item: muton_corpse}
  psilord: {requires_item: psilord_corpse}
  sectoid: {requires_item: sectoid_corpse}
  type_1_saucer_examination: {requires_item: type_1_saucer_wreck}
  type_2_saucer_examination: {requires_item: type_2_saucer_wreck}
  type_3_saucer_examination: {requires_item: type_3_saucer_wreck}
  alien_sensor_probe: {requires_item: alien_sensor_probe_wreck}
  alien_comm_jammer_probe: {requires_item: alien_comm_jammer_probe_wreck}
  alien_intel_jammer_probe: {requires_item: alien_intel_jammer_probe_wreck}
  alien_drone: {requires_item: alien_drone_wreck}
  # Nova Bomb's five extra prerequisites, which the exe adds to its INI ones (VERIFIED, §4.2).
  nova_bomb: {requires_all: [synthetic_elerium, fusion_missile, advanced_autonomous_targeting_system, enveloping_fusion_torpedo, alien_drive_component_piece_3]}

hulls:
  # One shield and one armour slot beside the original's mount counts (DERIVED).
  lightning: {inherit: original:GameSettings.ini/Ship_IntType1, speed: 3000, slots: {shield: 1, armor: 1}}   # speed DERIVED
  firestar: {inherit: original:GameSettings.ini/Ship_IntType2, speed: 3600, slots: {shield: 1, armor: 1}}
  avenger: {inherit: original:GameSettings.ini/Ship_IntType3, speed: 4200, slots: {shield: 1, armor: 1}}

# Missile racks: rounds per missile slot, the launchers' Rounds (VERIFIED,
# GameSettings.ini *Launcher; flight README §5.2: Rounds fills the mount).
items:
  xwinder: {rounds: 5}
  permeator: {rounds: 3}
  sidestep: {rounds: 4}
  fusion: {rounds: 2}
  elerium_torpedo: {rounds: 4}
  enveloping_torpedo: {rounds: 3}
  parallax_torpedo: {rounds: 3}
  cloaking_torpedo: {rounds: 2}
  doppelganger: {rounds: 1}
  nova_bomb: {rounds: 1}
  # Artefacts: recovered by salvage only (no price, so never in the market).
  aereon_corpse: {name: Aereon corpse, kind: artefact}
  ethereal_corpse: {name: Ethereal corpse, kind: artefact}
  muton_corpse: {name: Muton corpse, kind: artefact}
  psilord_corpse: {name: Psilord corpse, kind: artefact}
  sectoid_corpse: {name: Sectoid corpse, kind: artefact}
  type_1_saucer_wreck: {name: Type 1 saucer wreckage, kind: artefact}
  type_2_saucer_wreck: {name: Type 2 saucer wreckage, kind: artefact}
  type_3_saucer_wreck: {name: Type 3 saucer wreckage, kind: artefact}
  alien_sensor_probe_wreck: {name: Alien sensor probe, kind: artefact}
  alien_comm_jammer_probe_wreck: {name: Alien comm jammer probe, kind: artefact}
  alien_intel_jammer_probe_wreck: {name: Alien intel jammer probe, kind: artefact}
  alien_drone_wreck: {name: Alien drone, kind: artefact}

# Module groups (for the base type's limits) and what each does while working. DERIVED
# from the manual's descriptions.
base_modules:
  downlink_type1: {group: downlink}
  downlink_type2: {group: downlink}
  downlink_type3: {group: downlink}
  hangar: {group: hangar, effects: {hangar: 3}, on_destroyed: [craft]}          # AUTH: ships in it are lost
  personnel: {group: personnel, effects: {quarters: 5}, on_destroyed: [pilots]} # AUTH: pilots in it are killed
  # The base's scan range is its sensor's: 2,000 / 4,000 / 6,000 map units (1/3, 2/3 and
  # 1 ly; strategy README §3.2, VERIFIED); a base without one sees nothing.
  sensor_type1: {group: sensor, effects: {sensor_range: 2000}}
  sensor_type2: {group: sensor, effects: {sensor_range: 4000}}
  sensor_type3: {group: sensor, effects: {sensor_range: 6000}}
  shield_generator_type1: {group: shield, effects: {defence: 1}}
  shield_generator_type2: {group: shield, effects: {defence: 2}}
  shield_generator_type3: {group: shield, effects: {defence: 3}}
  communications: {group: comms}
  cargo: {group: cargo, effects: {storage: 1000}, on_destroyed: [stock]}       # AUTH: its stock is lost
  medical: {group: medical}
  training: {group: training}
  probe_launch: {group: probe}
  tractor: {group: special}
  ecmtype1: {group: ecm}
  ecmtype2: {group: ecm}
  advanced_damage_control: {group: special}
  beam_defense_laser: {group: weapon}
  beam_defense_heavy_laser: {group: weapon}
  beam_defense_gatling_laser: {group: weapon}
  beam_defense_tracer_cannon: {group: weapon}
  beam_defense_tracking_tracer: {group: weapon}
  beam_defense_phase: {group: weapon}
  beam_defense_plasma_pulse: {group: weapon}
  beam_defense_tachyon_pulser: {group: weapon}
  missile_defense_xwinder: {group: weapon}
  missile_defense_permeator: {group: weapon}
  missile_defense_elerium_torp: {group: weapon}
  missile_defense_enveloping_torp: {group: weapon}
  missile_defense_sidestep: {group: weapon}
  missile_defense_parallax: {group: weapon}

base_types:
  xcom:
    name: X-COM base
    cost: 1500000                   # DERIVED (the guide: 1.5M plus modules, less 25%)
    build_time: 7d
    max_bases: 8                    # the game's own limit (the executable allows 20)
    placement: base_distance(system) <= 9000   # 1.5 light years from one of your bases
    sensor_range: 0                 # the hub sees nothing itself (README §3.2, VERIFIED)
    limits: {shield: 1, sensor: 1, comms: 1, hangar: 3, downlink: 3, weapon: 10}
    # The guide: a new base comes with the best available downlink, shield and sensor
    # (groups), and two beam defence lasers. DERIVED.
    template: [beam_defense_laser, beam_defense_laser, downlink, shield, sensor]

# The corporations' funding (DERIVED: the original's monthly evaluation per outpost
# system arrives with relations in Stage 5).
incomes:
  corporate_funding: {name: Corporate funding, every: 30d, amount: 600000 + month_score * 100}

# Alien and pirate activity (DERIVED: the alien strategist replaces these rolls in Stage 5).
raids:
  # salvage_items: the artefacts a won battle may recover (RQ-S-03), each rolled with its
  # goodies chance. The original salvages by what the destroyed ships carried (§11.2); which
  # raid yields which artefact, and the probe and saucer tables, are DERIVED.
  # Alien flights seen by a base's sensors turn on that base with 25 + 10 x level %
  # (react_on_detect; strategy README §6.3: the chance VERIFIED, the re-tasking DERIVED).
  alien_probe: {name: Alien probe, mission: destroy_alien_probe, faction: alien, every: 3d, chance: 60%, target: system, speed: 1500, react_on_detect: {per_level: [25%, 35%, 45%, 55%, 65%]},
                   salvage_items: [{item: alien_sensor_probe_wreck, goodies: missile}, {item: alien_comm_jammer_probe_wreck, goodies: missile},
                     {item: alien_intel_jammer_probe_wreck, goodies: missile}, {item: alien_drone_wreck, goodies: missile}]}
  deep_space_contact: {name: Alien squadron, mission: deep_space_encounter, faction: alien, every: 4d, chance: 50%, target: system, speed: 1800, react_on_detect: {per_level: [25%, 35%, 45%, 55%, 65%]},
                   salvage_items: [{item: phase_cannon, goodies: beam}, {item: plasma_cannon, goodies: beam}, {item: psi_blaster, goodies: beam},
                     {item: elerium_torpedo, goodies: missile}, {item: enveloping_torpedo, goodies: missile}, {item: parallax_torpedo, goodies: missile},
                     {item: sectoid_corpse, goodies: alien_corpse}, {item: muton_corpse, goodies: alien_corpse}, {item: aereon_corpse, goodies: alien_corpse},
                     {item: ethereal_corpse, goodies: alien_corpse}, {item: psilord_corpse, goodies: alien_corpse},
                     {item: type_1_saucer_wreck, goodies: freighter}, {item: type_2_saucer_wreck, goodies: freighter}, {item: type_3_saucer_wreck, goodies: freighter}]}
  base_attack: {name: Alien strike on a base, mission: xcom_base_defense, faction: alien, every: 7d, chance: 40%, target: base, speed: 1600, requires: day >= 14, react_on_detect: {per_level: [25%, 35%, 45%, 55%, 65%]},
                   salvage_items: [{item: phase_cannon, goodies: beam}, {item: plasma_cannon, goodies: beam}, {item: psi_blaster, goodies: beam},
                     {item: elerium_torpedo, goodies: missile}, {item: enveloping_torpedo, goodies: missile}, {item: parallax_torpedo, goodies: missile},
                     {item: sectoid_corpse, goodies: alien_corpse}, {item: muton_corpse, goodies: alien_corpse}, {item: aereon_corpse, goodies: alien_corpse},
                     {item: ethereal_corpse, goodies: alien_corpse}, {item: psilord_corpse, goodies: alien_corpse},
                     {item: type_1_saucer_wreck, goodies: freighter}, {item: type_2_saucer_wreck, goodies: freighter}, {item: type_3_saucer_wreck, goodies: freighter}]}
  heavy_base_attack: {name: Alien assault on a base, mission: xcom_base_defense_heavy, faction: alien, every: 10d, chance: 30%, target: base, speed: 1600, requires: day >= 60, react_on_detect: {per_level: [25%, 35%, 45%, 55%, 65%]},
                   salvage_items: [{item: phase_cannon, goodies: beam}, {item: plasma_cannon, goodies: beam}, {item: psi_blaster, goodies: beam},
                     {item: elerium_torpedo, goodies: missile}, {item: enveloping_torpedo, goodies: missile}, {item: parallax_torpedo, goodies: missile},
                     {item: sectoid_corpse, goodies: alien_corpse}, {item: muton_corpse, goodies: alien_corpse}, {item: aereon_corpse, goodies: alien_corpse},
                     {item: ethereal_corpse, goodies: alien_corpse}, {item: psilord_corpse, goodies: alien_corpse},
                     {item: type_1_saucer_wreck, goodies: freighter}, {item: type_2_saucer_wreck, goodies: freighter}, {item: type_3_saucer_wreck, goodies: freighter}]}
  alien_freighters: {name: Alien freighter convoy, mission: ambush_alien_freighters, faction: alien, every: 6d, chance: 40%, target: system, speed: 1200, requires: day >= 20, react_on_detect: {per_level: [25%, 35%, 45%, 55%, 65%]}}
  # The Doomsday component convoys: launched by the plan (plans.doomsday), not by the roll.
  doomsday_convoy: {name: Alien Doomsday convoy, mission: ambush_alien_freighters_escorted, faction: alien, every: 30d, chance: 0%, target: system, speed: 1200}
  pirates: {name: Pirate squadron, mission: ambush_pirate_squadron, faction: pirate, every: 8d, chance: 35%, target: system, speed: 2000, requires: day >= 10}

pilots:
  stats: {intelligence: [50, 100], accuracy: [25, 100], flying: [25, 100], aggression: [25, 100], bravery: [25, 100], psionics: [1, 100], stamina: [50, 100]}
  ranks: {rookie: 0, ensign: 2, lieutenant: 10, lt_commander: 24, commander: 38}
  salary: 4000                       # 48,000 a year
  recruit_fee: 34000
  pool: 10
  heal_days: 14
  survive: 60%

scores:
  base_defended: 100
  convoy_defended: 60
  probe_destroyed: 40
  aliens_destroyed: 50
  alien_outpost_destroyed: 200
  undefended: -100
