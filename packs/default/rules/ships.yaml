# yaml-language-server: $schema=../../../schemas/rules.schema.json
# Craft of Perils of the Void. Models, textures and debris pieces are generated by
# tools/default_assets/ (models.py). Metres and seconds throughout; turn rates in degrees
# per second at rest, falling to zero at LockSpeed.
#
# --- Interplanetary Guard rockets (playable) -------------------------------------------
#

ships:
  comet:
    name: Comet
    description: "Light interceptor rocket: quick, nimble and lightly armed."
    model_set: comet
    faction: guard
    playable: true
    cockpit: guard
    hit_points: 110
    shields: 70
    shield_recharge: 6
    armor: 40
    max_speed: 620
    acceleration: 170
    roll_rate: 220
    pitch_rate: 110
    yaw_rate: 110
    angular_damp: 2
    lock_speed: 1100
    energy: 400
    energy_recharge: 55
    beams: [blaster, blaster]
    missiles: {seeker: 4}
    systems+: [ecm]
    behaviour: guard_pilot
    engine_color: [1.0, 0.55, 0.15]
  meteor:
    name: Meteor
    description: Twin-booster patrol rocket with a tractor ray and a robot repair crew.
    model_set: meteor
    faction: guard
    playable: true
    cockpit: guard
    hit_points: 160
    shields: 110
    shield_recharge: 7
    armor: 90
    max_speed: 560
    acceleration: 140
    roll_rate: 180
    pitch_rate: 90
    yaw_rate: 90
    angular_damp: 2.5
    lock_speed: 1050
    energy: 500
    energy_recharge: 60
    beams: [heat_ray, heat_ray, blaster, blaster]
    missiles: {seeker: 4, atomic_torpedo: 1, decoy_rocket: 2}
    systems+: [ecm, damage_control, tractor]
    behaviour: guard_pilot
    engine_color: [1.0, 0.55, 0.15]
  thunderbolt:
    name: Thunderbolt
    description: "Heavy four-finned strike rocket. Carries every gadget the Guard has: jammer, tractor ray, invisibility screen, gyro-jets."
    model_set: thunderbolt
    faction: guard
    playable: true
    cockpit: guard
    hit_points: 230
    shields: 160
    shield_recharge: 8
    armor: 160
    max_speed: 500
    acceleration: 110
    roll_rate: 150
    pitch_rate: 75
    yaw_rate: 75
    angular_damp: 3
    lock_speed: 1000
    energy: 650
    energy_recharge: 70
    vct: true
    beams: [disintegrator, disintegrator, heat_ray, heat_ray]
    missiles: {seeker: 4, atomic_torpedo: 3, cluster_rocket: 2}
    systems+: [ecm, damage_control, tractor, cloak]
    behaviour: guard_pilot
    engine_color: [1.0, 0.55, 0.15]
  victory:
    name: Victory
    description: "The Guard's flagship: an art-deco battleship rocket (story ship, Stage 5)."
    model_set: victory
    faction: guard
    kind: capital
    hit_points: 4000
    shields: 1200
    shield_recharge: 20
    armor: 1500
    max_speed: 220
    acceleration: 40
    roll_rate: 20
    pitch_rate: 12
    yaw_rate: 12
    angular_damp: 6
    lock_speed: 600
    energy: 3000
    energy_recharge: 200
    beams: [disintegrator, disintegrator, disintegrator, disintegrator, heat_ray, heat_ray]
    systems+: [ecm, damage_control]
    behaviour: gun_platform
    turret_arc: 150
    engine_color: [1.0, 0.6, 0.2]
