# yaml-language-server: $schema=../../../schemas/rules.schema.json
# Flight model and sensors. Newtonian: throttle is thrust and rockets coast.
flight:
  model: newtonian
  arena_radius: 30000
  boost: 160
  cost: 40
  lock_angle: 12
  radar_range: 6000
  hyperspace_time: 8

# Event sounds, synthesised by tools/default_assets/sounds.py.
sounds:
  explosion: sounds/explosion.wav
  big_explosion: sounds/big_explosion.wav
  shield_hit: sounds/shield_hit.wav
  hull_hit: sounds/hull_hit.wav
  lock: sounds/lock.wav
  missile_launch: sounds/seeker_launch.wav
  afterburner: sounds/afterburner.wav
  target: sounds/target.wav
  denied: sounds/denied.wav
  collision: sounds/collision.wav
  system_damage: sounds/system_damage.wav
  tractor: sounds/tractor.wav
  cloak: sounds/cloak.wav
  ecm: sounds/target.wav
  hyperspace: sounds/hyperspace.wav
  point_defence: sounds/ray_zap.wav
