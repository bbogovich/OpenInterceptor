# yaml-language-server: $schema=../../../../schemas/text.schema.json
# Mission names, briefings, radio chatter and debriefs (English).
text:
  mission.defend_station.name: "Defend the Guard station"
  mission.defend_station.brief: "Dominion saucers are closing on the Guard station. Fly out with two Comets, keep the station flying and send the saucers home in pieces. Robot sentinels have been sighted behind the first wave."
  mission.convoy_ambush.name: "Convoy ambush"
  mission.convoy_ambush.brief: "Two cargo clippers are hauling ore to the factory and the Black Comet gang knows it. Ride shotgun until the clippers are clear (four minutes) or the raiders are scrap. Lose both clippers and the cargo is gone."
  mission.construction_defence.name: "Construction defence"
  mission.construction_defence.brief: "The new research station stands at sixty percent: girders, half a hull and a crew in space suits. Dominion raiders want it wrecked before it is finished, and it cannot shoot back yet."
  mission.intercept_scouts.name: "Intercept the scouts"
  mission.intercept_scouts.brief: "Saucer scouts are mapping our sector. Catch them before they finish and slip away."
  chat.saucers_inbound: "Saucers inbound! Here they come, boys."
  chat.robots: "Robot sentinels on the scope!"
  chat.station_hurt: "Station to escort: we're hurt bad out here!"
  chat.ambush: "Clipper one to escort: we've got company. Hot-rods, and lots of them."
  chat.clipper_lost: "We've lost a clipper! Protect the other one!"
  chat.builders: "Construction boss here: keep 'em off our girders, flyboy."
  debrief.defend_station.win: "The station stands and the Dominion has a few saucers fewer. The Guard won't forget it."
  debrief.defend_station.lose: "The Guard station is lost. A dark day for the frontier."
  debrief.convoy.win: "The clippers made it through. The factory gets its ore."
  debrief.convoy.lose: "The clippers are gone and their cargo with them."
  debrief.construction.win: "The girders still stand. The builders are back at work."
  debrief.construction.lose: "The half-built station is a cloud of twisted girders. Back to the drawing board."
  debrief.scouts.win: "Every scout shot down: the Dominion stays in the dark."
  debrief.scouts.draw: "Some scouts got away with what they saw."
  debrief.scouts.lose: "You were shot down before the scouts were caught."
  debrief.retreat: "You left the battle before it was decided."
