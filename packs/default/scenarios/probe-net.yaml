# Stage 2 testbed: sensor and jamming probes.
id: probe-net
order: 19
title: "Probe net: sensors and jamming"
description: >-
  Your Sky-Eye probe 7 km ahead shows the saucers around it on your radar long before
  your own sensors reach them. A Dominion jamming buoy sits on the way: fly within
  2.5 km of it and your radar range halves and missile locks take twice as long. Shoot
  it down.
player: choose
player_position: [0, 0, 0]
starfield_seed: 12
objects:
  eye: {class: sky_eye_probe, position: [0, 200, -7000]}
  jammer: {class: jammer_buoy, position: [600, 0, -2500]}
  scout1: {class: scout_saucer, ai: enemy, position: [-800, 300, -9500], speed: 150}
  scout2: {class: scout_saucer, ai: enemy, position: [900, -200, -9800], speed: 150}
