# yaml-language-server: $schema=../../../schemas/scenario.schema.json
# Stage 2 testbed: ship systems in the default campaign.
id: systems-trial
order: 14
title: "Systems trial: salvage a crippled saucer"
description: >-
  A raider saucer drifts ahead with its rockets shot out. Tow it with the tractor ray
  (Shift+T; Meteor and Thunderbolt) and jump out with it (H) to capture it. Try the
  power controls (F9/F10, ; and ', S balance) and the Thunderbolt's invisibility screen
  (Shift+C). A Grappler will try to drag it off first. The prize is marked PROTECT:
  R (nearest enemy) skips it.
player: thunderbolt
player_position: [0, 0, 0]
sun: [-0.4, 0.45, -0.8]
starfield_seed: 44

objects:
  prize:
    class: raider_saucer
    position: [0, 0, -700]
    rotation: [30, 15, 0]
    speed: 15
    destroyed_systems: [engines, manoeuvring]
    hull: 0.5
    protect: true
  grappler:
    class: grappler
    ai: enemy
    position: [1500, 200, -5000]
    speed: 200
  scout1:
    class: scout_saucer
    ai: enemy
    position: [-1500, 300, -6000]
    speed: 300
  rock:
    class: cosmium_asteroid
    position: [-2000, -500, -2500]
    rotation: [10, 30, 0]
