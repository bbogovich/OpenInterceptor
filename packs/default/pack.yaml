# yaml-language-server: $schema=../../schemas/pack.schema.json
# The default campaign: "Perils of the Void", a 1950s film-serial space war.
# Everything in this pack was made for the project (tools/default_assets/ generates the
# models, textures and sounds); it uses NO original Interceptor content, so it plays
# without the CD. It is also the template for your own campaign: copy the folder,
# change the id, and edit. See the docs site, Modding > Your first mod.
id: default
name: Perils of the Void
version: "0.3"
kind: campaign
format: 2
description: Rocket ships of the Interplanetary Guard against the flying saucers of the Umbral Dominion.
authors: OpenInterceptor project
licence: MIT
requires_original: false
