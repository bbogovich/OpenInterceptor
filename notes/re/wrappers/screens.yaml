# X-COM: Interceptor (1998) strategy-screen interface, recovered from the player's own Interceptor.exe.
# Facts only: ids, rectangles, commands, string KEYS (never string text beyond short labels).
#
# Conventions
#   rect: [left, top, right, bottom] in 640x480 screen pixels (Win32 RECT, right/bottom exclusive).
#   center: [x, y] for widgets the exe positions by their centre (SpriteButtonC).
#   pos: [x, y] top-left for widgets the exe positions by corner (SpriteButtonTL).
#   id: the widget / command id the exe passes to the screen's callback or OnCommand.
#   images: WrappersDLL ids are plain numbers; SpritesDLL ids are written "spr:NNNNN".
#     Sprite buttons take a sprite-table index N and a state count S (last create argument); the
#     drawn image is sprite[N + state] (0x417e79), so S=2 gives up=N, pressed=N+1 and S=1 is a
#     single image (the CSD nav and panel buttons). "spr:A/B" lists both states.
#   conf: verified = read from code/tables; derived = inferred from art, strings or context.
#   screen ids are the exe's own screen numbers (global 0x682368), see navigation.md.

screens:

  - id: 17
    name: CSD (Command and Strategic Display, star map)
    source: CSD.cpp
    class_vtable: 0x65fbc0
    create: 0x437730          # new 0x638c bytes, ctor 0x4377f0, Init 0x438101
    background: 5030
    controls:
      - {kind: map, what: round star map (hit rect), rect: [66, 61, 399, 394], conf: verified,
         note: "SetRect(0,0,333,333) centred on (232,227); LButtonDown/Up/RButton -> 0x4431ad(mode,x,y)"}
      - {kind: frame, what: map bezel overlay, image: 5050, pos: [52, 58], conf: verified}
      - {kind: minimap, rect: [502, 43, 596, 137], image_mask: 5051, conf: verified,
         note: "click/drag -> 0x44c240 converts to map coords, 0x447a14 recentres"}
      - {kind: lamp, what: 4 animated red map-corner lamps, images: "spr:1900-1909",
         pos: [[59, 70], [348, 70], [348, 354], [59, 354]], conf: verified}
      - {kind: lamp, what: status lamp, images: [5060, 5061, 5062, 5063, 5064], pos: [618, 453], conf: verified}
      - {kind: text, what: status/help line, rect: [344, 457, 620, 472], conf: verified,
         note: "member rect +0x556c; art bar measures [343,460,612,475]"}
      - {kind: text, what: four readouts (date / time / funds / ...), conf: derived,
         rects: [[495, 365, 628, 380], [495, 385, 628, 401], [495, 406, 628, 421], [495, 426, 628, 441]],
         note: "measured from the green bars in 5030; which readout is which is not yet recovered"}
      - {kind: clock, what: time-speed dial, id: 100, widget: TimeDial 0x4cca65, center: [562, 304],
         rect: [507, 250, 617, 358], conf: verified,
         holes: [[523, 322], [536, 336], [554, 344], [574, 344], [592, 335], [605, 322]],
         action: "time speed 0..5 (6 holes); keys '1'..'6' (cmd 49..54) do the same",
         images: "spr:18500-18509 (needle), spr:18600-18611 (hole lamps)"}
      - {kind: toggle, id: 101, widget: 0x4cd8a4, pos: [13, 25], conf: verified,
         action: "toggles CSD display mode (member +0x56c4) -> 0x4443a7", note: "small top-left knob in 5030"}
      - {kind: pan, id: 200, widget: PanWidget 0x5156ad, pos: [30, 445], images: "spr:1800-1803", conf: verified,
         action: "pan the map (0x515839)"}
      - {kind: button, id: 600, center: [460, 429], images: "spr:19200/19201", action: "launch mission (0x446ddc -> Launch Mission dialog)", conf: verified}
      - {kind: button, id: 601, center: [460, 385], images: "spr:19202/19203", action: "launch probe (0x445f5b -> choose-probe pick list)", conf: verified}
    panel_modes:      # member +0x5d54; the six nav buttons are rebuilt by 0x4416dc for each mode
      - mode: 0  # normal
        buttons:
          - {id: 504, center: [516, 194], images: "spr:18000", action: "open Bases (screen 6)", conf: verified}
          - {id: 515, center: [563, 194], images: "spr:18008", action: "open Equip Ships (screen 8)", conf: verified}
          - {id: 500, center: [609, 194], images: "spr:18010", action: "open status-report panel (mode 1, image 5057)", conf: verified}
          - {id: 502, center: [516, 226], images: "spr:18006", action: "open Research (screen 9)", conf: verified}
          - {id: 516, center: [563, 226], images: "spr:18004", action: "open Equipment & Personnel (screen 18)", conf: verified}
          - {id: 503, center: [609, 226], images: "spr:18002", action: "open UFOpedia panel (mode 2, image 5052)", conf: verified}
      - mode: 1  # status reports slide-out (5057)
        buttons:
          - {id: 800, center: [544, 69], images: "spr:29400", action: "Income report (screen 32)", conf: verified}
          - {id: 801, center: [544, 102], images: "spr:29401", action: "Finance report (screen 33)", conf: verified}
