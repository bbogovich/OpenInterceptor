# Publishes the documentation site on every push to the docs branch: a strict build
# (the same as `./docs.sh build`), committed to the gh-pages branch, which GitHub Pages
# serves. A broken link fails the run and nothing is published.
name: Publish docs

on:
  push:
    branches: [docs]
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - name: Build strictly and push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --strict --force --remote-branch gh-pages
