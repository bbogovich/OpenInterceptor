[package]
name = "openinterceptor"
version = "0.4.2"
edition = "2021"
rust-version = "1.86"
publish = false
license = "MIT"
description = "Moddable space-combat simulator engine; plays X-COM: Interceptor from the player's own data"

# Dependencies are avoided by default (see docs: Architecture > Dependencies).
# macroquad: window, OpenGL, input, textures, audio — the same pinned version ArenaVM and
# Looking Glass use. Everything else (PE resources, meshes, textures, INI, ADPCM, OBJ) is
# implemented in this crate.
[dependencies]
# The "audio" feature adds macroquad's own small sound backend (quad-snd: CoreAudio on macOS,
# ALSA on Linux — the Linux build needs the ALSA development package).
macroquad = { version = "=0.4.14", features = ["audio"] }
# Vector/matrix/quaternion maths. Already in the tree through macroquad (same version), so
# depending on it directly adds nothing to the build — but it lets the `sim` layer use
# maths types without depending on the windowing library.
glam = "=0.27.0"
# PNG decoding for mod textures. Also already in the tree through macroquad with this exact
# version and feature, so it adds nothing to the build; used directly so the content layer
# can decode images without the windowing library.
image = { version = "=0.24.9", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
