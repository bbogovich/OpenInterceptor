<!doctype html>
<!-- OpenInterceptor control console (C1: pairing, telemetry, every action as a button).
     Served by the game itself (src/remote); plain HTML, CSS and custom elements, no build step. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OpenInterceptor console</title>
<link rel="stylesheet" href="console.css">
</head>
<body>
<oi-pairing></oi-pairing>
<main id="console" hidden>
  <oi-mode></oi-mode>
  <!-- All-in-one: every control expanded. -->
  <section id="allinone">
    <oi-telemetry></oi-telemetry>
    <oi-throttle></oi-throttle>
    <oi-actions></oi-actions>
  </section>
  <!-- Cockpit: the layout of the design proposal. -->
  <section id="cockpit">
    <oi-hud-strip></oi-hud-strip>
    <div class="mid"><oi-shields></oi-shields><oi-display></oi-display><oi-power></oi-power></div>
    <oi-tiles></oi-tiles>
  </section>
</main>
<oi-static aria-hidden="true"></oi-static>
<script src="console.js"></script>
</body>
</html>
