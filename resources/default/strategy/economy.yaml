# yaml-language-server: $schema=../../../schemas/rules.schema.json
# The Guard's economy (Stage 4.13): the Senate's stipend, equipment, hulls, base modules.

economy:
  delivery: 48h
  salvage_per_kill: 15000
  dismantle: 50%                 # of a module's or base's cost, back when dismantled
  repair: 50%                    # of a wrecked module's cost and build time, to repair it

incomes:
  senate_stipend: {name: Senate stipend, every: 30d, amount: 400000 + 60000 * bases + month_score * 200 + relation(senate) * 3000}
  cosmium_sales: {name: Cosmium sales, every: 7d, amount: 12000 * module_count(cosmium_refinery)}

# Frontier colonies the Guard protects: each pays monthly from its platforms (exchange rate x
# yields x funding), its funding drifts with the month's scores in its system, it pulls out
# when funding falls under 3 %, and a good month brings a new one. (See Modding > Strategy >
# outposts.) The Senate's stipend above still pays the most.
outposts:
  exchange_rate: 20
  yield_table: [[100, 200, 300, 400, 500], [150, 300, 450, 600, 750], [200, 400, 600, 800, 1000]]
  min_age: 20d
  growth: {per_level: [[1, 2], [1, 1], [0, 1]], max_per_month: 1, max: 4}
  start: [1, 1]
  min_opps: 3

# Purchases and finished goods are carried from the colonies by their freighters: 100 units a
# load (a ship fills one), 300 map units an hour, an hour to unload and two to refuel.
shipments: {capacity: 100, speed: 300, unload: 1h, refuel: 2h}

expenses:
  fuel: {name: Fuel and stores, every: 7d, amount: 4000 * craft}

items:
  # Artefacts: no price, recovered by salvage only (see raids.yaml).
  dominion_power_cell: {name: Dominion power cell, kind: artefact}
  blaster: {name: Blaster, kind: beam, cost: 40000, sell_price: 20000, prod_time: 300}
  heat_ray: {name: Heat ray, kind: beam, cost: 90000, sell_price: 45000, prod_time: 600}
  ion_ray: {name: Ion ray, kind: beam, cost: 150000, sell_price: 75000, prod_time: 900}
  disintegrator: {name: Disintegrator, kind: beam, cost: 260000, sell_price: 130000, prod_time: 1400}
  seeker: {name: Seeker rocket, kind: missile, cost: 6000, sell_price: 3000, prod_time: 40, size: 0.2, rounds: 4}
  atomic_torpedo: {name: Atomic torpedo, kind: missile, cost: 30000, sell_price: 15000, prod_time: 150, size: 0.5, rounds: 2}
  cluster_rocket: {name: Cluster rocket, kind: missile, cost: 22000, sell_price: 11000, prod_time: 120, size: 0.4, rounds: 3}
  cosmium: {name: Cosmium, kind: goods, cost: 0, sell_price: 9000, size: 0.1}
  # Protection: a fitted shield sets shield points per facing, armour sets armour points
  # (protection:); a craft without them flies its class's own values.
  deflector_screen: {name: Deflector screen, kind: shield, protection: 300, cost: 60000, sell_price: 30000, prod_time: 400}
  force_field: {name: Force field, kind: shield, protection: 480, cost: 140000, sell_price: 70000, prod_time: 900}
  steel_plating: {name: Steel plating, kind: armor, protection: 180, cost: 30000, sell_price: 15000, prod_time: 250}
  saucer_alloy: {name: Saucer-alloy plating, kind: armor, protection: 380, cost: 110000, sell_price: 55000, prod_time: 800}

hulls:
  comet: {cost: 450000, prod_time: 6000, upkeep: 9000, speed: 700, slots: {beam: 2, missile: 2, special: 1, shield: 1, armor: 1}}
  meteor: {cost: 700000, prod_time: 9000, upkeep: 14000, speed: 800, slots: {beam: 2, missile: 3, special: 2, shield: 1, armor: 1}}
  thunderbolt: {cost: 1100000, prod_time: 14000, upkeep: 20000, speed: 750, slots: {beam: 3, missile: 4, special: 2, shield: 1, armor: 1}}
  victory: {cost: 1900000, prod_time: 22000, upkeep: 30000, speed: 900, slots: {beam: 4, missile: 4, special: 3, shield: 1, armor: 1}}

base_modules:
  # on_destroyed: what has no room once a raid wrecks the module is lost with it.
  hangar: {name: Hangar, group: hangar, cost: 250000, build_time: 10d, maintenance: 8000, effects: {hangar: 3}, on_destroyed: [craft]}
  quarters: {name: Crew quarters, group: quarters, cost: 120000, build_time: 7d, maintenance: 4000, effects: {quarters: 6}, on_destroyed: [pilots]}
  radar: {name: Radar dish, group: sensor, cost: 150000, build_time: 7d, maintenance: 5000, effects: {sensor_range: 2400}}
  deep_radar: {name: Deep radar array, group: sensor, cost: 400000, build_time: 14d, maintenance: 12000, effects: {sensor_range: 4500}}
  laboratory: {name: Laboratory, group: research, cost: 300000, build_time: 12d, maintenance: 12000, effects: {research_rate: 12}}
  workshop: {name: Workshop, group: production, cost: 280000, build_time: 12d, maintenance: 10000, effects: {production_rate: 10}}
  shipyard: {name: Orbital shipyard, group: production, cost: 650000, build_time: 21d, maintenance: 20000, effects: {production_rate: 30}}
  cosmium_refinery: {name: Cosmium refinery, group: industry, cost: 500000, build_time: 18d, maintenance: 9000, effects: {income: 1}}
  ray_battery: {name: Ray battery, group: defence, cost: 200000, build_time: 7d, maintenance: 6000, effects: {defence: 1}}
  supply_depot: {name: Supply depot, group: storage, cost: 150000, build_time: 7d, maintenance: 3000, effects: {storage: 150}, on_destroyed: [stock]}

base_types:
  guard_base:
    name: Guard base
    cost: 1800000
    build_time: 21d
    max_bases: 6
    sensor_range: 1200
    hangar: 2
    quarters: 6
    storage: 120                   # the hub's store, in item sizes; supply depots add room
    placement: base_distance(system) <= 3500     # within 3500 map units of one of your bases
    limits: {hangar: 3, sensor: 1, research: 3, production: 2, industry: 2, defence: 4, quarters: 2, storage: 2}
    # A module, or a module group: the best of that group researched so far (the deep
    # radar once it is known).
    template: [hangar, sensor, laboratory]
    # The hub's hull: an unopposed strike takes 800 points, which mend at 1 a minute (at
    # least 5 an hour slice), twice as fast with a ray battery standing guard.
    hull: 4000
    repair: {per_minute: 1, min_step: 5, boost: {ray_battery: 2}}
    strike_damage: 800

# The Senate's monthly evaluation: the first rating whose condition holds (R-STR-009).
evaluations:
  - {rating: Outstanding, when: month_score >= 400, do: ["money(150000)", "news(The Senate commends the Guard's month)"]}
  - {rating: Satisfactory, when: month_score >= 0}
  - {rating: Poor, when: month_score >= -300, do: ["money(-50000)"]}
  - {rating: Unacceptable, do: ["money(-150000)", "news(The Senate cuts the Guard's funding)"]}
