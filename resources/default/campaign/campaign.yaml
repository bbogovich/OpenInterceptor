# yaml-language-server: $schema=../../../schemas/rules.schema.json
# The campaign ruleset of Perils of the Void. Stage 2 uses the difficulty levels; the
# game flow (start state, victory, chapters) arrives in Stages 4 and 5.
campaign:
  name: Perils of the Void
  difficulty: [cadet, ranger, captain, space_ace]
  default_difficulty: ranger
