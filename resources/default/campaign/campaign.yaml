# yaml-language-server: $schema=../../../schemas/rules.schema.json
# The campaign ruleset of Perils of the Void. Stage 2 uses the difficulty levels; the
# game flow (start state, victory, chapters) arrives in Stages 4 and 5.
campaign:
  name: Perils of the Void
  difficulty: [cadet, ranger, captain, space_ace]
  default_difficulty: ranger
  skin: deco
  intro: intro
  # The main menu and credits (Stage 6.2).
  menu: {subtitle: "A serial of the space frontier, in twelve chapters", showcase: comet, starfield_seed: 31}
  credits:
    lines:
      - "# Perils of the Void"
      - the default campaign of OpenInterceptor
      - ""
      - "# Story, missions and art"
      - generated by the tools in tools/default_assets
      - ""
      - "# Music"
      - synthesised by tools/default_assets/music.py
