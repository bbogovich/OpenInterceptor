# yaml-language-server: $schema=../../../schemas/rules.schema.json
# Craft of Perils of the Void. Models, textures and debris pieces are generated by
# tools/default_assets/ (models.py). Metres and seconds throughout; turn rates in degrees
# per second at rest, falling to zero at LockSpeed.
#
# --- Interplanetary Guard rockets (playable) -------------------------------------------
#

ships:
  comet:
    name: "@ship.comet.name"
    description: "@ship.comet.desc"
    model_set: comet
    faction: guard
    playable: true
    cockpit: guard
    hit_points: 110
    shields: 70
    shield_recharge: 6
    armor: 40
    max_speed: 620
    acceleration: 170
    roll_rate: 220
    pitch_rate: 110
    yaw_rate: 110
    angular_damp: 2
    lock_speed: 1100
    energy: 400
    energy_recharge: 55
    beams: [blaster, blaster]
    missiles: {seeker: 4}
    systems+: [ecm]
    behaviour: guard_pilot
    engine_color: [1.0, 0.55, 0.15]
  meteor:
    name: "@ship.meteor.name"
    description: "@ship.meteor.desc"
    model_set: meteor
    faction: guard
    playable: true
    cockpit: guard
    hit_points: 160
    shields: 110
    shield_recharge: 7
    armor: 90
    max_speed: 560
    acceleration: 140
    roll_rate: 180
    pitch_rate: 90
    yaw_rate: 90
    angular_damp: 2.5
    lock_speed: 1050
    energy: 500
    energy_recharge: 60
    beams: [heat_ray, heat_ray, blaster, blaster]
    missiles: {seeker: 4, atomic_torpedo: 1, decoy_rocket: 2}
    systems+: [ecm, damage_control, tractor]
    behaviour: guard_pilot
    engine_color: [1.0, 0.55, 0.15]
  thunderbolt:
    name: "@ship.thunderbolt.name"
    description: "@ship.thunderbolt.desc"
    model_set: thunderbolt
    faction: guard
    playable: true
    cockpit: guard
    hit_points: 230
    shields: 160
    shield_recharge: 8
    armor: 160
    max_speed: 500
    acceleration: 110
    roll_rate: 150
    pitch_rate: 75
    yaw_rate: 75
    angular_damp: 3
    lock_speed: 1000
    energy: 650
    energy_recharge: 70
    vct: true
    beams: [disintegrator, disintegrator, heat_ray, heat_ray]
    missiles: {seeker: 4, atomic_torpedo: 3, cluster_rocket: 2}
    systems+: [ecm, damage_control, tractor, cloak]
    behaviour: guard_pilot
    engine_color: [1.0, 0.55, 0.15]
  victory:
    name: "@ship.victory.name"
    description: "@ship.victory.desc"
    model_set: victory
    faction: guard
    kind: capital
    hit_points: 4000
    shields: 1200
    shield_recharge: 20
    armor: 1500
    max_speed: 220
    acceleration: 40
    roll_rate: 20
    pitch_rate: 12
    yaw_rate: 12
    angular_damp: 6
    lock_speed: 600
    energy: 3000
    energy_recharge: 200
    beams: [disintegrator, disintegrator, disintegrator, disintegrator, heat_ray, heat_ray]
    systems+: [ecm, damage_control]
    behaviour: gun_platform
    turret_arc: 150
    engine_color: [1.0, 0.6, 0.2]
  # --- Umbral Dominion saucers and robots -----------------------------------------------
  scout_saucer:
    hover: true                # in an atmosphere: hovers on its drive (no wings)
    lift: 0
    name: "@ship.scout_saucer.name"
    description: "@ship.scout_saucer.desc"
    model_set: scout_saucer
    faction: dominion
    hit_points: 80
    shields: 60
    armor: 20
    max_speed: 680
    acceleration: 190
    roll_rate: 240
    pitch_rate: 120
    yaw_rate: 130
    angular_damp: 1.5
    lock_speed: 1200
    energy: 350
    energy_recharge: 50
    vct: true
    beams: [paralyzer_ray]
    behaviour: saucer_scout
    engine_color: [0.5, 1.0, 0.3]
  raider_saucer:
    hover: true                # in an atmosphere: hovers on its drive (no wings)
