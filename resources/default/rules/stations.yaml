# yaml-language-server: $schema=../../../schemas/rules.schema.json
# Stations and bodies. Turrets, modules and construction states arrive later in Stage 2.
#

objects:
  guard_station:
    point_defence: {range: 1.2km, rate: 4, chance: 40%, energy: 3}
    modules:
      - {slot: turret1, class: guard_turret}
      - {slot: turret2, class: guard_turret}
      - {slot: turret3, class: guard_turret}
      - {slot: turret4, class: guard_turret}
      - {slot: turret5, class: guard_turret}
      - {slot: turret6, class: guard_turret}
      - {slot: shield1, class: guard_shield_generator}
      - {slot: shield2, class: guard_shield_generator}
    name: "@object.guard_station.name"
    description: "@object.guard_station.desc"
    model_set: guard_station
    faction: guard
    # Sturdier at cadet: the defence missions promise 150 s undefended there (soak test).
    hit_points: {per_level: [11000, 8000, 8000, 8000]}
    shields: 1500
    armor: 2000
  dominion_outpost:
    point_defence: {range: 1.2km, rate: 4, chance: 40%, energy: 3}
    modules:
      - {slot: pod1, class: dominion_turret_pod}
      - {slot: pod2, class: dominion_turret_pod}
      - {slot: pod3, class: dominion_turret_pod}
      - {slot: pod4, class: dominion_turret_pod}
      - {slot: pod5, class: dominion_turret_pod}
      - {slot: pod6, class: dominion_turret_pod}
      - {slot: shield1, class: dominion_shield_pod}
    name: "@object.dominion_outpost.name"
    description: "@object.dominion_outpost.desc"
    model_set: dominion_outpost
    faction: dominion
    hit_points: 6000
    shields: 1200
    armor: 1500
  cosmium_asteroid:
    name: "@object.cosmium_asteroid.name"
    description: "@object.cosmium_asteroid.desc"
    model_set: cosmium_asteroid
    faction: neutral
    hit_points: 20000
  space_mine:
    name: "@object.space_mine.name"
    description: "@object.space_mine.desc"
    model_set: robot_sentinel
    kind: mine
    faction: dominion
    hit_points: 30
    missiles: {mine_warhead: 1}
    behaviour: space_mine

  # Station modules (mounted on the stations above).
  guard_turret:
    name: "@object.guard_turret.name"
    model_set: guard_turret
    faction: guard
    hit_points: 300
    armor: 100
    beams: [heat_ray, heat_ray]
    turret_arc: 180
    behaviour: station_turret
  guard_shield_generator:
    name: "@object.guard_shield_generator.name"
    model_set: guard_shield_generator
    faction: guard
    hit_points: 500
    armor: 150
    shield_generator: true
  dominion_turret_pod:
    name: "@object.dominion_turret_pod.name"
    model_set: dominion_turret_pod
    faction: dominion
    hit_points: 280
    armor: 80
    beams: [death_ray]
    turret_arc: 180
    behaviour: station_turret
  dominion_shield_pod:
    name: "@object.dominion_shield_pod.name"
    model_set: dominion_shield_pod
    faction: dominion
    hit_points: 450
    armor: 120
    shield_generator: true
