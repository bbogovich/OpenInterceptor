# yaml-language-server: $schema=../../../schemas/rules.schema.json
# Battle environments and terrains for the default campaign (Stage 3.3-3.5; R-MSN-008,
# R-FLT-011, R-FLT-012). A mission or scenario picks one with `environment: <id>`;
# without it the battle is in open space.
environments:
  orbit:
    # High orbit over a blue world: open-space physics, a planet in the sky.
    backdrop: {planet: {color: [0.30, 0.52, 0.95], size: 48, direction: [0.25, -0.55, -1]}}
  pocket:
    # A small, enclosed arena (a nebula pocket): tight, close-quarters fights.
    arena: 12km
    backdrop: {nebula: {color: [0.60, 0.22, 0.62], second_color: [0.20, 0.40, 0.85], density: 0.85, seed: 7}}
  moon_surface:
    # A cratered moon: thin air, low gravity, a dark violet sky with stars showing.
    physics: atmosphere
    gravity: 3.7
    air_density: 0.35
    ceiling: 9km
    terrain: craters
    sky: {top: [0.03, 0.02, 0.08], horizon: [0.32, 0.24, 0.34], fog: [0.30, 0.23, 0.32], fog_distance: 14km, stars: 0.6}
  dusk_hills:
    # Rolling hills at dusk: thick air, full gravity, a warm sky. Rockets need speed to fly.
    physics: atmosphere
    gravity: 9.8
    air_density: 1.0
    ceiling: 7km
    terrain: hills
    sky: {top: [0.10, 0.12, 0.30], horizon: [0.95, 0.55, 0.35], fog: [0.80, 0.50, 0.38], fog_distance: 10km, stars: 0.1}

terrains:
  craters:
    generate: {kind: craters, seed: 7}
    size: 30km
    height: [0, 1600]
    colors: {low: [0.30, 0.27, 0.26], high: [0.62, 0.58, 0.55], slope: [0.20, 0.18, 0.18]}
    # Up close: moon dust tiling every 40 m, bare rock on the crater walls (generated by
    # tools/default_assets/terrain.py; the texture multiplies the colours above).
    detail: textures/terrain_regolith.png
    detail_scale: 40m
    slope_detail: textures/terrain_rock.png
    # Decoration only: craft fly through it (installations are real objects).
    scatter:
      - {model: models/scatter_rock.obj, count: 8000, scale: [1.0, 3.0], max_slope: 30deg, align: 1, draw_distance: 2500m}
      - {model: models/scatter_boulder.obj, count: 1500, scale: [0.8, 2.0], max_slope: 22deg, align: 0.6, draw_distance: 5km}
  hills:
    generate: {kind: hills, seed: 3}
    size: 30km
    height: [0, 1400]
    colors: {low: [0.22, 0.33, 0.16], high: [0.55, 0.50, 0.32], slope: [0.36, 0.30, 0.22]}
    detail: textures/terrain_grass.png
    detail_scale: 30m
    slope_detail: textures/terrain_rock.png
    scatter:
      # Woods on the lower, gentler ground; boulders anywhere not too steep.
      - {model: models/scatter_tree.obj, count: 6000, scale: [0.7, 1.5], max_slope: 18deg, height: [0, 900], draw_distance: 5km}
      - {model: models/scatter_boulder.obj, count: 1000, scale: [0.5, 1.2], max_slope: 28deg, align: 0.8, draw_distance: 4km}
