# yaml-language-server: $schema=../../../schemas/rules.schema.json
# Looks of Perils of the Void: every craft's model, its scorched and burnt damage
# textures, the pieces it breaks into and its explosion. All models and textures are
# generated by tools/default_assets/. Docs: Modding > Model sets.

effects:
  explosion_small: {size: 2.5, duration: 1.2s, color: [1, 0.62, 0.25]}
