# yaml-language-server: $schema=../../../schemas/rules.schema.json
# Radio voices (Stage 3.7; R-MSN-007). The default campaign has no recorded speech yet:
# its Guard pilots answer with synthesised radio chirps (tools/default_assets/sounds.py).
# name and face are shown on the cockpit comms panel while a voice speaks (Stage 6.6); the
# faces are generated by tools/default_assets/textures.py.
voices:
  guard_pilot:
    name: Guard Wing
    face: textures/portrait_guard.png
    acknowledge: [sounds/radio_ack.wav]
    status: [sounds/radio_status.wav]
    down: [sounds/radio_down.wav]
  colony_control:
    name: Colony Control
    face: textures/portrait_colony.png
