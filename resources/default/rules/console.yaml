# yaml-language-server: $schema=../../../schemas/rules.schema.json
# The tablet console's look for the default campaign (R-CON-020): the retro art-deco
# style of its HUD and menus. Brass lines on midnight panels, cream text, amber values.
console:
  theme:
    colors:
      bg: [0.05, 0.04, 0.08]
      panel: [0.10, 0.08, 0.14]
      line: [0.79, 0.64, 0.29]
      ink: [0.95, 0.90, 0.78]
      dim: [0.61, 0.56, 0.45]
      hot: [1.00, 0.81, 0.35]
      warn: [1.00, 0.60, 0.24]
      danger: [0.90, 0.33, 0.29]
      off: [0.29, 0.27, 0.21]
    font: "Futura, 'Avenir Next', 'Century Gothic', 'Trebuchet MS', sans-serif"
    corner: 2
