# yaml-language-server: $schema=../../../../schemas/text.schema.json
# Player-visible text for the default campaign (English). Rules and scenarios name
# these strings by key ("@ship.comet.name"); a translation is the same keys in
# text/<language>/.
text:
  object.guard_station.name: "Guard station"
  object.guard_station.desc: "An art-deco spire with a docking ring: home of the Interplanetary Guard."
  object.dominion_outpost.name: "Dominion outpost"
  object.dominion_outpost.desc: "A dark spiked hub of the Umbral Dominion."
  object.cosmium_asteroid.name: "Cosmium asteroid"
  object.cosmium_asteroid.desc: "A rock veined with glowing cosmium crystals."
  object.space_mine.name: "Dominion space mine"
  object.space_mine.desc: "A spiked sphere that waits in the dark and goes off when a ship comes near."
  object.guard_turret.name: "Guard ray turret"
  object.guard_shield_generator.name: "Force-field generator"
  object.dominion_turret_pod.name: "Death-ray pod"
  object.dominion_shield_pod.name: "Shield pod"
  object.sky_eye_probe.name: "Sky-Eye probe"
  object.jammer_buoy.name: "Jamming buoy"
  object.mining_facility.name: "Mining facility"
  object.mining_facility.desc: "An ore refinery bolted to an asteroid: drills, hoppers and a docking cradle for the supply clippers."
  object.research_station.name: "Research station"
  object.research_station.desc: "An observatory of domes, dishes and laboratory rings, where the Guard's boffins chase the frontier of science."
  object.manufacturing_center.name: "Manufacturing center"
  object.manufacturing_center.desc: "An orbital factory: smelter drums, cargo bays and gantries where new rockets take shape."
  object.supply_pod.name: "Cargo pod"
  object.supply_pod.desc: "A detachable container of ore, parts or finished goods."
  object.guard_colony.name: "Guard colony"
  object.guard_colony.desc: "A Guard mining colony on a moon's surface: domes, drills and the people who work them."
  object.dominion_flak.name: "Dominion flak battery"
  object.dominion_flak.desc: "A Dominion anti-air battery dug into the ground: a death-ray turret that tracks low fliers."
