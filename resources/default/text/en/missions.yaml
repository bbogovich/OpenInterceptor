# yaml-language-server: $schema=../../../../schemas/text.schema.json
# Mission names, briefings, radio chatter and debriefs (English).
text:
  mission.defend_station.name: "Defend the Guard station"
  mission.defend_station.brief: "Dominion saucers are closing on the Guard station. Fly out with two Comets, keep the station flying and send the saucers home in pieces. Robot sentinels have been sighted behind the first wave."
  mission.convoy_ambush.name: "Convoy ambush"
  mission.convoy_ambush.brief: "Two cargo clippers are making for their jump point, ten minutes out, and the Dominion wants the cargo. Grapplers will come for the pods with saucer escorts; raiders will try to cripple the clippers for them. Keep the clippers and their cargo together until they jump."
  mission.construction_defence.name: "Construction defence"
  mission.construction_defence.brief: "The new research station stands at sixty percent: girders, half a hull and a crew in space suits. Dominion raiders want it wrecked before it is finished, and it cannot shoot back yet."
  mission.intercept_scouts.name: "Intercept the scouts"
  mission.intercept_scouts.brief: "Saucer scouts are mapping our sector. Catch them before they finish and slip away."
  chat.saucers_inbound: "Saucers inbound! Here they come, boys."
  chat.robots: "Robot sentinels on the scope!"
  chat.station_hurt: "Station to escort: we're hurt bad out here!"
  chat.ambush: "Clipper one to escort: we've got company. Hot-rods, and lots of them."
  chat.clipper_lost: "We've lost a clipper! Protect the other one!"
  chat.builders: "Construction boss here: keep 'em off our girders, flyboy."
  debrief.defend_station.win: "The station stands and the Dominion has a few saucers fewer. The Guard won't forget it."
  debrief.defend_station.lose: "The Guard station is lost. A dark day for the frontier."
  debrief.convoy.win: "The clippers made it through. The factory gets its ore."
  debrief.convoy.lose: "The clippers are gone and their cargo with them."
  debrief.construction.win: "The girders still stand. The builders are back at work."
  debrief.construction.lose: "The half-built station is a cloud of twisted girders. Back to the drawing board."
  debrief.scouts.win: "Every scout shot down: the Dominion stays in the dark."
  debrief.scouts.draw: "Some scouts got away with what they saw."
  debrief.scouts.lose: "You were shot down before the scouts were caught."
  debrief.retreat: "You left the battle before it was decided."
  mission.colony_defence.name: "Colony defence"
  mission.colony_defence.brief: "Saucers are coming over the horizon at a Guard mining colony on a cratered moon. Thin air, low gravity: fly low, keep them off the domes."
  mission.ground_strike.name: "Ground strike"
  mission.ground_strike.brief: "Dominion flak batteries are dug into the hills. Knock them all out. They track low fliers: come in fast and keep moving."
  mission.outpost_raid.name: "Outpost raid"
  mission.outpost_raid.brief: "A Dominion outpost in high orbit is spotting for their raids. Destroy it; its guards will not make it easy."
  mission.asteroid_hunt.name: "Asteroid hunt"
  mission.asteroid_hunt.brief: "Dominion scouts are hiding in a cosmium asteroid field. Flush them out before they report back. Watch the rocks."
  mission.pocket_ambush.name: "Pocket ambush"
  mission.pocket_ambush.brief: "Black Comet hot-rods have lured you into a nebula pocket, and an ion storm blinds your radar. Fight your way out."
  chat.colony_inbound: "Colony control: saucers on the horizon, coming in low!"
  chat.colony_hurt: "Colony control: we're taking hits, the domes won't hold!"
  chat.flak_ahead: "Flak batteries ahead. Stay fast, stay low."
  debrief.colony.win: "The colony stands. The miners will be buying drinks for a week."
  debrief.colony.lose: "The colony is rubble. The Dominion has a foothold on the surface."
  debrief.flak.win: "Every battery silenced: the hills are open for the landing."
  debrief.flak.draw: "Some batteries still stand. The landing will have to wait."
  debrief.outpost.win: "The outpost is gone, and the Dominion is blind on this side of the system."
  debrief.pocket.win: "The ambush is broken, and the hot-rods scatter into the nebula."
  debrief.killed: "Your rocket was shot down. The Guard will send another pilot."
  chat.grapplers: "Grapplers inbound with escorts - they're after the cargo pods!"
  chat.cargo_taken: "Convoy: we've lost a quarter of the cargo!"
  chat.jump_soon: "Convoy: one minute to the jump point. Hold them off!"
  debrief.convoy.draw: "A crippled clipper limps on, and the tugs' crews will be back - but what is still aboard is yours."
